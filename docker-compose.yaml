# Required the following environement variables:
# - OPTA_USERNAME
# - OPTA_PASSWORD
# - OPTA_SECRET
# - OPTA_ADMIN_PASSWORD
# - OPTA_ADMIN_USERNAME
#
version: "3.8" 
services: 
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mqtt
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    environment:
      OPTA_USERNAME: ${OPTA_USERNAME}
      OPTA_PASSWORD: ${OPTA_PASSWORD}
    command: 
      - /bin/sh
      - -c
      - |
        cf="/mosquitto/config/mosquitto.conf"
        pf="/mosquitto/config/mosquitto.pass"
        if [ ! -f $$cf ]; then
          echo "> Creating config file $$cf"
          echo -n "
            allow_anonymous false
            listener 1883
            persistence true
            password_file mosquitto/config/mosquitto.pass
            persistence_location /mosquitto/data/
          " > $$cf
        else
          echo "> Found config file $$cf"
        fi
        cat $$cf
        echo " "
        if [ ! -f $$pf ]; then
          echo "> Creating password file"
          touch $$pf
          chown mosquitto:mosquitto $$pf
          chmod 600 $$pf
          /usr/bin/mosquitto_passwd -b $$pf $$OPTA_USERNAME $$OPTA_PASSWORD
        fi
        echo "> Running Eclipse-Mosquitto MQTT"
        /usr/sbin/mosquitto -c $$cf
    ports:
      - 1883:1883
    networks:
      - optanet 
    volumes:
      - mosquitto_config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: mosquitto_sub -u $$OPTA_USERNAME -P $$OPTA_PASSWORD -t '$$SYS/#' -C 1 -i healthcheck -W 3
      interval: 10s
      timeout: 10s
      retries: 3   
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
  influxdb:
    image: influxdb:2.9.1-alpine
    container_name: influxdb
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${OPTA_ADMIN_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${OPTA_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: optaequipments
      DOCKER_INFLUXDB_INIT_BUCKET: state
      DOCKER_INFLUXDB_INIT_RETENTION: 700d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${OPTA_SECRET}
    ports:
      - 8086:8086
    networks:
      - optanet
    volumes:
      - influxdb_etc:/etc/influxdb2
      - influxdb_lib:/var/lib/influxdb2
    healthcheck:
      test: "curl -f http://localhost:8086/ping"
      interval: 5s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
  nodered:
    container_name: nodered
    image: nodered/node-red:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    environment:
      NODE_RED_ENABLE_PROJECTS: true
      TZ: Europe/Paris
      OPTA_USERNAME: ${OPTA_USERNAME}
      OPTA_PASSWORD: ${OPTA_PASSWORD}
      OPTA_SECRET: ${OPTA_SECRET}
      OPTA_ADMIN_USERNAME: ${OPTA_ADMIN_USERNAME}
      OPTA_ADMIN_PASSWORD: ${OPTA_ADMIN_PASSWORD}
    entrypoint: >
      /bin/sh -c '
        if [ -n "$(git ls-remote https://github.com/JcDenis/OptaEquipments master)" ]; then echo "> Deleting old projects" && rm -Rf /data/projects/OptaEquipments; fi;
        echo "> Cloning project"
        git clone https://github.com/JcDenis/OptaEquipments /data/projects/OptaEquipments
        echo "> Creating settings"
        cp /data/projects/OptaEquipments/package.json /data/package.json
        cp /data/projects/OptaEquipments/data/.config.projects.json /data/.config.projects.json
        cp /data/projects/OptaEquipments/data/admin.png /data/admin.png
        mkdir -p /data/optaequipments
        HASH=$(echo "${OPTA_ADMIN_PASSWORD}" | node-red admin hash-pw)
        HASHB=$(expr substr "$$HASH" 11 100)
        echo -n "module.exports = {
          flowFile: \"flows.json\",
          credentialSecret: \"${OPTA_SECRET}\",
          flowFilePretty: true,
          adminAuth: {
              type: \"credentials\",
              users: [{
                  username: \"${OPTA_ADMIN_USERNAME}\",
                  password: \"$$HASHB\",
                  permissions: \"*\"
              }],
              sessionExpiryTime : 86400
          },
          httpAdminRoot: \"/admin\",
          httpNodeRoot: \"/\",
          diagnostics: { enabled: true, ui: true, },
          runtimeState: { enabled: false, ui: false, },
          telemetry: { enabled: false },
          logging: { console: { level: \"info\", metrics: false, audit: false } },
          contextStorage: { default: { module: \"localfilesystem\" }, memoryOnly: { module: \"memory\" }, },
          exportGlobalContextKeys: false,
          externalModules: { autoInstall: true, autoInstallRetry: 60 },
          editorTheme: {
              page: { title: \"Opta Equipments nodes\" },
              header: { title: \"Opta Equipments nodes\", image: \"/data/admin.png\" },
              palette: { },
              projects: { enabled: true, workflow: { mode: \"manual\" } },
              codeEditor: { lib: \"monaco\", options: { } },
              markdownEditor: { mermaid: { enabled: true } },
              tours: false,
          },
          functionExternalModules: true,
          functionTimeout: 0,
          functionGlobalContext: { },
          ui: { path: \"\" },
          debugMaxLength: 1000,
          mqttReconnectTime: 15000,
          dashboard: { maxHttpBufferSize: 1e7 },
        }" > /data/settings.js
        chown node-red:node-red /data/settings.js
        chmod 600 /data/settings.js
        echo "> Instaling packages"
        cd /data
        npm install --unsafe-perm --no-update-notifier --no-fund --omit=dev
        echo "> Running node-red"
        cd /usr/src/node-red
        exec ./entrypoint.sh
      '
    ports:
      - 1880:1880
      - 502:502 # modbus
    networks:
      - optanet
    volumes:
      - nodered_data:/data
    depends_on:
      - mosquitto
      - influxdb
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/1880' || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s 
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
networks:
  optanet:
volumes:
  mosquitto_config:
  mosquitto_data:
  mosquitto_log:
  influxdb_etc:
  influxdb_lib:
  nodered_data:
