  g: 1c87eaf6a557f02d
  name: states
  func: |-
    if (msg.class !== 'remove') {
        global.set('form["' + msg.hmi.id + '"]["resolution"]', '5', 'memoryOnly');
        let form = global.get('form["' + msg.hmi.id + '"]', 'memoryOnly') || {};
        let states = global.get('kernel.state', 'memoryOnly') || {};
        for (const entity in states) {
            let esplit = entity.split('|');

            if (form.equipment === esplit[0] && esplit[1].match((new RegExp('^(run|cycle)$'))) !== null) {

                node.send([msg, msg]);
            }
        }
    } else {
        msg.class = 'remove';
        msg.enabled = false;
        msg.payload = '';

        return [ msg, null ];
    }

    return;
