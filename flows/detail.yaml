- id: 8255398c09f4fc17
  type: function
  z: 852390cb9559e176
  g: 20a2e240c83c48c2
  name: data
  func: |-
    // Get states

    await new Promise(resolve => setTimeout(resolve, 100));

    let states = global.get('kernel.state','memoryOnly')||{};
    for (const state in states) {
        msg.kernel = {
            'type':'state',
            'entity': state,
            'value': states[state]
        };

        let link = global.get('kernel.link["' + msg.kernel.entity + '"]','memoryOnly');
        if (typeof link === 'string') {
            let esplit = msg.kernel.entity.split('|');
            msg.kernel.equipment = esplit[0];

            if ((global.get('form["' + msg.hmi.id + '"]["equipment"]','memoryOnly')||'') === msg.kernel.equipment) {
                let lsplit = link.split('|');
                msg.kernel.device = lsplit[0];
                msg.kernel.model = lsplit[1];
                msg.kernel.terminal = lsplit[2];
                msg.kernel.component = esplit[1];
                msg.kernel.component_name = msg.dictionary.option_component[msg.kernel.component] || '';

                msg.payload = '';
                msg.class = '';
                msg.enabled = true;
                
                node.send(msg);
            }
        }
    }

    return;
  outputs: 1
  timeout: 0
  noerr: 0
  initialize: ''
  finalize: ''
  libs: []
  x: 330
  'y': 500
  wires:
    - - e50b6b57af2e2315
      - 9cef467dfab6ffd0
- id: f43bb802ac70a922
  type: function
  z: 852390cb9559e176
  g: 6d125a0d231d55d4
  name: periods
  func: |-
    let hideMsg = {
        'topic': '',
        'payload': '',
        'class': 'remove',
        'enabled': false,
        'hmi': msg.hmi,
        'dictionary': msg.dictionary
    };

    node.send([ hideMsg, hideMsg ]);

    if (typeof msg.enabled !== 'boolean' || msg.enabled !== false) {
        let line = global.get('form["' + msg.hmi.id + '"]["line"]', 'memoryOnly') || '-';
        let period = global.get('kernel.period["' + line + '"]', 'memoryOnly');
        if (typeof period === 'string') {
            msg.payload = {
                'm': msg.dictionary.option_color.off,
                'a': msg.dictionary.option_color.off,
                'n': msg.dictionary.option_color.off,
                'd': msg.dictionary.option_color.off,
                's': msg.dictionary.option_color.off
            };
            for (const team in msg.payload) {
                if (period.match((new RegExp('(' + team + ')'))) !== null) {
                    msg.payload[team] = msg.dictionary.option_color.on;
                }
            }
            msg.payload.disabled = (global.get('kernel.disabled["' + line + '"]', 'memoryOnly') || false) === true ? msg.dictionary.option_color.off : msg.dictionary.option_color.on;

            if (msg.hmi.lang === 'fr') {

                return [ msg, null ];
            }

            return [ null, msg ];
        }
    }

    return;
  outputs: 2
  timeout: 0
  noerr: 0
