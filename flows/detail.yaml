        msg.payload = [];
        msg.row = {};
        msg.row.equipment =  global.get('form["' + msg.hmi.id + '"]["equipment"]', 'memoryOnly') || '-';
        msg.row.plant = global.get('form["' + msg.hmi.id + '"]["plant"]', 'memoryOnly') || '-';
        msg.outTz = global.get('kernel.tz["' + msg.row.plant + '"]', 'memoryOnly') || 'Europe/Paris';
        msg.row.ts = Date.now();

        return [null, msg];
    }

    return;
