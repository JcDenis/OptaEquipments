- id: 60d3b3826824680e
  type: function
  z: 852390cb9559e176
  g: 20a2e240c83c48c2
  name: form
  func: |-
    let hideMsg = {
        'topic': '',
        'payload': '',
        'class': 'remove',
        'enabled': false,
        'hmi': msg.hmi,
        'dictionary': msg.dictionary,
        '_client': msg._client
    };

    node.send([hideMsg, hideMsg, hideMsg, hideMsg, null]);

    if (typeof msg.enabled !== 'boolean' || msg.enabled !== false) {
        
        await new Promise(resolve => setTimeout(resolve, 50)); // wait 50ms
        
        msg.class = '';
        msg.enabled = true;
        msg.payload = '';

        let form = global.get('form["' + msg.hmi.id + '"]', 'memoryOnly') || {};

        if (typeof form.plant !== 'string') {
            form.plant = '';
        }

        if (msg.hmi.plant !== '') {
            form.plant = msg.hmi.plant;
        } else {
            msg.payload = form.plant;

            node.send([null, msg, null, null, null]);
        }

        if (form.plant === '' || typeof form.line !== 'string') {
            form.line = '';
        }

        if (form.plant !== '') {
            msg.limit_plant = form.plant;
            msg.payload = form.line;

            node.send([null, null, msg, null, null]);
        }
        
        if (form.line === '' || typeof form.equipment !== 'string') {
            form.equipment = '';
        }

        if (form.plant !== '' && form.line !== '') {
            msg.limit_line = form.line;
            msg.payload = form.equipment;

            node.send([null, null, null, msg, null]);
        }
        
        if (form.plant !== '' && form.line !== '' && form.equipment !== '') {
            delete msg.limit_plant;
            delete msg.limit_line;
            msg.payload = '';
            
            await new Promise(resolve => setTimeout(resolve, 250)); // wait 250ms

            node.send([null, null, null, null, msg]);
        }
    }

    return;
