- id: 36773a3eafb57b0b
  type: function
  z: 852390cb9559e176
  g: 20a2e240c83c48c2
  name: list equipments
  func: >-
    msg.payload = [];


    if (msg.hmi.id === '' || msg.enabled !== true) {
        msg.class = 'remove';
        msg.enabled = false;

        let resetMsg = {
            'topic': '',
            'payload' : '',
            'hmi': msg.hmi, 
            'reset': true
        };

        return [resetMsg, msg, msg];
    }


    let form_plant = global.get('form["' + msg.hmi.id + '"]["plant"]',
    'memoryOnly') || '';

    let form_line = global.get('form["' + msg.hmi.id + '"]["line"]',
    'memoryOnly') ||'';

    let form_equipment = global.get('form["' + msg.hmi.id + '"]["equipment"]',
    'memoryOnly') || '';


    if (form_plant === '' || form_line === '' || form_equipment !== '') {
        msg.class = 'remove';
        msg.enabled = false;

        return [null, msg, msg];
    } else {
        msg.class = '';
        msg.enabled = true;

        let i = 0;
        if (form_line !== '') {
            let equipments = global.get('kernel.equipments','memoryOnly') || {};
            for (const equipment in equipments) {
                if (form_line === equipments[equipment]) {
                    let row = {};
                    row.equipment = equipment;
                    row.equipment_name = global.get('kernel.equipment["' + equipment + '"]', 'memoryOnly') || '-';
                    row.equipment_full = row.equipment_name + ' (' + equipment + ')';
                    row.run_color = msg.dictionary.option_color.empty;
                    row.heat_color = msg.dictionary.option_color.empty;

                    let srun = global.get('kernel.state["' + equipment + '|run' + '"]', 'memoryOnly');
                    if (typeof srun !== 'undefined') {
                        // chek if device is offline
                        let rsplit = (global.get('kernel.link["' + equipment + '|run"]', 'memoryOnly') || '').split('|');
                        let rdevice = global.get('kernel.device["' + rsplit[0] + '|' + rsplit[1] + '"]', 'memoryOnly') || 0;

                        row.run_color = rdevice === 0 ? msg.dictionary.option_color.none : (srun === 0 ? msg.dictionary.option_color.off : msg.dictionary.option_color.on);
                    }

                    let sheat = global.get('kernel.state["' + equipment + '|heat' + '"]', 'memoryOnly');
                    if (typeof sheat !== 'undefined') {
                        // chek if device is offline
                        let ssplit = (global.get('kernel.link["' + equipment + '|heat"]', 'memoryOnly') || '').split('|');
                        let sdevice = global.get('kernel.device["' + ssplit[0] + '|' + ssplit[1] + '"]', 'memoryOnly') || 0;

                        row.heat_color = sdevice === 0 ? msg.dictionary.option_color.none : (sheat === 0 ? msg.dictionary.option_color.off : msg.dictionary.option_color.on);
                    }

                    msg.payload[i++] = row;
                }
            }

            if (msg.hmi.lang === 'fr') {

                return [msg, msg, null];
            } else {

                return [msg, null, msg];
            }
        }
    }
  outputs: 3
  timeout: 0
