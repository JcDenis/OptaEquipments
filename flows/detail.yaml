  func: |-
    // Add zero on last date
    msg.payload[msg.payload.length] = {
        '_time': msg.key_time,
        '_value': 0
    };

    let last = 0;

    for (let k = 0; k < msg.payload.length; k++) {
        msg.payload[k]['_value'] === undefined ? msg.last : msg.payload[k]['_value'];
        msg.payload[k]['_value'] = Math.round(msg.payload[k]['_value']);
        last = msg.payload[k]['_value'];
    }

    delete msg.last_date;
    delete msg.last_key;

    return msg;
