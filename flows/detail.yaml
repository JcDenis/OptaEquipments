  name: data
  func: >-
    // Prepare influxdb query


    msg.topic = '';

    msg.class = '';

    msg.query = 

    'from(bucket: "state")' +

    '  |> range(start: ' + msg.row.start + ', stop:' + msg.row.stop + ')' +

    '  |> filter(fn: (r) => r._measurement == "' + msg.row.equipment + '" and
