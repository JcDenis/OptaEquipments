- id: acf39d5114fc22cb
  type: function
  z: 852390cb9559e176
  g: af7c52c4b0905961
  name: alters
  func: |-
    let hideMsg = {
        'topic': '',
        'payload': '',
        'class': 'remove',
        'enabled': false,
        'hmi': msg.hmi,
        'dictionary': msg.dictionary,
        'reset': msg.hmi.id === '' ? true : false
    };

    node.send([ hideMsg, hideMsg, hideMsg ]);

    if (typeof msg.enabled !== 'boolean' || msg.enabled !== false) {
        msg.equipment = global.get('form["' + msg.hmi.id + '"]["equipment"]', 'memoryOnly') || '';
        msg.payload = [];

        let i = 0;
        const alerts = { ...(global.get('kernel.alert', 'memoryOnly') || { }) };
        for (const alert in alerts) {
            let row = {};
            let esplit = alert.split('|');

            if (esplit[0] === msg.equipment) {
            
                row.entity = alert;
                row.equipment = esplit[0];
                row.equipment_name = global.get('kernel.equipment["' + row.equipment + '"]', 'memoryOnly') || '';
                row.equipment_full = row.equipment_name + ' (' + row.equipment + ')';
                row.component = esplit[1];
                row.component_name = (msg.dictionary.option_component[row.component]) || '';
                row.component_full = row.component_name + ' (' + row.component + ')';
                row.state = Number(global.get('kernel.state["' + row.entity + '"]', 'memoryOnly') || 0);
                row.state_limit = Number(alerts[alert]);
                row.state_color = row.state < row.state_limit ? msg.dictionary.option_color.on : msg.dictionary.option_color.off;
                row.state_diff = Math.round((row.state - row.state_limit) * 10) / 10;
            
                msg.payload[i++] = row;
            }
        }

        if (i > 0) {
            if (msg.hmi.lang === 'fr') {

                return [ msg, msg, null ];
            }

            return [ msg, null, msg ];
        }
    }

    return;
