- id: f43bb802ac70a922
  type: function
  z: 852390cb9559e176
  g: 6d125a0d231d55d4
  name: periods
  func: |-
    let hideMsg = {
        'topic': '',
        'payload': '',
        'class': 'remove',
        'enabled': false,
        'hmi': msg.hmi,
        'dictionary': msg.dictionary
    };

    node.send([hideMsg, hideMsg]);

    if (typeof msg.enabled !== 'boolean' || msg.enabled !== false) {
        let line = global.get('form["' + msg.hmi.id + '"]["line"]', 'memoryOnly') || '-';
        let period = global.get('kernel.period["' + line + '"]', 'memoryOnly');
        if (typeof period === 'string') {
            msg.payload = {
                'm': msg.dictionary.option_color.off,
                'a': msg.dictionary.option_color.off,
                'n': msg.dictionary.option_color.off,
                'd': msg.dictionary.option_color.off,
                's': msg.dictionary.option_color.off
            };
            for (const team in msg.payload) {
                if (period.match((new RegExp('(' + team + ')'))) !== null) {
                    msg.payload[team] = msg.dictionary.option_color.on;
                }
            }
            msg.payload.disabled = (global.get('kernel.disabled["' + line + '"]', 'memoryOnly') || false) === true ? msg.dictionary.option_color.off : msg.dictionary.option_color.on;

            if (msg.hmi.lang === 'fr') {

                return [msg, null];
            } else {

                return [null, msg];
            }
        }
    }

    return;
  outputs: 2
  timeout: 0
