  func: >-
    if (msg.payload === '') {

        return;
    }


    // Get user from UI element

    msg = await node.linkcall('kernel - hmi', msg);


    // Update user form

    const form = { ...(global.get('form', 'memoryOnly') || { }) };

    form[msg.hmi.id]['resolution'] = msg.payload;

    global.set('form', form, 'memoryOnly');


    // Prepare next form

    msg.class = '';

    msg.enabled = true;

    msg.delay = Number(msg.payload) * 60000;

    msg.payload = global.get('form["' + msg.hmi.id + '"]["date"]', 'memoryOnly')
    || Date.now();

    msg.form = form[msg.hmi.id];


    return msg;
