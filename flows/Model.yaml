- id: a905112c62d61806
  type: change
  z: 135b7308617dad08
  name: parse topic
  rules:
    - t: set
      p: split
      pt: msg
      to: '$split(msg.topic,''/'')'
      tot: jsonata
    - t: set
      p: mqtt
      pt: msg
      to: '{}'
      tot: jsonata
    - t: set
      p: mqtt.device
      pt: msg
      to: 'split[1]'
      tot: msg
    - t: set
      p: mqtt.endpoint
      pt: msg
      to: '(msg.split[2] = ''input'' ? ''i'' : ''o'') & msg.split[4] & msg.split[3]'
      tot: jsonata
    - t: set
      p: mqtt.payload
      pt: msg
      to: payload
      tot: msg
    - t: delete
      p: split
      pt: msg
