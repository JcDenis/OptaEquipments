- id: 4ae0f3bc4ad73ded
  type: function
  z: 64ce08af468b8197
  g: 20722623c07d09d8
  name: data
  func: |-
    // parse plant and tz

    // Get user from UI element
    msg = await node.linkcall('kernel - hmi', msg);

    // Disabled plant form
    msg.payload = '';
    msg.enabled = false;
    node.send([msg, null]);

    if (['admin', 'rt'].includes(msg.hmi.level)) {
        let form = global.get('form["' + msg.hmi.id + '"]') || {};

        let groups = global.get('describe.groups["' + form.group + '"]') || {};
        for (const group in groups) {
            let component = groups[group];
            let device = global.get('describe.convert["' + form.model + '"]["' + component + '"]');
            if (typeof device === 'string') {
                let terminal = form.input;
                let reverse = form.input_reverse;
                if (component.match((new RegExp('^(heatswitch|runmirror|cyclemirror)$'))) !== null) {
                    terminal = form.output;
                    reverse = form.output_reverse;
                }
                if (terminal >= 0) {
                    let rlink = [form.model, form.device, terminal.toString(), device].join('|');
                    let entity = form.equipment + '|' + component;

                    // state
                    let stateMsg = {
                        'topic': '',
                        'payload': '',
                        'kernel': {
                            'type': 'state',
                            'entity': entity,
                            'value': 0,
                            'loop': false
                        }
                    };
                    node.send([null, stateMsg]);

                    // link
                    let linkMsg = {
                        'topic': '',
                        'payload': '',
                        'kernel': {
                            'type': 'link',
                            'entity': entity,
                            'value': rlink,
                            'loop': false
                        }
                    };
                    node.send([null, linkMsg]);

                    // reverse
                    if (component.match((new RegExp('^(heat|run|cycle|heatswitch|runmirror|cyclemirror)$'))) !== null) {
                        let reverseMsg = {
                            'topic': '',
                            'payload': '',
                            'kernel': {
                                'type': 'reverse',
                                'entity': entity,
                                'value': reverse,
                                'loop': false
                            }
                        };
                        node.send([null, reverseMsg]);
                    }
                }
            }
        }

        // UI notice
        msg.notice = msg.dictionary.option_notice.update_success || 'Successfully updated';
        msg = await node.linkcall('ui - notice', msg);
    }

    return;
  outputs: 2
  timeout: 0
  noerr: 0
  initialize: ''
  finalize: ''
