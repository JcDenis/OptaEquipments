- id: 168e0f64e8684bb5
  type: function
  z: 64ce08af468b8197
  g: 3f9c0107c43536e4
  name: data
  func: |-
    // parse plant and tz

    // Get user from UI element
    msg = await node.linkcall('kernel - hmi', msg);

    // Disabled plant form
    msg.payload = '';
    msg.enabled = false;
    node.send([msg, null]);

    if (['admin', 'rt'].includes(msg.hmi.level)) {
        // Get form values
        let form = global.get('form["' + msg.hmi.id + '"]') || {};
        // Get existing plant holidays
        let tmp = global.get('kernel.holiday["' + form.plant + '"]') || '';
        // Split existing plant holidays
        let holidays = tmp.split('|');
        // Add day
        holidays.push(form.holiday);

        // Check unique value
        function onlyUnique(value, index, array) {
            return value != '' && array.indexOf(value) === index;
        }

        // Filter holidays to keep unique values
        let res = holidays.filter(onlyUnique);

        // holiday
        let holidayMsg = {
            'topic': '',
            'payload': '',
            'kernel': {
                'type': 'holiday',
                'entity': form.plant,
                'value': res.join('|'),
                'loop': false
            }
        };
        node.send([null, holidayMsg]);

        // UI notice
        msg.notice = msg.dictionary.option_notice.update_success || 'Successfully updated';
        msg = await node.linkcall('ui - notice', msg);
    }

    return;
