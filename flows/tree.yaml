  name: data
  func: |-
    if (msg.payload === '') {

        return;
    }

    const id = msg.payload;

    // Get user from UI element
    msg = await node.linkcall('kernel - hmi', msg);

    // Plant already exists
    if (typeof global.get('kernel.line["' + id + '"]') === 'string') {
        // UI notice
        msg.notice = msg.dictionary.option_notice.line_exists || 'Line already exists';
