- id: 1e4ab253e69deb45
  type: function
  z: 64ce08af468b8197
  g: fa7516c28cf64b47
  name: data
  func: |-
    // parse plant and tz

    // Get user from UI element
    msg = await node.linkcall('kernel - hmi', msg);

    // Disabled plant form
    msg.payload = '';
    msg.enabled = false;
    node.send([msg, null]);

    if (msg.hmi.level === 'admin') {
        let form = global.get('form["' + msg.hmi.id + '"]') || {};

        // plant
        let plantMsg = {
            'topic': '',
            'payload': '',
            'kernel': {
                'type': 'plant',
                'entity': form.id,
                'value': form.name,
                'loop': false
            }
        };
        node.send([null, plantMsg]);

        // tz
        let tzMsg =  {
            'topic': '',
            'payload': '',
            'kernel': {
                'type': 'tz',
                'entity': form.id,
                'value': form.tz,
                'loop': false
            }
        };
        node.send([null, tzMsg]);

        // UI notice
        msg.notice = msg.dictionary.option_notice.update_success || 'Successfully updated';
        msg = await node.linkcall('ui - notice', msg);
    }

    return;
  outputs: 2
  timeout: 0
  noerr: 0
