- id: daacdcccbf69eacd
  type: function
  z: 64ce08af468b8197
  g: 20722623c07d09d8
  name: data
  func: |-
    // Parse plant and tz

    // Get user from UI element
    msg = await node.linkcall('kernel - hmi', msg);

    // Disabled plant form
    msg.payload = '';
    msg.enabled = false;
    node.send([msg, null]);

    if (['admin', 'rt'].includes(msg.hmi.level)) {
        let form = global.get('form["' + msg.hmi.id + '"]') || {};
        let target = global.get('kernel.link["' + form.link + '"]') || '-';
        let entity = form.equipment + '|' + form.component;

        // state delete
        let stateDel = {
            'topic': '',
            'payload': '',
            'kernel': {
                'type': 'state',
                'entity': form.link,
                'value': 0,
                'loop': false,
                'delete': true
            }
        };
        node.send([null, stateDel]);
        
        // link delete
        let linkDel = {
            'topic': '',
            'payload': '',
            'kernel': {
                'type': 'link',
                'entity': form.link,
                'value': '',
                'loop': false,
                'delete': true
            }
        };
        node.send([null, linkDel]);
        
        // reverse delete
        let reverseDel = {
            'topic': '',
            'payload': '',
            'kernel': {
                'type': 'reverse',
                'entity': form.link,
                'value': '',
                'loop': false,
                'delete': true
            }
        };
        node.send([null, reverseDel]);

        // state add
        let stateAdd = {
            'topic': '',
            'payload': '',
            'kernel': {
                'type': 'state',
                'entity': entity,
                'value': 0,
                'loop': false
            }
        };
        node.send([null, stateAdd]);
        
        // link add
        let linkAdd = {
            'topic': '',
            'payload': '',
            'kernel': {
                'type': 'link',
                'entity': entity,
                'value': target,
                'loop': false
            }
        };
        node.send([null, linkAdd]);
        
        // reverse add
        let reverseAdd = {
            'topic': '',
            'payload': '',
            'kernel': {
                'type': 'reverse',
                'entity': entity,
                'value': form.reverse,
                'loop': false
            }
        };
        node.send([null, reverseAdd]);

        // UI notice
        msg.notice = msg.dictionary.option_notice.update_success || 'Successfully updated';
        msg = await node.linkcall('ui - notice', msg);
    }

    return;
