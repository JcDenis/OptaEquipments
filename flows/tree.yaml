- id: 517d7d13efcd2277
  type: function
  z: 64ce08af468b8197
  g: 29452f5f913b11d0
  name: data
  func: >-

    // Get user from UI element

    msg = await node.linkcall('kernel - hmi', msg);


    if (![ 'admin', 'rt' ].includes(msg.hmi.level)) {

        return;
    }


    const form = { ...(global.get('form["' + msg.hmi.id + '"]') || {}) };


    if (form.name === '' || Number(form.x) < 1 || Number(form.y) < 1 ||
    Number(form.w) < 1 || Number(form.h) < 1) {

        return;
    }


    const location = { ...(global.get('kernel.location') || { }) };


    location[form.line] = [
        form.name,
        Number(form.x),
        Number(form.y),
        Number(form.w),
        Number(form.h)
    ].join('|');


    global.set('kernel.location', location);


    // UI notice

    msg.notice = msg.dictionary.option_notice.update_success || 'Successfully
    updated';

    msg = await node.linkcall('ui - notice', msg);



    return msg;
