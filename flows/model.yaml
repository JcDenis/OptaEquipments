- id: 4ac5879e40df9f2b
  type: function
  z: 135b7308617dad08
  g: c0b72044a49a3f76
  name: kernels
  func: |-
    let newMsg = {
        'topic': '',
        'payload': '',
        'kernel': {}
    };
    let inputs = {
        'DigitalInput1': '|1|DigitalInput',
        'DigitalInput2': '|2|DigitalInput',
        'AnalogInput1': '|1|AnalogInput',
        'AnalogInput2': '|2|AnalogInput'
    };

    function substringBefore(str, chars) {
        const index = str.indexOf(chars);
        return index === -1 ? str : str.substring(0, index);
    }

    if (typeof msg.payload['Monitor'] !== 'undefined') {
        /* Watchdog */
        newMsg.kernel = {
            'type': 'watchdog',
            'entity': msg.device,
            'value': Math.round(Date.now() / 1000),
            'loop': false
        };

        node.send(newMsg);

        for (const input in inputs) {
            let component = global.get('rlink["' + msg.device + inputs[input] + '"]');
            if (typeof component === 'string') {
                if (input.match((new RegExp('^(Digital)'))) !== null) {
                    /* Digital */
                    newMsg.kernel = {
                        'type': 'state',
                        'entity': component,
                        'value': msg.payload.Monitor[input][0] === 'OPEN' ? 0 : 1,
                        'loop': false
                    }

                    node.send(newMsg);
                } else if (input.match((new RegExp('^(Analog)'))) !== null) {
                    /* Analog */
                    newMsg.kernel = {
                        'type': 'state',
                        'entity': component,
                        'value': Number(substringBefore(msg.payload.Monitor[input][0], 'V')),
                        'loop': false
                    }

                    node.send(newMsg);
                }
            }
        }
    }

    return;
