- id: 4ac5879e40df9f2b
  type: function
  z: 135b7308617dad08
  g: c0b72044a49a3f76
  name: kernels
  func: >-
    let newMsg = {
        'topic':'',
        'payload':'',
        'kernel':{}
    };

    let inputs =
    {'DigitalInput1':'','DigitalInput2':'','AnalogInput1':'','AnalogInput2':''};


    function substringBefore(str, chars) {
        const index = str.indexOf(chars);
        return index === -1 ? str : str.substring(0, index);
    }


    if (typeof msg.payload['Monitor'] !== 'undefined') {
        /* Watchdog */
        newMsg.kernel = {
            'type':'watchdog',
            'entity':msg.device,
            'value': Math.round(Date.now() / 1000),
            'loop':false
        };

        node.send(newMsg);

        for (const input in inputs) {
            if (typeof global.get('kernel.endpoint["' + msg.device + '|' + input + '"]','memoryOnly') === 'string') {
                if (input.match((new RegExp('^(Digital)'))) !== null) {
                    /* Digital */
                    newMsg.kernel = {
                        'type':'state',
                        'entity':msg.device + '|' + input,
                        'value':msg.payload.Monitor[input][0] === 'OPEN' ? 1 : 0,
                        'loop':false
                    }
                } else {
                    /* Analog */
                    newMsg.kernel = {
                        'type':'state',
                        'entity':msg.device + '|' + input,
                        'value': Number(substringBefore(msg.payload.Monitor[input][0], 'V')),
                        'loop':false
                    }
                }
            }
        }
    }


    return;
  outputs: 1
