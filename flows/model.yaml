- id: eac42932b3a0198e
  type: function
  z: 135b7308617dad08
  g: 44d39e7547289d97
  name: command
  func: |-
    delete msg.qos;
    delete msg.retain;

    if (msg.kernel.model === 'opta') {

        if (msg.kernel.convert.match((new RegExp('(reset)$'))) !== null) {
            /* reset an input */
            if (msg.kernel.convert === 'i|reset') {
                msg.topic = 'opta/' + msg.kernel.device + '/input/reset';
                msg.payload = Number(msg.kernel.terminal);

                delete msg.kernel;

                return msg;
                /* reset an output */
            } else if (msg.kernel.convert === ('o|reset')) {
                msg.topic = 'opta/' + msg.kernel.device + '/output/reset';
                msg.payload = msg.kernel.terminal;

                delete msg.kernel;

                return msg;
            }
        }

        /* command an output */
        if (msg.kernel.convert.match((new RegExp('^(o)'))) !== null) {
            if (msg.kernel.convert === 'o|state') {
                msg.topic = 'opta/' + msg.kernel.device + '/output/set/' + msg.kernel.terminal;
                msg.payload = msg.kernel.value;

                //delete msg.kernel;

                return msg;
            }
        }
    }

    return;
