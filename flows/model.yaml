- id: f84a1943480e45cb
  type: function
  z: 135b7308617dad08
  g: 44d39e7547289d97
  name: info
  func: |-
    if (msg.payload?.entity?.split('|')[0] !== 'opta') {

        return;
    }

    let states = ['Sleep','Request','Skip','Success','Ongoing','Fail'];
    msg.topic = '';
    let device = flow.get('devices["' + msg.payload.entity + '"]');
    if (typeof device === 'object') {
        let dt = global.get('kernel.watchdog["' + msg.payload.entity  + '"]')||0;
        msg.notice =
            "<strong>Model: </strong>" + global.get('describe.model["' + msg.payload.entity.split('|')[0] + '"]') + " <br />\n" +
            "<strong>Type: </strong>" + device.type + " <br />\n" +
            "<strong>ID: </strong>" + msg.payload.device + " <br />\n" +
            "<strong>IP: </strong><a href=\"http://" + device.ip + "\">" + device.ip + "</a> <br />\n" +
            "<strong>Revision: </strong>" + device.revision + " <br />\n" +
            "<strong>Ota: </strong>" + states[device.ota] + " <br />\n" +
            "<strong>Ping: </strong>" + (new Date(dt*1000).toISOString()) + " <br />\n"
            ;
    } else {
        msg.notice = "Aucune information disponible";
    }

    // UI notice
    msg = await node.linkcall('ui - notice', msg);

    return msg;
