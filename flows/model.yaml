- id: f2ee479e42a74303
  type: function
  name: info
  func: >
    // Linx device information

    if (typeof msg.payload?.entity !== 'string' ||
    msg.payload.entity.split('|')[0] !== 'linx') {

        return;
    }


    const equipment = msg.payload.entity.split('|')[1];

    const st = flow.get('linx["' + equipment + '"]');

    const ip = global.get('kernel.linx["' + equipment + '"]') || '-';

    const name = global.get('kernel.equipment["' + equipment + '"]') || '';

    const duration = (s) => typeof s === 'number' ? Math.floor(s / 3600) + ' h '
    + String(Math.floor(s % 3600 / 60)).padStart(2, '0') + ' min' : '-';

    const list = (l) => Array.isArray(l) && l.length > 0 ? l.join(', ') :
    'Aucun';

    const line = (label, value) => '<strong>' + label + ': </strong>' + (typeof
    value === 'undefined' || value === null || value === '' ? '-' : value) + '
    <br />\n';


    msg.topic = '';

    msg.notice =
        line('Modèle', global.get('describe.model.linx')) +
        line('Equipement', name + ' (' + equipment + ')') +
        line('IP', ip);

    if (typeof st !== 'object') {
        msg.notice += 'Aucune information disponible';
    } else if (!st.online) {
        msg.notice +=
            line('Etat', 'Hors ligne') +
            line('Erreur', st.error) +
            line('Dernière tentative', new Date(st.date).toLocaleString('fr-FR'));
    } else {
        msg.notice +=
            line('N° de série', st.serial) +
            line('Jet', st.jet_label) +
            line('Impression', st.print_label) +
            line('Défaut', st.fault_label) +
            line('Alertes', list([].concat(st.warnings || [], st.extended || [], st.enhanced || []))) +
            line('Message', st.message) +
            line('Compteur message', st.messagecount) +
            line('Compteur total', st.printcount) +
            line('Encre restante (estimation)', duration(st.inkremaining)) +
            line('Solvant restant (estimation)', duration(st.solventremaining)) +
            line('Temps de jet', typeof st.jettime === 'number' ? st.jettime + ' h' : '-') +
            line('Temps de service', st.servicetime) +
            line('Horloge imprimante', st.clock) +
            line('Mise à jour', new Date(st.date).toLocaleString('fr-FR'));
    }


    // UI notice

    msg = await node.linkcall('ui - notice', msg);


    return msg;
