- id: 219556949e1ed915
  type: function
  z: 05f6b695d75a73cf
  g: 0e5ee31c1122d84d
  name: data
  func: |-
    // Get user plants

    // Check if required page is current flow
    msg.check = env.get('NR_FLOW_NAME');
    msg = await node.linkcall('ui - tab', msg);

    // Reset UI
    if (msg.enabled !== true) {
        // page is disabled

        msg.hide = ['map - map - group'];
        msg = await node.linkcall('ui - group', msg);

        return [ msg, msg ];
    }

    // Plant was not defined for the user
    if (msg.hmi.plant === '') {

        msg.show = ['map - map - group'];
        msg = await node.linkcall('ui - group', msg);

        // admin can select a plant
        msg.payload = global.get('form["' + msg.hmi.id + '"]["plant"]') || '';

        // Get plants for form
        msg = await node.linkcall('option - plant', msg);

        return [ null, msg ];
    }

    // Plant is defined for the user
    msg.payload = msg.hmi.plant;

    return [ msg, null ];
