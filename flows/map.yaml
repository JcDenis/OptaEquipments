  func: |-
    // Prepare influxdb query

    msg.topic = '';
    msg.old_payload = msg.payload;
    msg.payload = '';
    msg.query = 
    'from(bucket: "state") ' +
    '  |> range(start: -15s, stop: now()) ' +
    '  |> filter(fn: (r) => r["_measurement"] == "' + msg.equipment + '") ' +
    '  |> filter(fn: (r) => r["_field"] == "cycle") ' +
    '  |> filter(fn: (r) => r["_value"] == 1) ' +
    '  |> last()';

    return msg;
