- id: a38263f9dfb005a8
  type: function
  z: 05f6b695d75a73cf
  g: 0e5ee31c1122d84d
  name: data
  func: >-
    // Get plant map


    msg.plant = msg.payload;


    // Reset UI

    if (msg.enabled !== true || msg.plant === '' || typeof
    global.get('kernel.map["' + msg.plant +'"]', 'memoryOnly') !== 'string') {
        // page is disabled
        msg.class = 'remove';
        msg.enabled = false;
        msg.plant = 'none'; // required for http get
        msg.payload = { };

        return msg;
    }


    await new Promise(resolve => setTimeout(resolve, 500));


    const location = { ...(global.get('kernel.location', 'memoryOnly') || { })
    };

    const lines = { ...(global.get('kernel.lines', 'memoryOnly') || { }) };

    const equipments = { ...(global.get('kernel.equipments', 'memoryOnly') || {
    }) };


    msg.class = '';

    msg.enabled = true;

    msg.payload = { };


    for (const l in location) {
        if (typeof lines[l] === 'string' && lines[l] === msg.plant) {
            let color = msg.dictionary.option_color.theme + '00'; // transparent

            // Get line equipements
            let on = 0;
            let off = 0;
            for (const e in equipments) {
                if (equipments[e] === l) {
                    let heat = global.get('kernel.state["' + e + '|heat"]', 'memoryOnly');
                    if (typeof heat === 'number') {
                        if (heat === 1) {
                            on++;
                        }
                        else {
                            off++;
                        }
                    }
                }
            }
            if (on > 0 && off === 0) {
                color = msg.dictionary.option_color.on + 'BB';
            }
            else if (off > 0 && on === 0) {
                color = msg.dictionary.option_color.off + 'BB';
            }
            else if (on > 0 && off > 0) {
                color = msg.dictionary.option_color.median + 'BB';
            }

            let heat = global.get('kernel.state["' + l + '|heat"]', 'memoryOnly');
            if (typeof heat === 'number') {
                color = heat === 1 ? msg.dictionary.option_color.on + 'BB' : msg.dictionary.option_color.off + 'BB';
            }

            let split = location[l].split('|');
            msg.payload[l] = {
                'title': split[0],
                'x': Number(split[1]),
                'y': Number(split[2]),
                'w': Number(split[3] || 50),
                'h': Number(split[4] || 40),
                'c': color
            };
        }
    }


    return msg;
