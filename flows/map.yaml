- id: e4709f79d028ec19
  type: function
  z: 05f6b695d75a73cf
  g: 97f10c211b33ee2e
  name: data
  func: >-
    if (typeof msg.line !== 'string' || msg.line === '') {

        return;
    }


    const periods = (global.get('kernel.period["' + msg.line + '"]',
    'memoryOnly') || '').split('');


    if (periods.includes(msg.topic)) {
        for (let i = 0; i < periods.length; i++) {
            if (periods[i] === msg.topic) {
                periods.splice(i, 1);
            }
        }
    }

    else {
        periods.push(msg.topic)
    }


    node.status({ 'text': periods.join('') });


    global.set('kernel.period["' + msg.line + '"]', periods.join(''),
    'memoryOnly');


    await new Promise(resolve => setTimeout(resolve, 50));


    delete msg.ui_update;


    msg.payload = {
        'line': msg.line
    };


    return msg;
