- id: 95468e9c5d429aac
  type: ui-template
  z: 05f6b695d75a73cf
  g: 0e5ee31c1122d84d
  group: ''
  page: ded8ef092f5c6531
  ui: ''
  name: ''
  order: 0
  width: 0
  height: 0
  head: ''
  format: |-
    <template>
        <Teleport v-if="mounted" to="#nrdb-page-ded8ef092f5c6531">
            <div id="oe-map-group">
                <svg viewBox="0 0 720 400" width="100%" height="100%">
                    <image x="0" y="0" width="100%" height="100%" />
                </svg>
            </div>
        </Teleport>
    </template>

    <script>
        export default {
            data() {
                return {
                    mounted: false
                }
            },
            methods: {
            },
            mounted() {
                this.mounted = true;
            },
            watch: {
                msg: function (msg) {
                    let svgns = "http://www.w3.org/2000/svg";
                    let imgns = 'http://www.w3.org/1999/xlink';

                    var svg = document.body.querySelector("#oe-map-group svg");
                    var img = document.body.querySelector("#oe-map-group svg image");
                    img.setAttributeNS(imgns, 'xlink:href', '/' + msg.plant + '/plant.png');

                    /* Clean up all zones on new message */
                    let childs = svg.querySelectorAll('g');
                    [].forEach.call(childs,c=>{
                        c.parentNode.removeChild(c);
                    });
                    if (msg.class === 'remove') {
                        img.setAttribute('visibility', 'hidden');
                    }
                    else {
                        img.setAttribute('visibility', 'visible');

                        /* All zones must be set in one message */
                        for (const line in msg.payload) {

                            // Create line group
                            let group = document.createElementNS(svgns,'g');
                            
                            // Background zone and color
                            let heat = document.createElementNS(svgns, 'rect');
                            heat.setAttribute('x', msg.payload[line]['x']);
                            heat.setAttribute('y', msg.payload[line]['y']);
                            heat.setAttribute('width', msg.payload[line]['w'] +'px');
                            heat.setAttribute('height', msg.payload[line]['h'] + 'px');
                            heat.setAttribute('fill', msg.payload[line]['c']);
                            group.append(heat);

                            // Short name zone and color
                            let name = document.createElementNS(svgns, 'text');
                            name.setAttribute('x', msg.payload[line]['x'] + (msg.payload[line]['w'] / 2));
                            name.setAttribute('y', msg.payload[line]['y'] + (msg.payload[line]['h'] / 2));
                            name.setAttribute('text-anchor', 'middle');
                            name.setAttribute('class', 'oe-short');
                            name.textContent = msg.payload[line]['title'];
                            group.append(name);

                            // Run icon and color
                            if (msg.payload[line]['r'] === 1) {
                                let icon = document.createElementNS(svgns, 'path');
                                icon.setAttribute('d', "M544.1 256L552 256C565.3 256 576 245.3 576 232L576 88C576 78.3 570.2 69.5 561.2 65.8C552.2 62.1 541.9 64.2 535 71L483.3 122.8C439 86.1 382 64 320 64C191 64 84.3 159.4 66.6 283.5C64.1 301 76.2 317.2 93.7 319.7C111.2 322.2 127.4 310 129.9 292.6C143.2 199.5 223.3 128 320 128C364.4 128 405.2 143 437.7 168.3L391 215C384.1 221.9 382.1 232.2 385.8 241.2C389.5 250.2 398.3 256 408 256L544.1 256zM573.5 356.5C576 339 563.8 322.8 546.4 320.3C529 317.8 512.7 330 510.2 347.4C496.9 440.4 416.8 511.9 320.1 511.9C275.7 511.9 234.9 496.9 202.4 471.6L249 425C255.9 418.1 257.9 407.8 254.2 398.8C250.5 389.8 241.7 384 232 384L88 384C74.7 384 64 394.7 64 408L64 552C64 561.7 69.8 570.5 78.8 574.2C87.8 577.9 98.1 575.8 105 569L156.8 517.2C201 553.9 258 576 320 576C449 576 555.7 480.6 573.4 356.5z");
                                icon.setAttribute('class', 'oe-run');

                                let run = document.createElementNS(svgns, 'svg');
                                run.setAttribute('viewBox', "0 0 640 640");
                                run.setAttribute('width', '2%');
                                run.setAttribute('height', '2%');
                                run.setAttribute('x', msg.payload[line]['x'] + (msg.payload[line]['w'] / 2) - 6);
                                run.setAttribute('y', msg.payload[line]['y'] + (msg.payload[line]['h'] / 2) + 6);
                                run.append(icon);
                                group.append(run);
                            }

                            // Clickable zone
                            let click = document.createElementNS(svgns, 'rect');
                            click.setAttribute('x', msg.payload[line]['x']);
                            click.setAttribute('y', msg.payload[line]['y']);
                            click.setAttribute('width', msg.payload[line]['w'] +'px');
                            click.setAttribute('height', msg.payload[line]['h'] + 'px');
                            click.setAttribute('fill', 'rgba(0, 255, 8, 0.0)');
                            click.setAttribute('class', 'oe-click');
                            group.append(click);

                            group.addEventListener('click', (evt) => {
                                this.send({ payload: { 'line': line, 'plant': msg.plant } });
                            });

                            svg.appendChild(group);
                        }
                    }
                }
            }
        }
    </script>

    <style scoped>
        .oe-click {
            cursor: pointer;
            transition: fill 0.5s ease;
        }
        .oe-click:hover {
            fill: rgba(255, 255, 255, 0.5);
        }
        .oe-short {
            filter: drop-shadow(0 0 3px white) drop-shadow(0 0 2px white);
            font-size: 0.6em;
        }
        .oe-run {
            transform-origin: 50% 50%;
            animation: rotation 2s infinite linear;
        }

        @keyframes rotation {
        from {
            transform: rotate(0deg);
        }
        to {
            transform: rotate(359deg);
        }
        }
    </style>
