- id: cf09fba4cc997462
  type: function
  z: 05f6b695d75a73cf
  g: 97f10c211b33ee2e
  name: data
  func: >-
    await new Promise(resolve => setTimeout(resolve, 100));


    msg.line = msg.payload.line;


    // Title

    const title = global.get('kernel["line"]["' + msg.line + '"]', 'memoryOnly')
    || '';


    msg.class = '';

    msg.enabled = true;

    msg.payload = title;


    node.send([ msg, null, null, null ]);


    // Equipments

    const equipments = { ...(global.get('kernel.equipments', 'memoryOnly') ||
    {}) };

    const states = { ...(global.get('kernel.state', 'memoryOnly') || {}) };

    const alerts = { ...(global.get('kernel.alert', 'memoryOnly') || {}) };


    let c = 0;

    let child = [];

    for (const e in equipments) {
        if (equipments[e] !== msg.line) {

            continue;
        }

        let meter = typeof states[e + '|runmeter'] === 'number' ? states[e + '|runmeter'] : 0;

        let alert = typeof alerts[e + '|runmeter'] === 'number' ? (alerts[e + '|runmeter'] < meter ? msg.dictionary.option_color.theme : msg.dictionary.option_color.empty) : msg.dictionary.option_color.hidden;
        let alert_icon = typeof alerts[e + '|runmeter'] === 'number' ? (alerts[e + '|runmeter'] > meter ? 'wrench-check' : 'wrench-clock') : 'wrench';

        let heat = typeof states[e + '|heat'] === 'number' ? (states[e + '|heat'] ? msg.dictionary.option_color.theme : msg.dictionary.option_color.empty) : msg.dictionary.option_color.hidden;
        let heat_icon = typeof states[e + '|heat'] === 'number' ? ( states[e + '|heat'] ? 'radiator' : 'radiator-off') : 'heat-wave';

        child[c++] = {
            'equipment': e,
            'name': global.get('kernel.equipment["' + e + '"]', 'memoryOnly') || e,
            'alert': '<i class="icon-in-row mdi mdi-' + alert_icon + '" style="font-size: 2.2em; color: ' + alert + '" title="alert"></i>',
            'heat': '<i class="icon-in-row mdi mdi-' + heat_icon + '" style="font-size: 2.2em; color: '+ heat + '" title="heat"></i>'
        };
    }


    msg.payload = child;


    node.send([ null, msg, null, null ]);


    // Line

    const period = global.get('kernel.period["' + msg.line + '"]', 'memoryOnly')
    || '';

    const split = period.split('');


    const periods = [ 'm', 'a', 'n', 'd', 's' ];

    for (let i = 0; i < periods.length; i++) {
        msg.period = periods[i];
        msg.ui_update = {
            'buttonColor': split.includes(periods[i]) ? msg.dictionary.option_color.on : msg.dictionary.option_color.off,
            'label': msg.dictionary.option_team[periods[i]]
        }
        node.send([null, null, msg, null ]);
    }


    // Disabled

    const disabled = global.get('kernel.disabled["' + msg.line + '"]',
    'memoryOnly') || false;

    msg.ui_update = {
        'buttonColor': disabled ? msg.dictionary.option_color.off : msg.dictionary.option_color.on,
        'label': disabled ? (msg.dictionary.period.manual || 'Manual') : (msg.dictionary.period.auto || 'Auto')
    };

    node.send([null, null, null, msg ]);


    return;
