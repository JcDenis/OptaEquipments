- id: 95468e9c5d429aac
  type: ui-template
  z: 05f6b695d75a73cf
  g: 0e5ee31c1122d84d
  group: ''
  page: ded8ef092f5c6531
  ui: ''
  name: ''
  order: 0
  width: 0
  height: 0
  head: ''
  format: |-
    <template>
        <Teleport v-if="mounted" to="#nrdb-page-ded8ef092f5c6531">
            <div id="oe-map-group">
                <svg viewBox="0 0 720 400" width="100%" height="100%">
                    <image x="0" y="0" width="100%" height="100%" />
                </svg>
            </div>
        </Teleport>
    </template>

    <script>
        export default {
            data() {
                return {
                    mounted: false
                }
            },
            methods: {
            },
            mounted() {
                this.mounted = true;
            },
            watch: {
                msg: function (msg) {
                    let svgns = "http://www.w3.org/2000/svg";
                    let imgns = 'http://www.w3.org/1999/xlink';

                    var svg = document.body.querySelector("#oe-map-group svg");
                    var img = document.body.querySelector("#oe-map-group svg image");
                    img.setAttributeNS(imgns, 'xlink:href', '/' + msg.plant + '/plant.png');

                    /* Clean up all zones on new message */
                    let childs = svg.querySelectorAll('g');
                    [].forEach.call(childs,c=>{
                        c.parentNode.removeChild(c);
                    });
                    if (msg.class === 'remove') {
                        img.setAttribute('visibility', 'hidden');
                    }
                    else {
                        img.setAttribute('visibility', 'visible');

                        /* All zones must be set in one message */
                        for (const l in msg.payload) {

                            let g = document.createElementNS(svgns,'g');
                            
                            // background
                            let f = document.createElementNS(svgns, 'rect');
                            f.setAttribute('x', msg.payload[l]['x']);
                            f.setAttribute('y', msg.payload[l]['y']);
                            f.setAttribute('width', msg.payload[l]['w'] +'px');
                            f.setAttribute('height', msg.payload[l]['h'] + 'px');
                            f.setAttribute('fill', msg.payload[l]['c']);
                            g.append(f);

                            // Text
                            let t = document.createElementNS(svgns, 'text');
                            t.setAttribute('x', msg.payload[l]['x'] + (msg.payload[l]['w'] / 2));
                            t.setAttribute('y', msg.payload[l]['y'] + (msg.payload[l]['h'] / 2));
                            t.setAttribute('text-anchor', 'middle');
                            t.setAttribute('class', 'clickable-title');
                            t.textContent = msg.payload[l].title;
                            g.append(t);

                            // Clickable zone
                            let r = document.createElementNS(svgns, 'rect');
                            r.setAttribute('x', msg.payload[l]['x']);
                            r.setAttribute('y', msg.payload[l]['y']);
                            r.setAttribute('width', msg.payload[l]['w'] +'px');
                            r.setAttribute('height', msg.payload[l]['h'] + 'px');
                            r.setAttribute('fill', 'rgba(0, 255, 8, 0.0)');
                            //r.setAttribute('stroke', '#0078ff');
                            //r.setAttribute('stroke-width', 2);
                            r.setAttribute('class', 'clickable-zone');
                            r.setAttribute('id', l);
                            g.append(r);

                            g.addEventListener('click', (evt) => {
                                this.send({ payload: { line: l, plant: msg.plant } });
                            });

                            svg.appendChild(g);
                        }
                    }
                }
            }
        }
    </script>

    <style scoped>
        .clickable-zone {
            cursor: pointer;
            transition: fill 0.5s ease;
        }
        .clickable-zone:hover {
            fill: rgba(255, 255, 255, 0.5);
        }
        .clickable-title {
            filter: drop-shadow(0 0 1px white) drop-shadow(0 0 1px white);
            font-size: 0.6em;
        }
    </style>
