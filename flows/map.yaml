- id: a38263f9dfb005a8
  type: function
  z: 05f6b695d75a73cf
  g: 0e5ee31c1122d84d
  name: data
  func: >-
    // Get plant map


    msg.plant = msg.payload;


    // Reset UI

    if (msg.enabled !== true 
        || msg.plant === '' 
        || typeof global.get('kernel.map["' + msg.plant +'"]') !== 'string'
    ) {
        // page is disabled
        msg.class = 'remove';
        msg.enabled = false;
        msg.plant = 'none'; // required for http get
        msg.payload = { };

        return msg;
    }


    // Wait ui update

    msg = await node.linkcall('ui - latency', msg);


    // Get memories

    const location = global.get('kernel.location') || { }; // Read

    const lines = global.get('kernel.lines') || { }; // Read

    const equipments = global.get('kernel.equipments') || { }; // Read


    msg.class = '';

    msg.enabled = true;

    msg.payload = { };


    let heat_color = msg.dictionary.option_color.off + '00'; // transparent

    let run_on = 0;

    let run_off = 0;

    let cycle_on = 0;

    let heat_on = 0;

    let heat_off = 0;


    for (const l in location) {
        if (typeof lines[l] === 'string' && lines[l] === msg.plant) {
            heat_color = msg.dictionary.option_color.on + '00';
            run_on = 0;
            run_off = 0;
            cycle_on = 0;
            heat_on = 0;
            heat_off = 0;

            // Get line equipements
            for (const e in equipments) {
                if (equipments[e] === l) {
                    let cycle = global.get('kernel.state["' + e + '|cycle"]');
                    if (typeof cycle === 'number') {
                        msg.equipment = e;
                        msg = await node.linkcall('map - cycle', msg);
                        if (msg.equipment === 1) {
                            cycle_on++;
                        }
                    }
                    let heat = global.get('kernel.state["' + e + '|heat"]');
                    if (typeof heat === 'number') {
                        if (heat === 1) {
                            heat_on++;
                        }
                        else {
                            heat_off++;
                        }
                    }
                
                    let run_state = global.get('kernel.state["' + e + '|run"]');
                    if (typeof run_state === 'number') {
                        if (run_state > 0) {
                            run_on++;
                        }
                        else {
                            run_off++;
                        }
                    }
                }
            }
            if (heat_on > 0 && heat_off === 0) {
                heat_color = msg.dictionary.option_color.on + 'BB';
            }
            else if (heat_off > 0 && heat_on === 0) {
                heat_color = msg.dictionary.option_color.off + 'BB';
            }
            else if (heat_on > 0 && heat_off > 0) {
                heat_color = msg.dictionary.option_color.median + 'BB';
            }

            let split = location[l].split('|');
            msg.payload[l] = {
                'title': split[0],
                'x': Number(split[1]),
                'y': Number(split[2]),
                'w': Number(split[3] || 50),
                'h': Number(split[4] || 40),
                'c': heat_color,
                'r': run_on > run_off ? 1 : 0, // more than half of equipments
                'p': cycle_on > 0 ? 1 : 0
            };
        }
    }


    msg.help_color = [msg.dictionary.option_color.on + 'BB',
    msg.dictionary.option_color.off + 'BB', msg.dictionary.option_color.median +
    'BB'];

    msg.help_on = msg.dictionary.map.help_on || 'Line is heating';

    msg.help_off = msg.dictionary.map.help_off || 'Line is not heating';

    msg.help_half = msg.dictionary.map.help_half || 'Some line equipments are
    not heating';

    msg.help_stop = msg.dictionary.map.help_stop || 'Line is stopped';

    msg.help_ready = msg.dictionary.map.help_ready || 'Line is ready';

    msg.help_cycle = msg.dictionary.map.help_cycle || 'Line is in cycle';


    return msg;
