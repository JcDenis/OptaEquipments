- id: b159cf2d88aaf422
  type: function
  z: 27841aa886edd1cd
  g: 90f47fc795048184
  name: data
  func: |-
    // Check ash response

    // UI redirect to alert page
    if (msg.payload === true) {
        msg.payload = global.get('describe.pages.alert.tab', 'memoryOnly') || '';

        node.send([msg, null]);
    }
    // UI notice
    else {
        msg.payload = msg.dictionary.common_notice_login_fail

        node.send([null, msg]);
    }

    return;
