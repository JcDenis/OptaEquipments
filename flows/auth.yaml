- id: 5a825d48de813e3e
  type: function
  z: 27841aa886edd1cd
  g: 90f47fc795048184
  name: data
  func: |-
    // Reset form
    msg.payload = '';
    msg.ui_update = {
        'label': '',
        'options': [ ]
    }

    msg.class = 'remove';
    msg.enabled = false;

    node.send([ msg, msg, msg ]);

    await new Promise(resolve => setTimeout(resolve, 50));

    // Prepare form
    msg.class = '';
    msg.enabled = true;

    // Use is connected, display level
    if (msg.hmi.login !== '') {

        node.send([ null, msg, null ]);
        
        msg.ui_update.label = msg.dictionary.auth.user || 'User: ';
        msg.payload = msg.dictionary.option_level[msg.hmi.level] || '';

        node.status({ 'fill': 'green' });
        return [ msg, null, null ];
    }

    // User is not connected, display form
    msg.ui_update.options = [
        {
            'type': 'text',
            'label': msg.dictionary.auth.login || 'Login',
            'key': 'login',
            'required': true
        },
        {
            'type': 'password',
            'label': msg.dictionary.auth.pass || 'Password',
            'key': 'pass',
            'required': true
        }
    ];

    node.status({ 'fill': 'red' });
    return [ null, null, msg ];
  outputs: 3
  timeout: 0
  noerr: 0
