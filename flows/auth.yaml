- id: 87f5723e3123e133
  type: function
  z: 27841aa886edd1cd
  g: 90f47fc795048184
  name: data
  func: |-
    const user = { ...(global.get('user', 'memoryOnly') || { }) };
    delete user[ msg._client.socketId ];
    global.set('user', 'memoryonly');

    delete msg.ui_update;

    return msg;
  outputs: 1
  timeout: 0
  noerr: 0
  initialize: ''
  finalize: ''
  libs: []
  x: 670
  'y': 200
  wires:
    - - bb71762ba2269b75
      - 8aca2e86c077d885
- id: 1a7777114f11ff8b
  type: function
  z: 27841aa886edd1cd
  g: 90f47fc795048184
  name: data
  func: |-
    // Get user from UI element
    msg = await node.linkcall('kernel - hmi', msg);

    // Parse UI form to prepare hash test
    msg.login = msg.payload.login;
    msg.pass = msg.payload.pass;
    msg.payload = '';

    // Check user hash
    msg = await node.linkcall('user - check', msg);

    // UI redirect to alert page
    if (msg.payload === true) {
        msg.payload = global.get('describe.pages.alert.tab', 'memoryOnly') || '';

        return [ msg, null ];
    }

    // UI notice
    msg.payload = msg.dictionary.option_notice.login_fail;

    return [ null, msg ];
  outputs: 2
  timeout: 0
  noerr: 0
  initialize: ''
  finalize: ''
  libs: []
  x: 670
