- id: 5a825d48de813e3e
  type: function
  z: 27841aa886edd1cd
  g: 90f47fc795048184
  name: data
  func: |-
    msg.payload = '';
    msg.ui_update = {
        'label': '',
        'options': []
    }

    msg.class = 'remove';
    msg.enabled = false;

    node.send([msg, msg, msg]);

    await new Promise(resolve => setTimeout(resolve, 50));

    msg.class = '';
    msg.enabled = true;

    if (msg.hmi.login !== '') {

        node.send([null, msg, null]);
        
        msg.ui_update.label = (msg.dictionary.group_auth_user || 'User') + ': ';
        msg.payload = msg.dictionary.option_level[msg.hmi.level] || '';

        node.status({ 'fill': 'green' });
        node.send([msg, null, null]);
    }
    else {
        msg.ui_update.options = [
            {
                'type': 'text',
                'label': msg.dictionary.group_auth_login || 'Login',
                'key': 'login',
                'required': true
            },
            {
                'type': 'password',
                'label': msg.dictionary.group_auth_pass || 'Pass',
                'key': 'pass',
                'required': true
            }
        ];

        node.status({ 'fill': 'red' });
        node.send([null, null, msg]);
    }

    return;
  outputs: 3
  timeout: 0
  noerr: 0
  initialize: ''
  finalize: ''
  libs: []
