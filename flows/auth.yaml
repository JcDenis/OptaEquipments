- id: 5a825d48de813e3e
  type: function
  z: 27841aa886edd1cd
  g: 90f47fc795048184
  name: function 1
  func: |-
    msg.payload = '';
    msg.ui_update = {
        'label': '',
        'options': []
    }

    msg.class == 'remove';
    msg.enabled = false;

    node.send([msg, msg, msg]);

    msg.class == '';
    msg.enabled = true;

    await new Promise(resolve => setTimeout(resolve, 500));

    if (msg.hmi.login !== '') {

        node.send([msg, null, null]);
        
        msg.ui_update.label = (msg.dictionary.group_auth_user || 'User') + ': ';
        msg.payload = msg.dictionary.option_level[msg.hmi.level] || '';

        node.status({ 'fill': 'green' });
        node.send([null, msg, null]);
    }
    else {
        msg.ui_update.options = [
            {
                'type': 'text',
                'label': msg.dictionary.group_auth_login || 'Login',
                'key': 'login',
                'required': true
            },
            {
                'type': 'password',
                'label': msg.dictionary.group_auth_pass || 'Pass',
                'key': 'pass',
                'required': true
            }
        ];

        node.status({ 'fill': 'red' });
        node.send([null, null, msg]);
    }

    return;
  outputs: 3
