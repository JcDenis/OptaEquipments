  type: function
  z: adb48ef35d9453c0
  g: 4c2194718c72648c
  name: data
  func: |-
    if (!msg.enabled) {

        return msg;
    }

    msg = await node.linkcall('option - auth', msg);

    msg.payload = '';
    msg.ui_update = {
