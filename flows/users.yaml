  type: function
  z: adb48ef35d9453c0
  g: 6e3f77a2a72d0fa8
  name: data
  func: |-
    const selected = msg.payload;
    msg.payload = '';

    // Get user from UI element
    msg = await node.linkcall('kernel - hmi', msg);

    msg.hide = [];
    msg.show = [];

    // User menu groups saved on page build
    const menu = global.get('menu["' + msg.hmi.id + '"]["users"]') || { };

    for (const k in menu) {
        if (k === selected) {
            msg.show.push(menu[k]);
        }
        else {
            msg.hide.push(menu[k]);
        }
    }

    msg = await node.linkcall('ui - group', msg);
    msg = await node.linkcall('ui - latency', msg);

    // Go to sections
    msg.payload = '';
    msg.class = '';
    msg.enabled = true;
    delete msg.ui_update;

    return msg;
