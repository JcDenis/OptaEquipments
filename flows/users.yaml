- id: 033f97308b43c4d8
  type: function
  z: adb48ef35d9453c0
  g: a69df92e27bcc577
  name: data
  func: >-
    if (msg.action !== 'button_click') {

        return;
    }


    // Get user from UI element

    msg = await node.linkcall('kernel - hmi', msg);


    // user level and do not delete itself

    if (![ 'admin' ].includes(msg.hmi.level) || msg.hmi.login ===
    msg.payload.login) {

        return;
    }


    if (msg.column === 'delete') {
        // Do not delete default admin
        if (msg.payload.login === env.get('OPTA_ADMIN_USERNAME')) {
            msg.payload = 'Admin is not deletable';

            return [ msg, null, null ];
        }
        else {
            let auth = { ...(global.get('auth', 'memoryOnly') || { }) };
            delete auth[msg.payload.login];
            global.set('auth', auth, 'memoryOnly');

            msg.payload = 'Successfully updated';
            node.send([ msg, null, null]);

            await new Promise(resolve => setTimeout(resolve, 50));

            msg.enabled = true;

            return [ null, msg, msg ];
        }

    }

    else if (msg.column === 'disconnect') {

        let user = { ...(global.get('user', 'memoryOnly') || { }) };
        delete user[msg.payload.session];
        global.set('user', user, 'memoryOnly');

        msg.payload = 'Successfully updated';
        node.send([ msg, null, null]);
        
        await new Promise(resolve => setTimeout(resolve, 50));

        msg.enabled = true;

        return [ null, null, msg ];
    }


    return;
  outputs: 3
  timeout: 0
  noerr: 0
  initialize: ''
  finalize: ''
  libs: []
