- id: f73269ad9421c5fa
  type: function
  z: adb48ef35d9453c0
  g: 6e3f77a2a72d0fa8
  name: data
  func: |-
    // Build menu selector

    // Check if required page is current flow
    msg.flow = env.get('NR_FLOW_NAME');
    msg = await node.linkcall('ui - tab', msg);

    // key => ui group name and button label
    msg.menu = {
        'list': {
            'group': 'ui - group - users - list',
            'label': (msg.dictionary.users || { }).menu_list || 'Users'
        },
        'edit': {
            'group': 'ui - group - users - edit',
            'label': (msg.dictionary.users || { }).menu_edit || 'Edit a user'
        },
        'add': {
            'group': 'ui - group - users - add',
            'label': (msg.dictionary.users || { }).menu_add || 'Add a user'
        },
        'backup': {
            'group': 'ui - group - users - backup',
            'label': (msg.dictionary.users || { }).menu_backup || 'Backup users'
        }
    };

    // Hide all groups
    msg.hide = [];
    for (const k in msg.menu) {
        msg.hide.push(msg.menu[k]['group']);
    }

    msg = await node.linkcall('ui - group', msg);

    if (!msg.enabled) {

        return [msg, msg];
    }

    msg.payload = '';
    msg.class = '';
    msg.enabled = true;
    msg.ui_update = {
        'options': []
    };

    // Keep user menu groups for menu click (msg.menu is lost on click)
    if (typeof global.get('menu') !== 'object') {
        global.set('menu', { });
    }
    let menu = global.get('menu'); // autoupdate
    menu[msg.hmi.id] = { ...(menu[msg.hmi.id] || { }), 'users': { } };

    for (const k in msg.menu) {
        msg.ui_update.options.push({
            'value': k,
            'label': msg.menu[k]['label']
        });
        menu[msg.hmi.id]['users'][k] = msg.menu[k]['group'];
    }

    delete msg.menu;

    return [null, msg];
  outputs: 2
  timeout: 0
  noerr: 0
  initialize: ''
  finalize: ''
  libs: []
  x: 270
  'y': 180
  wires:
    - - 6b2108622867d8a4
    - - fc19c6ad95310174
- id: e28be1d1aa7033af
  type: function
  z: adb48ef35d9453c0
  g: a69df92e27bcc577
  name: data
  func: |-
    if (!msg.enabled) {

        return msg;
    }

    const users = global.get('user');
    const auth = global.get('auth');

    msg.payload = { };

    for (const u in auth) {
        msg.payload[u] = { ...auth[u] };
        msg.payload[u].login = u;
        msg.payload[u].plant_full = msg.payload[u].plant === '' ? '' : (global.get('kernel.plant["' + msg.payload[u].plant + '"]') || '');
        msg.payload[u].delete = msg.dictionary.option_action.delete;
        msg.payload[u].disconnect = msg.dictionary.option_action.disconnect;
        msg.payload[u].session = '-';
        msg.payload[u].session_color = msg.dictionary.option_color.off;
        msg.payload[u].level_full = msg.payload[u].level === '' ? '' : (msg.dictionary.option_level[msg.payload[u].level] || msg.payload[u].level);

        // Opened sessions (by browser, see kernel - hmi)
        for (const user in users) {
            if (users[user]["login"] === msg.payload[u].login) {
                msg.payload[u].session = msg.payload[u].session === '-' ? 1 : msg.payload[u].session + 1;
                msg.payload[u].session_color = msg.dictionary.option_color.on;
            }
        }
    }

    msg.class = '';
    msg.enabled = true;
    msg.payload = Object.values(msg.payload);
    msg.payload.sort((a, b) => a.login.localeCompare(b.login));

    return msg;
  outputs: 1
  timeout: 0
  noerr: 0
  initialize: ''
  finalize: ''
  libs: []
  x: 270
  'y': 420
  wires:
    - - 421bd90f81361dfe
- id: 033f97308b43c4d8
  type: function
  z: adb48ef35d9453c0
  g: a69df92e27bcc577
  name: data
  func: >-
    if (msg.action !== 'button_click') {

        return;
    }


    // Get user from UI element

    msg = await node.linkcall('kernel - hmi', msg);


    // Check user right (and prevent self deletion)

    if (![ 'admin' ].includes(msg.hmi.level) || msg.hmi.login ===
    msg.payload.login) {

        return;
    }


    if (msg.column === 'delete') {
        // Do not delete default admin
        if (msg.payload.login === env.get('OPTA_ADMIN_USERNAME')) {
            // UI notice
            msg.notice = 'Admin is not deletable';
            msg = await node.linkcall('ui - notice', msg);

            return;
        }
        else {
            // Get memories
            let auth = global.get('auth'); // autoupdate

            delete auth[msg.payload.login];

            // UI notice
            msg.notice = 'Successfully updated';
            msg = await node.linkcall('ui - notice', msg);

            // Wait ui update
            msg = await node.linkcall('ui - latency', msg);

            msg.enabled = true;

            return [ msg, msg, null ];
        }
    }

    else if (msg.column === 'disconnect') {
        // Get memories
        let user = global.get('user'); // autoupdate

        // Close every session of this user and send its browsers back to the auth page
        // (session id is a dashboard client id, or a tab id as fallback, see kernel - hmi)
        const page = global.get('describe.pages.auth.name') || '';
