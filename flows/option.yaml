- id: 4700c24d1c1221d1
  type: function
  z: adb9fbf379118d77
  g: 6083e6018629a109
  name: data
  func: |-
    // No options
    if (!Array.isArray(msg.options)) {
        // Notice
        msg.payload = msg.dictionary.common_notice_no_option || 'No options';

        node.send([msg, null]),

        // Set a default option
        msg.options = [
            {
                'label': msg.payload,
                'value':' '
            }
        ];
        msg.payload = '';
        msg.enabled = 'false;'
    } else {
        // Sort options on demand
        if (typeof msg.nosort !== 'boolean' || msg.nosort === false) {
            msg.options.sort((a, b) => a.label.localeCompare(b.label));
        }
    }

    // Selected option
    if (msg.payload === '') {
        msg.payload = msg.options[0]['value'] || '';
    }

    node.send([null, msg]);

    return;
