  name: alerts
  func: |-
    msg.options = [{
        'label':'',
        'value':'',
        'dropdown':'alert'
    }];

    var alerts = global.get('kernel.alert', 'default');
    var i = 1;

    if (typeof alerts === 'object') {
        for (const alert in alerts) {
            const split = alert.split("|");
            if (typeof msg.limit_equipment === 'undefined' || msg.limit_equipment === split[0]) {
                var name = msg.dictionary.option_component[split[1]];
                msg.options[i++] = {
                    'label':name + ' (' + alert + ')',
                    'value':alert,
                    'dropdown':'alert'
                }
            }
        }
    }

    delete msg.limit_equipment;

    return msg;
