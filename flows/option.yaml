  name: lines
  func: |-
    msg.options = [{
        'label':'',
        'value':'',
        'dropdown':'line'
    }];

    var lines = global.get('kernel.line', 'default');
    var i = 1;

    if (typeof lines === 'object') {
        for (const line in lines) {
            var line_plant = global.get('kernel.lines.' + line, 'default');
            if (typeof msg.limit_plant === 'undefined' || msg.limit_plant === line_plant) {
                msg.options[i++] = {
                    'label':lines[line] + ' (' + line + ')',
                    'value':line,
                    'dropdown':'line'
                }
            }
        }
    }

    delete msg.limit_plant;

    return msg;
