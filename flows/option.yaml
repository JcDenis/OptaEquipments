  g: fa94e5dda0432e95
  name: plants
  func: |-
    msg.options = [{
        'label':'',
        'value':'',
        'dropdown':'plant'
    }];

    let plants = global.get('kernel.plant', 'memoryOnly');
    let i = 1;

    if (typeof plants === 'object') {
        for (const plant in plants) {
            msg.options[i++] = {
                'label':plants[plant] + ' (' + plant + ')',
                'value':plant,
                'dropdown':'plant'
            }
        }
    }

    return msg;
