  name: delete - plant
  func: >-
    msg.payload = (msg.dictionary?.common_notice_plant_noempty)||'Failed to
    delete plant';


    if (typeof msg.kernel.entity === 'string' && msg.kernel.type === 'plant') {
        let is_empty = true;
        // kernel.lines
        let lines = global.get('kernel.lines','memoryOnly')||{};
        for (const line in lines) {
            if (lines[line] === msg.kernel.entity) {
                is_empty = false;
            }
        }

        if (is_empty === true) {
            // kernel.plant
            node.send({
                'topic':'',
                'payload':'',
                'kernel':{
                    'type':'plant',
                    'entity':msg.kernel.entity,
                    'value':'',
                    'loop':false,
                    'delete':true
                }
            });

            // kernel.tz
            node.send({
                'topic': '',
                'payload': '',
                'kernel': {
                    'type': 'tz',
                    'entity': msg.kernel.entity,
                    'value': '',
                    'loop': false,
                    'delete': true
                }
            });

            // kernel.day
            node.send({
                'topic': '',
                'payload': '',
                'kernel': {
                    'type': 'day',
                    'entity': msg.kernel.entity,
                    'value': '',
                    'loop': false,
                    'delete': true
                }
            });

            // kernel.team
            let teams = global.get('kernel.team','memoryOnly')||{};
            for (const team in teams) {
                let tsplit = team.split('|');
                if (tsplit[0] === msg.kernel.entity) {
                    node.send({
                        'topic': '',
                        'payload': '',
                        'kernel': {
                            'type': 'team',
                            'entity': team,
                            'value': '',
                            'loop': false,
                            'delete': true
                        }
                    });
                }
            }

            msg.payload = (msg.dictionary?.common_notice_tree_update_success)||'Plant successfully deleted';
        }
    }


    delete msg.kernel;


    return [null,msg];
