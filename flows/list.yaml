- id: 8ac05dce1cc4e2e9
  type: function
  z: e97c6f12735a13c1
  g: 1dd6bd6835107ce6
  name: data
  func: |-
    // Parse equipments

    msg.payload = [];

    node.send([null, msg, msg]);

    msg.class = '';
    msg.enabled = true;

    if (msg.list === 'equipment') {
        let equipments = global.get('kernel.equipments') || {};
        let i = 0;

        for (const equipment in equipments) {
            let row  = {};

            row.equipment = equipment;
            row.equipment_name = global.get('kernel.equipment["' + equipment + '"]') || '';
            row.equipment_full = row.equipment_name + ' (' + equipment + ')';
            row.line = equipments[equipment];
            row.line_name = global.get('kernel.line["'  + row.line + '"]') || '';
            row.line_full = row.line_name + ' (' + row.line + ')';
            row.plant = global.get('kernel.lines["' + row.line + '"]') || '-';
            row.plant_name = global.get('kernel.plant["' + row.plant + '"]') || '';
            row.plant_full = row.plant_name + ' (' + row.plant + ')';
            row.delete = (msg.dictionary.option_action.delete) || 'Delete';
            row.component_count = 0;
            row.state_color = msg.dictionary.option_color.empty;

            if (row.plant === global.get('form["' + msg.hmi.id + '"]["plant"]')) {
                let state = global.get('kernel.state["' + row.equipment + '|run"]');
                if (typeof state === 'number') {
                    // chek if device is offline
                    let ssplit = (global.get('kernel.link["' + equipment + '|run"]') || '').split('|');
                    if (global.get('kernel.device["' + ssplit[0] + '|' + ssplit[1] + '"]') !== 1) {
                        row.state_color = msg.dictionary.option_color.none;
                    } else {
                        row.state_color = state === 0 ? msg.dictionary.option_color.off : msg.dictionary.option_color.on;
                    }
                }

                let links = global.get('kernel.link');
                let needle = new RegExp('^(' + row.equipment + '\\|)');

                if (typeof links === 'object') {
                    for (const endpoint in links) {
                        if (endpoint.match(needle) !== null) {
                            row.component_count += 1;
                        }
                    }
                }

                msg.payload[i++] = row;
            }
        }

        // Records title
        msg.total = i;
        node.send([msg, null, null]);

        if (i > 0) {
            msg.payload.sort(function($l, $r) {
                if ($l.line_name === $r.line_name) {

                    return $l.equipment_name > $r.equipment_name ? 1 : -1;
                }

                return $l.line_name > $r.line_name ? 1 : -1;
            });

            if (msg.hmi.lang === 'fr') {

                return [null, msg, null];
            } else {

                return [null, null, msg];
            }
        }
    }

    return;
