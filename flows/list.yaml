  g: 24edc6d4f589fdeb
  name: data
  func: |-
    // Parse families

    msg.payload = [ ];

    node.send([ null, msg, msg ]);

    msg.class = '';
    msg.enabled = true;

    if (msg.list === 'family') {
        const families = global.get('kernel.family') || { };
        const equipments = global.get('kernel.families') || { };
        const counters = global.get('kernel.counters') || { };
        let i = 0;

        // Families are shared by all plants
        for (const family in families) {
            let row  = { };

            row.family = family;
            row.family_name = families[family];
            row.family_full = row.family_name + ' (' + family + ')';
            row.equipment_count = Object.values(equipments).filter(f => f === family).length;
            row.counter_count = Object.values(counters).filter(f => f === family).length;
            row.delete = (msg.dictionary.option_action.delete) || 'Delete';

            msg.payload[i++] = row;
        }

        // Records title
        msg.total = i;
        node.send([ msg, null, null ]);

        if (i > 0) {
            msg.payload.sort((a, b) => a.family_name.localeCompare(b.family_name));

            if (msg.hmi.lang === 'fr') {

                return [ null, msg, null ];
            }

            return [ null, null, msg ];
        }
    }

    return;
