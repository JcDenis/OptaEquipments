- id: 8c51a1bfba38190a
  type: function
  z: e97c6f12735a13c1
  g: 1dd6bd6835107ce6
  name: more
  func: >-
    let state = global.get('kernel.state["' + msg.row.equipment + '|run"]',
    'memoryOnly');

    if (typeof state === 'number') {
        msg.row.state_color = (state === 0 ? '#FF0000' : '#008000');
    }


    let links = global.get('kernel.link','memoryOnly');

    let needle = new RegExp('^(' + msg.row.equipment + '\\|)');


    if (typeof links === 'object') {
        for (const endpoint in links) {
            if (endpoint.match(needle) !== null) {
                msg.row.component_count += 1;
            }
        }
    }


    return msg;
