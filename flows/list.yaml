- id: 710944fdb5c12852
  type: function
  z: e97c6f12735a13c1
  g: 1c2d5f046ccecc9d
  name: data
  func: |-
    let old_payload = msg.payload;
    msg.class = 'remove';
    msg.enabled = false;
    msg.payload = '';

    node.send([ msg, msg ]);

    if (old_payload === '') {

        return;
    }

    msg.topic = '';
    msg.payload = '';
    msg.class = '';
    msg.enabled = true;

    msg.ui_update = {
        'options': [
            {
                'label': msg.dictionary.option_name.lines,
                'value': 'line'
            },
            {
                'label': msg.dictionary.option_name.equipments,
                'value': 'equipment'
            },
            {
                'label': msg.dictionary.option_name.families,
                'value': 'family'
            },/*
            {
                'label': msg.dictionary.option_name.alerts,
                'value': 'alert'
            },//*/
            {
                'label': msg.dictionary.option_name.counters,
                'value': 'counter'
            },
            {
                'label': msg.dictionary.option_name.devices,
                'value': 'device'
            },
            {
                'label': msg.dictionary.option_name.components,
                'value': 'component'
            },
            {
                'label': msg.dictionary.option_name.holidays,
                'value': 'holiday'
            }
        ],
        'label': ''//msg.dictionary.option_select.list
    };

    // Keep previously selected list and refresh it for the new plant
    const list = global.get('form["' + msg.hmi.id + '"]["list"]') || '';
    msg.payload = list;
    node.send([ null, msg ]);

    if (list !== '') {
        msg.list = list;
        msg.payload = '';
        msg.class = 'remove';
        msg.enabled = false;
        delete msg.ui_update;

        return [ msg, null ];
    }

    return;
