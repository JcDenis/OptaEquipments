- id: feef47038a87f3d3
  type: function
  z: e97c6f12735a13c1
  g: e86385b18b9154e7
  name: parse devices
  func: |-
    msg.payload = [];

    node.send([null, msg, msg]);

    msg.class = '';
    msg.enabled = true;

    if (msg.list === 'device') {
        let devices = global.get('kernel.device', 'memoryOnly') || {};
        let i = 0;

        for (const entity in devices) {
            let row  = {};
            let esplit = entity.split('|');

            row.entity = entity;
            row.model = esplit[0];
            row.model_name = global.get('describe.model["' + row.model + '"]', 'memoryOnly') || ''
            row.model_full = row.model_name + ' (' + row.model + ')';
            row.device = esplit[1];
            row.delete = (msg.dictionary.option_action.delete) || 'Delete';
            row.component_count = 0;
            row.watchdog_color = msg.dictionary.option_color.empty;

            let watchdog = global.get('kernel.watchdog["' + row.entity + '"]', 'memoryOnly');
            if (typeof watchdog === 'number') {
                row.watchdog_color = devices[entity] === 1 ? msg.dictionary.option_color.on : msg.dictionary.option_color.off;
            }

            let rlinks = global.get('rlink', 'memoryOnly');
            let needle = new RegExp('^(' + row.model + '\\|' + row.device + '\\|)');

            let names = {};
            if (typeof rlinks === 'object') {
                for (const target in rlinks) {
                    if (target.match(needle) !== null) {
                        let tsplit = rlinks[target].split('|');
                        // get uniq equipement
                        names[tsplit[0]]  = global.get('kernel.equipment["' + tsplit[0] + '"]', 'memoryOnly') || '';
                        row.component_count += 1;
                    }
                }
            }
            row.equipment_name = [];
            for (const name in names) {
                row.equipment_name.push(names[name]);
            }
            row.equipment_name = row.equipment_name.join(', ');

            msg.payload[i++] = row;
        }

        // Records title
        msg.total = i;
        node.send([msg, null, null]);

        if (i > 0) {
            msg.payload.sort(function($l, $r) {
                if ($l.model_name === $r.model_name) {

                    return $l.device > $r.device ? 1 : -1;
                }

                return $l.model_name > $r.model_name ? 1 : -1;
            });

            if (msg.hmi.lang === 'fr') {

                return [null, msg, null];
            } else {

                return [null, null, msg];
            }
        }
    }

    return;
