  name: compare
  rules:
    - t: set
      p: compare.startday
      pt: msg
      to: row.startday
      tot: msg
    - t: set
      p: compare.starttime
      pt: msg
      to: '$join($split(msg.row.starttime,'':''),'''')'
      tot: jsonata
    - t: set
      p: compare.stopday
      pt: msg
      to: row.stopday
      tot: msg
    - t: set
      p: compare.stoptime
      pt: msg
      to: '$join($split(msg.row.stoptime,'':''),'''')'
      tot: jsonata
    - t: set
      p: compare.curlimit
      pt: msg
      to: $number(msg.compare.curday & msg.compare.curtime)
      tot: jsonata
    - t: set
      p: compare.startlimit
      pt: msg
      to: $number(msg.compare.startday & msg.compare.starttime)
      tot: jsonata
    - t: set
      p: compare.stoplimit
      pt: msg
      to: $number(msg.compare.stopday & msg.compare.stoptime)
      tot: jsonata
    - t: set
      p: row.state
      pt: msg
      to: >-
        (msg.compare.startlimit <= msg.compare.curlimit) and
        (msg.compare.curlimit <= msg.compare.stoplimit)
      tot: jsonata
    - t: set
      p: row.state
      pt: msg
      to: 'msg.row.todisable?msg.row.state:false'
      tot: jsonata
    - t: set
      p: row.state_name
      pt: msg
      to: 'msg.row.state?''Activée'':''Désactivée'''
      tot: jsonata
    - t: set
      p: row.state_color
      pt: msg
      to: 'msg.row.state?''#008000'':''#FF0000'''
      tot: jsonata
    - t: set
      p: row.state_color
      pt: msg
      to: 'msg.row.todisable?msg.row.state_color:''#CCCCCC'''
      tot: jsonata
