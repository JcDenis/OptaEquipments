  type: function
  z: e97c6f12735a13c1
  g: 1dd6bd6835107ce6
  name: parse equipments
  func: |-
    node.send([null,msg,msg]);
    msg.class = '';
    msg.enabled = true;

    if (msg.list === 'equipment') {
        let equipments = global.get('kernel.equipments','memoryOnly')||{};
        let i = 0;
        msg.payload = [];

        for (const equipment in equipments) {
            let row  = {};

            row.equipment = equipment;
            row.equipment_name = global.get('kernel.equipment["' + equipment + '"]','memoryOnly')||'';
            row.equipment_full = row.equipment_name + ' (' + equipment + ')';
            row.line = equipments[equipment];
            row.line_name = global.get('kernel.line["'  + row.line + '"]','memoryOnly')||'';
            row.line_full = row.line_name + ' (' + row.line + ')';
            row.plant = global.get('kernel.lines["' + row.line + '"]','memoryOnly')||'-';
            row.plant_name = global.get('kernel.plant["' + row.plant + '"]','memoryOnly')||'';
            row.plant_full = row.plant_name + ' (' + row.plant + ')';
            row.delete = (msg.dictionary?.common_action_delete)||'Delete';
            row.component_count = 0;
            row.state_color = '#CCCCCC';

            if (row.plant === flow.get('form["' + msg.hmi.id + '"]["plant"]','memoryOnly')) {
                let state = global.get('kernel.state["' + row.equipment + '|run"]', 'memoryOnly');
                if (typeof state === 'number') {
                    row.state_color = (state === 0 ? '#FF0000' : '#008000');
                }

                let links = global.get('kernel.link','memoryOnly');
                let needle = new RegExp('^(' + row.equipment + '\\|)');

                if (typeof links === 'object') {
                    for (const endpoint in links) {
                        if (endpoint.match(needle) !== null) {
                            row.component_count += 1;
                        }
                    }
                }

                msg.payload[i++] = row;
            }
        }

        // Records title
        msg.total = i;
        node.send([msg,null,null]);

        if (i > 0) {
            if (msg.hmi.lang === 'fr') {
                return [null,msg,null];
            } else {
                return [null,null,msg];
            }
        }
    }

    return;
