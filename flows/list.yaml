- id: 3a0957e2bd9d6687
  type: function
  z: e97c6f12735a13c1
  g: fa98f46bfd60fed6
  name: data
  func: |-
    // Parse counters

    msg.payload = [];

    node.send([null, msg, msg]);

    msg.class = '';
    msg.enabled = true;

    if (msg.list === 'counter') {
        const meters = global.get('kernel.meter') || {};
        const counters = global.get('kernel.counters') || {};
        const plant = global.get('form["' + msg.hmi.id + '"]["plant"]');
        let i = 0;

        for (const entity in meters) {
            let row  = {};
            let esplit = entity.split('|');

            row.entity = entity;
            row.equipment = esplit[0];
            row.counter = esplit[1];
            row.family = global.get('kernel.families["' + row.equipment + '"]') || '';
            row.line = global.get('kernel.equipments["' + row.equipment + '"]') || '';
            row.plant = global.get('kernel.lines["' + row.line + '"]') || '';

            const definition = global.get('kernel.counter["' + row.counter + '"]');

            if (row.plant !== plant || row.family === '' || counters[row.counter] !== row.family || typeof definition !== 'string') {

                continue;
            }

            let csplit = definition.split('|');

            row.equipment_name = global.get('kernel.equipment["' + row.equipment + '"]') || '';
            row.equipment_full = row.equipment_name + ' (' + row.equipment + ')';
            row.line_name = global.get('kernel.line["'  + row.line + '"]') || '';
            row.line_full = row.line_name + ' (' + row.line + ')';
            row.family_name = global.get('kernel.family["' + row.family + '"]') || '';
            row.family_full = row.family_name + ' (' + row.family + ')';
            row.counter_name = csplit.slice(1).join('|');
            row.counter_full = row.counter_name + ' (' + row.counter + ')';
            row.state = Math.round((Number(String(meters[entity]).split('|')[0]) || 0) * 10) / 10;
            row.state_limit = Number(csplit[0]) || 0;
            row.percent = row.state_limit > 0 ? Math.round(row.state * 100 / row.state_limit) : 0;
            row.percent_full = row.percent.toString() + '%';
            row.state_color = row.percent < 75 ? msg.dictionary.option_color.on : (row.percent < 100 ? msg.dictionary.option_color.median : msg.dictionary.option_color.off);
            row.reset = (msg.dictionary.option_action.reset) || 'Reset';

            msg.payload[i++] = row;
        }

        // Records title
        msg.total = i;
        node.send([msg, null, null]);

        if (i > 0) {
            msg.payload.sort((a, b) => a.percent < b.percent ? 1 : -1);

            if (msg.hmi.lang === 'fr') {

                return [null, msg, null];
            } else {

                return [null, null, msg];
            }
        }
    }

    return;
