  type: function
  z: e97c6f12735a13c1
  g: ac0595b45d9786aa
  name: action
  func: |-
    if (msg.action === 'row_click') {
        global.set('form["' + msg.hmi.id + '"]["plant"]', typeof msg.payload.plant === 'string' ? msg.payload.plant : '', 'memoryOnly');
        global.set('form["' + msg.hmi.id + '"]["line"]', typeof msg.payload.line === 'string' ? msg.payload.line : '', 'memoryOnly');
        global.set('form["' + msg.hmi.id + '"]["equipment"]', typeof msg.payload.equipment === 'string' ? msg.payload.equipment : '', 'memoryOnly');

        msg.payload = global.get('describe.pages.detail.tab', 'memoryOnly') || 0;

        delete msg.action;
        delete msg.column;

        return [null, null, msg];
    } else if (msg.action === 'button_click' && msg.column === 'delete') {
        
        return [msg, null, null];
    } else {
        if (typeof msg.list !== 'string' || msg.list === '') {
            msg.payload = '';
            msg.class = 'remove';
            msg.enabled = false;
        }
        else {
            msg.ui_update = {'label': (msg.dictionary.list.records) || 'Records: '};
            msg.payload = Number(msg.total||0);
            msg.class = '';
            msg.enabled = true;
        }

        return [null, msg, null];
    }
