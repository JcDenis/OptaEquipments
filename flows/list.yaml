    // Get user plant

    // Check if required page is current flow
    msg.flow = env.get('NR_FLOW_NAME');
    msg = await node.linkcall('ui - tab', msg);

    if (msg.enabled !== true) {
        // page is disabled
        msg.class = 'remove';
        msg.enabled = false;
        msg.payload = '';

        return [ msg, msg ];
    }


    if (msg.hmi.plant === '') {
        // admin can select a plant
        msg.payload = global.get('form["' + msg.hmi.id + '"]["plant"]')||'';

        // Get plants for form
        msg = await node.linkcall('option - plant', msg);

        if (msg.payload === '') {
            // user must selected a plant

            return [ null, msg ];
        }
        // show selected plant

        return [ msg, msg ];
    }

    // user is linked to a plant
    msg.payload = msg.hmi.plant;

    return [ msg, null ];
