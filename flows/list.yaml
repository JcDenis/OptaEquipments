- id: 16a8aa9d41637b79
  type: function
  z: e97c6f12735a13c1
  g: 2c0f9b39f8c7dd73
  name: tab &  level
  func: >-
    let check = 'list';


    msg.class = 'remove';

    msg.enabled = false;

    msg.topic = '';

    msg.payload = '';


    if (msg.hmi.tab === global.get('describe.pages["' + check +
    '"]["tab"]','memoryOnly')) {
        if (typeof global.get('describe.pages["' + check + '"]["level"]["' + msg.hmi.level + '"]','memoryOnly') === 'boolean'
            && global.get('describe.pages["' + check + '"]["level"]["' + msg.hmi.level + '"]','memoryOnly') === true
        ) {
            msg.class = '';
            msg.enabled = true;

            return [null,msg,null];
        } else {
            return [null, null, msg];
        }
    }


    if (msg.hmi.tab === 99) {
        return [msg,null,null];
    }


    return [null,null,msg];
  outputs: 3
  timeout: 0
  noerr: 0
  initialize: ''
  finalize: ''
