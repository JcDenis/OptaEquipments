- id: 7e9274837d469e1c
  type: function
  z: e97c6f12735a13c1
  g: 4e3920250d1c0ff6
  name: data
  func: |-
    // Parse holidays

    msg.payload = [];

    node.send([null, msg, msg]);

    msg.class = '';
    msg.enabled = true;

    if (msg.list === 'holiday') {
        let holidays = global.get('kernel.holiday') || {};
        let i = 0;

        for (const plant in holidays) {
            if (plant === global.get('form["' + msg.hmi.id + '"]["plant"]')) {
                let hsplit = holidays[plant].split('|');

                for (const k in hsplit) {
                    let row  = {};
                    row.entity = plant;
                    row.date = hsplit[k];
                    row.month = hsplit[k].slice(0,2);
                    row.day = hsplit[k].slice(3);
                    row.delete = (msg.dictionary.option_action.delete) || 'Delete';

                    msg.payload[i++] = row;
                }
            }
        }

        // Records title
        msg.total = i;
        node.send([msg, null, null]);

        if (i > 0) {
            msg.payload.sort(function($l, $r) {
                if ($l.month === $r.month) {

                    return $l.month > $r.month ? 1 : -1;
                }

                return $l.month < $r.month ? 1 : -1;
            });

            msg.payload.sort(function($l, $r) {
                if ($l.day === $r.day) {

                    return $l.day > $r.day ? 1 : -1;
                }

                return $l.mondayth < $r.day ? 1 : -1;
            });

            if (msg.hmi.lang === 'fr') {

                return [null, msg, null];
            } else {

                return [null, null, msg];
            }
        }
    }

    return;
