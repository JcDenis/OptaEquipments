- id: 206c82b3fa97b1c2
  type: function
  z: e97c6f12735a13c1
  g: 6f784a48183c4937
  name: parse lines
  func: |-
    node.send([null,msg,msg]);
    msg.class = '';
    msg.enabled = true;

    if (msg.list === 'line') {
        let lines = global.get('kernel.lines','memoryOnly')||{};
        let i = 0;
        msg.payload = [];

        for (const line in lines) {
            let row  = {};

            row.line = line;
            row.line_name = global.get('kernel.line["' + line + '"]','memoryOnly')||'';
            row.line_full = row.line_name + ' (' + line + ')';
            row.plant = lines[line];
            row.plant_name = global.get('kernel.plant["'  + row.plant + '"]','memoryOnly')||'';
            row.plant_full = row.plant_name + ' (' + row.plant + ')'||'';
            row.delete = (msg.dictionary?.common_action_delete)||'Delete';
            row.equipment_count = 0;

            if (row.plant === flow.get('form["' + msg.hmi.id + '"]["plant"]','memoryOnly')) {
                let equipments = global.get('kernel.equipments','memoryOnly');
                if (typeof equipments === 'object') {
                    for (const equipment in equipments) {
                        if (equipments[equipment] === line) {
                            row.equipment_count += 1;
                        }
                    }
                }

                msg.payload[i++] = row;
            }
        }

        // Records title
        msg.total = i;
        node.send([msg,null,null]);

        if (i > 0) {
            if (msg.hmi.lang === 'fr') {
                return [null,msg,null];
            } else {
                return [null,null,msg];
            }
        }
    }

    return;
