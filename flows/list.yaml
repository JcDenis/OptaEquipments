  name: parse devices
  func: |-
    node.send([null,msg,msg]);
    msg.class = '';
    msg.enabled = true;

    if (msg.list === 'device') {
        let devices = global.get('kernel.device','memoryOnly')||{};
        let i = 0;
        msg.payload = [];

        for (const entity in devices) {
            let row  = {};
            let esplit = entity.split('|');

            row.entity = entity;
            row.model = esplit[0];
            row.model_name = global.get('describe.model["' + row.model + '"]','memoryOnly')||''
            row.model_full = row.model_name + ' (' + row.model + ')';
            row.device = esplit[1];
            row.delete = (msg.dictionary?.common_action_delete)||'Delete';
            row.component_count = 0;
            row.watchdog_color = '#CCCCCC';

            let watchdog = global.get('kernel.watchdog["' + row.entity + '"]', 'memoryOnly');
            if (typeof watchdog === 'number') {
                row.watchdog_color = devices[entity] === 1 ? '#008000' : '#FF0000';
            }

            let rlinks = global.get('rlink', 'memoryOnly');
            let needle = new RegExp('^(' + row.model + '\\|' + row.device + '\\|)');

            if (typeof rlinks === 'object') {
                for (const target in rlinks) {
                    if (target.match(needle) !== null) {
                        row.component_count += 1;
                    }
                }
            }

            msg.payload[i++] = row;
        }

        // Records title
        msg.total = i;
        node.send([msg, null, null]);

        if (i > 0) {
            if (msg.hmi.lang === 'fr') {
                return [null, msg, null];
            } else {
                return [null, null, msg];
            }
        }
    }

    return;
