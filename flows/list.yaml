  type: function
  z: e97c6f12735a13c1
  g: 6f784a48183c4937
  name: data
  func: |-
    // Parse lines

    msg.payload = [ ];

    node.send([ null, msg, msg ]);

    msg.class = '';
    msg.enabled = true;

    if (msg.list === 'line') {
        const lines = { ...(global.get('kernel.lines') || { }) };
        let i = 0;

        for (const line in lines) {
            let row  = { };

            row.line = line;
            row.line_name = global.get('kernel.line["' + line + '"]') || '';
            row.line_full = row.line_name + ' (' + line + ')';
            row.plant = lines[line];
            row.plant_name = global.get('kernel.plant["'  + row.plant + '"]') || '';
            row.plant_full = row.plant_name + ' (' + row.plant + ')';
            row.delete = (msg.dictionary.option_action.delete) || 'Delete';
            row.equipment_count = 0;

            if (row.plant === global.get('form["' + msg.hmi.id + '"]["plant"]')) {
                let equipments = global.get('kernel.equipments');
                if (typeof equipments === 'object') {
                    for (const equipment in equipments) {
                        if (equipments[equipment] === line) {
                            row.equipment_count += 1;
                        }
                    }
                }

                msg.payload[i++] = row;
            }
        }

        // Records title
        msg.total = i;
        node.send([ msg, null, null ]);

        if (i > 0) {
            
            msg.payload.sort((a, b) => a.line_name.localeCompare(b.line_name));

            if (msg.hmi.lang === 'fr') {

                return [ null, msg, null ];
            }

            return [ null, null, msg ];
        }
    }

    return;
