            row.plant_name = global.get('kernel.plant["' + row.plant + '"]','memoryOnly')||'';
            row.plant_full = row.plant_name + ' (' + row.plant + ')';
            row.state = global.get('kernel.state["' + entity + '"]','memoryOnly')||0;
            row.state_limit = Number(alerts[entity]);
            row.state_color = row.state < row.state_limit ? '#008000':'#FF0000';
