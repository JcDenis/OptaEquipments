- id: 66226f3b64ad19a9
  type: function
  z: e97c6f12735a13c1
  g: e86385b18b9154e7
  name: more
  func: >-
    let watchdog = global.get('kernel.watchdog["' + msg.row.entity + '"]',
    'memoryOnly');

    if (typeof watchdog === 'number') {
        msg.row.watchdog_color = msg.payload === 1 ? '#008000' : '#FF0000';
    }


    let rlinks = global.get('rlink','memoryOnly');

    let needle = new RegExp('^(' + msg.row.model + '\\|' + msg.row.device +
    '\\|)');


    if (typeof rlinks === 'object') {
        for (const target in rlinks) {
            if (target.match(needle) !== null) {
                msg.row.component_count += 1;
            }
        }
    }


    return msg;
  outputs: 1
  timeout: 0
  noerr: 0
  initialize: ''
  finalize: ''
  libs: []
  x: 930
