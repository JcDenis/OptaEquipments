  type: function
  z: c886080f59e5c106
  g: f36d68ae11d562a5
  name: data
  func: |-
    const limit = Date.now() - (5 * 60 *1000);

    const tree = flow.get('tree') || { }; // autotupdate
    for ( const k in tree) {
        if (tree.time < limit) {
            delete tree[k];
        }
    }

    const sentence = flow.get('sentence') || { }; // autoupdate
    for (const k in sentence) {
        if (sentence.time < limit) {
            delete sentence[k];
        }
    }

    return;
