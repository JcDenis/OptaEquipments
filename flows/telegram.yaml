  name: plants
  func: |-
    function oe_opts(){
      var plants = global.get('kernel.plant', 'default');
      var opts = [[]];
      var i = 0;
      for(var key in plants){
        opts[i++] = [{
          'callback_data':'plant|'+key,
          'text':plants[key]
        }];
      }
      return opts;
    }

    msg.payload = {
    //    'messageId':99,
    //    'sentMessageId':99,
        'type':'message',
        'content':"Bonjour @" + msg.user.telegram + ".\n A quelle usine allons nous travailler ?",
        'options': {reply_markup: JSON.stringify({"inline_keyboard":oe_opts()})}
    }

    return msg;
