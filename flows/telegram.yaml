  name: equipment
  func: |-

    msg.sentence['equipments'] = { };
    let match = [];
    const haystack = global.get('kernel.equipment') || { };
    for (const e in haystack) {
        let lower = haystack[e].toLowerCase();
        let line = global.get('kernel.equipments["' + e + '"]') || '-';
        let plant = global.get('kernel.lines["' + line + '"]') || '-';
        msg.sentence['equipments'][e] = 0;

        if (msg.user.plant === '' || msg.user.plant === plant) {
            for (const word in msg.sentence.left) {
                if (lower.match('(' + word + ')') !== null) {
                    msg.sentence['equipments'][e] += 1;
                    match.push(word);
                }
            }
        }
    }

    const  equipments = msg.sentence['equipments'];
    for (const e in equipments) {
        if (equipments[e] === 0) {
            delete msg.sentence['equipments'][e]
        }
    }

    for (const word in msg.sentence.left) {
        if (match.includes(word)) {
            delete msg.sentence['left'][word];
        }
    }

    return msg;
