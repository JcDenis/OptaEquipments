- id: b4d4ce8fa8bc8014
  type: function
  z: c886080f59e5c106
  g: 9530b4911db3e343
  name: lines
  func: |-
    function oe_opts(plant){
      var lines = global.get('kernel.line');
      var opts = [[]];
      var i = 0;
      for(var key in lines){
        var comp = global.get('kernel.lines.' + key);
        if (comp == plant) {
          opts[i++] = [{
            'callback_data':'line|'+key,
            'text':lines[key]
          }];
        }
      }
      return opts;
    }

    msg.payload = {
    //    'messageId':99,
    //    'sentMessageId':99,
        'type':'message',
        'content':"@" + msg.user.telegram + ", vous avez choisi l'usine '" + global.get('kernel.plant.' + msg.entity) + "'.\nSélectionnez une ligne :",
        'options': {reply_markup: JSON.stringify({"inline_keyboard":oe_opts(msg.entity)})}
    }

    return msg;
  outputs: 1
  timeout: 0
  noerr: 0
  initialize: ''
  finalize: ''
