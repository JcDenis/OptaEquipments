- id: f524efc356b2d4bc
  type: function
  z: c886080f59e5c106
  name: plants
  func: |-
    function oe_opts(){
      var plants = global.get('kernel.plant', 'default');
      var opts = [[]];
      var i = 0;
      for(var key in plants){
        opts[0][i++] = {
          'callback_data':'plant|'+key,
          'text':plants[key]
        };
      }
      return opts;
    }

    msg.payload = {
        'type':'message',
        'content':'Bonjour ' + msg.originalMessage.from.username + '.' + "\n" + ' A quelle usine allons nous travailler ?',
    //    'messageId':99,
    //    'sentMessageId':99,
        'options': {reply_markup: JSON.stringify({"inline_keyboard":oe_opts()})}
    }

    return msg;
  outputs: 1
