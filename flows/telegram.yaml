- id: bdd5c6474370efe4
  type: function
  z: c886080f59e5c106
  g: 9530b4911db3e343
  name: heat
  func: |-
    var opts = [[]];
    var i = 0;
    var state = global.get('kernel.state.' + msg.entity + '|' + msg.component);
    if (global.get('kernel.reverse.' + msg.entity + '|' + msg.component)) {
      state = !state;
    }
    if (state) {
      opts[0][i++] = {
        "text": "Désactiver la chauffe",
        "callback_data": "heat|0"
      }
    } else {
      opts[0][i++] = {
        "text": "Activer la chauffe",
        "callback_data": "heat|1"
      }
    }
    if (global.get('kernel.team.' + msg.plant + '|m') !== undefined) {
      if (global.get('kernel.disabled.' + msg.line) === true) {
        opts[0][i++] = {
          "text": "Activer la programmation",
          "callback_data": "period|1"
        }
      } else {
        opts[0][i++] = {
          "text": "Désatciver la programmation",
          "callback_data": "period|0"
        }
      }
    }
    msg.payload = {
    //    'messageId':99,
    //    'sentMessageId':99,
        'type':'message',
        'content':'Gestion de la chauffe:',
        'options': {reply_markup: JSON.stringify({"inline_keyboard":opts})}
    }

    return msg;
  outputs: 1
  timeout: 0
  noerr: 0
