- id: a5b2d841998b3f62
  type: function
  z: c886080f59e5c106
  g: 9530b4911db3e343
  name: equipments
  func: |-
    function oe_opts(options){
      var opts = [[]];
      var i = 0;
      for(var key in options){
        opts[i++] = [{
          'callback_data': 'lara|' + options[key]['equipment'] + '|' + options[key]['component'] + '|' + options[key]['state'],
          'text':options[key]['name']
        }];
      }
      return opts;
    }

    msg.payload = {
    //    'messageId':99,
    //    'sentMessageId':99,
        'type':'message',
        'content':"@" + msg.user.telegram + ", voici ce que j'ai trouvé :",
        'options': {reply_markup: JSON.stringify({"inline_keyboard":oe_opts(msg.options)})}
    }

    return msg;
  outputs: 1
