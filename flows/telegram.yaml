- id: b96d31a1d6579eb1
  type: function
  z: c886080f59e5c106
  g: 37ab0c5a35f9a77b
  name: data
  func: |-
    msg.user = {
        'id': ''
    };

    node.status({
        'fill': 'red',
        'text': ''
    });

    const users = global.get('auth') || { };
    for (const u in users) {
        if (typeof users[u]['telegram'] === 'string' && users[u]['telegram'] !== '') {
            let split = users[u]['telegram'].split(',');
            for (let i = 0; i < split.length; i++) {
                if (msg.originalMessage.from.username === split[i]) {
                    msg.user = { ...users[u], ...{ 'id': u } };
                    delete msg.user.pass;
                    flow.set('user', msg.user);

                    msg.hmi = {
                        'lang': msg.user.lang
                    }

                    node.status({
                        'fill': 'green',
                        'text': msg.user.telegram
                    });
                }
            }
        }
    }

    return msg;
  outputs: 1
  timeout: 0
  noerr: 0
  initialize: ''
  finalize: ''
