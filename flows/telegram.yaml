- id: 45f071d40d5ffa92
  type: function
  z: c886080f59e5c106
  g: 569324cc42ab32e4
  name: data
  func: |-

    msg = await node.linkcall('telegram - user', msg);
    if (msg.user.id === '') {

        return;
    }

    msg = await node.linkcall('kernel - hmi', msg);

    if (flow.get('tree') !== 'object') {
        flow.set('tree', { })
    }

    let tree = flow.get('tree') || { }; // autoupdate
    tree[msg.user.telegram] = {
        'time': Date.now()
    };

    if (msg.user.plant === '') {
        const plants = global.get('kernel.plant') || { };
        let opts = [ [ ] ];
        let i = 0;
        for (const key in plants) {
          opts[i++] = [ {
          'callback_data': 'plant|' + key,
          'text': plants[key]
          } ];
        }

        msg.payload = {
        //    'messageId':99,
        //    'sentMessageId':99,
            'type':'message',
            'content':"@" + msg.user.telegram + ", vous êtes " + msg.dictionary.option_level[msg.user.level] + "\nSélectionnez une usine :",
            'options': { reply_markup: JSON.stringify({ "inline_keyboard": opts }) }
        }

        return msg;
    }

    msg.entity = msg.user.plant;
    tree[msg.user.telegram] = {
        'time': Date.now(),
        'plant': msg.user.plant,
        'line': '',
        'equipment': ''
    };

    const lines = global.get('kernel.line') || { };
    let lopts = [ [ ] ];
    let j = 0;
    for (const key in lines) {
      let comp = global.get('kernel.lines.' + key) || '-';
      if (comp === msg.entity) {
        lopts[j++] = [ {
          'callback_data': 'line|'+key,
          'text': lines[key]
        } ];
      }
    }

    msg.payload = {
        //'messageId':99,
        //'sentMessageId':99,
        'type':'message',
        'content':"@" + msg.user.telegram + ", vous êtes " + msg.dictionary.option_level[msg.user.level] + "\nSélectionnez une ligne :",
        'options': { reply_markup: JSON.stringify({"inline_keyboard": lopts }) }
    }

    return msg;
  outputs: 1
  timeout: 0
  noerr: 0
