  func: |-
    function oe_opts(plant){
      var lines = global.get('kernel.line','default');
      var opts = [[]];
      var i = 0;
      for(var key in lines){
        var comp = global.get('kernel.lines.' + key, 'default');
        if (comp == plant) {
          opts[i++] = [{
            'callback_data':'line|'+key,
            'text':lines[key]
          }];
        }
      }
      return opts;
    }

    msg.payload = {
    //    'messageId':99,
    //    'sentMessageId':99,
        'type':'message',
        'content':"@" + msg.user.telegram + ", vous avez choisi l'usine '" + global.get('kernel.plant.' + msg.entity, 'default') + "'.\nIl nous faut choisir une ligne :",
        'options': {reply_markup: JSON.stringify({"inline_keyboard":oe_opts(msg.entity)})}
    }

    return msg;
