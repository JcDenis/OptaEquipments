        "callback_data": "cyclemeter|0"
      }];
    }
    msg.payload = {
    //    'messageId':99,
    //    'sentMessageId':99,
        'type':'message',
        'content':'Gestion de compteur:' + content,
        'options': {reply_markup: JSON.stringify({"inline_keyboard":opts})}
    }

    return msg;
