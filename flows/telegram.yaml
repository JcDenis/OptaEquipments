    msg.payload = {
        'type':'message',
        'content':'Que voulez vous faire ?',
    //    'messageId':99,
    //    'sentMessageId':99,
        'options': {reply_markup: JSON.stringify({"inline_keyboard":opts})}
    }

    return msg;
