- id: b4d4ce8fa8bc8014
  type: function
  z: c886080f59e5c106
  name: lines
  func: |-
    function oe_opts(plant){
      var lines = global.get('kernel.line','default');
      var opts = [[]];
      var i = 0;
      for(var key in lines){
        var comp = global.get('kernel.lines.' + key, 'default');
        if (comp == plant) {
          opts[0][i++] = {
            'callback_data':'line|'+key,
            'text':lines[key]
          };
        }
      }
      return opts;
    }

    msg.payload = {
        'type':'message',
        'content':'Il nous faut choisir une ligne :',
    //    'messageId':99,
    //    'sentMessageId':99,
        'options': {reply_markup: JSON.stringify({"inline_keyboard":oe_opts(msg.entity)})}
    }

    return msg;
  outputs: 1
  timeout: 0
  noerr: 0
