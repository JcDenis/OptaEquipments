- id: 2bae655127ea8edc
  type: function
  z: 51c4b2897d2c318c
  g: 744a665a3304c311
  name: user plant
  func: |-
    if (msg.enabled !== true) {
        msg.class = "remove";
        msg.enabled = false;
        msg.payload = '';
        msg.list = '';

        return [msg,null,null];
    } else {
        let plant = global.get('form["' + msg.hmi.id + '"]["plant"]','memoryOnly')||'';
        if (plant.length > 0) {
            msg.payload = plant;

            return [null,msg,msg];
        }
        if (msg.hmi.plant !== '') {
            global.set('form["' + msg.hmi.id + '"]["plant"]',msg.hmi.plant,'memoryOnly');

            return [msg,msg,null];
        } else {

            return [null,null, msg];
        }
    }
  outputs: 3
