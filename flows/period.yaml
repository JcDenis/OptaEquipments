- id: 39cf9bc6de140b04
  type: function
  z: 51c4b2897d2c318c
  g: 744a665a3304c311
  name: teams
  func: |-
    let teams = global.get('kernel.team', 'memoryOnly') || {};
    let i = 0;

    msg.payload = [];

    if (typeof teams === 'object') {
        for (const team in teams) {
            let row = {};
            /* 0 = plant, 1 = team */
            let ksplit = team.split("|");
            row.plant = ksplit[0];
            row.team = ksplit[1];
            /* 0 = starttime, 1 = stoptime */
            let vsplit = teams[team].split("|");
            row.starttime = vsplit[0];
            row.stoptime = vsplit[1];

            if (row.plant === global.get('form["' + msg.hmi.id + '"]["plant"]', 'memoryOnly')) {
                let name = msg.dictionary?.option_team[row.team];
                if (typeof name == 'string') {
                    row.name = name;

                    msg.payload[i++] = row;
                }
            }
        }
    }

    if (i > 0) {
        msg.class = '';
        msg.enabled = true

        if (msg.hmi.lang === 'fr') {

            return [msg, null];
        } else {

            return [null, msg];
        }
    }

    return;
