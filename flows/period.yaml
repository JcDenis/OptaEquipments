- id: 0fc506fd101f1d0c
  type: function
  z: 51c4b2897d2c318c
  g: 744a665a3304c311
  name: periods
  func: >-
    msg.payload = [];


    let i = 0;

    let periods = {'m': 0, 'a': 0, 'n': 0, 'd': 0, 's': 0 };

    let plant = global.get('form["' + msg.hmi.id + '"]["plant"]', 'memoryOnly')
    || '';


    let lines = global.get('kernel.lines', 'memoryOnly') || {};

    for (const line in lines) {
        if (lines[line] === plant) {
            let row = {};

            let states = global.get('kernel.state', 'memoryOnly') || {};
            for (const state in states) {
                let ssplit = state.split('|');
                if (line === global.get('kernel.equipments["' + ssplit[0] + '"]', 'memoryOnly')
                    && ssplit[1].match((new RegExp('^(heatswitch|heatlink|heattoggle|heatpulse)$'))) !== null
                ) {
                    row.equipment = ssplit[0];
                    row.component = ssplit[1];
                    row.plant = plant;
                    row.plant_name = global.get('kernel.plant["' + row.plant + '"]', 'memoryOnly') || '';
                    row.line = line;
                    row.line_name = global.get('kernel.line["' + row.line + '"]', 'memoryOnly') || '';
                    row.line_full = row.line_name + '( ' + row.line + ')';
                    row.todisable = global.get('kernel.disabled["' + row.line + '"]', 'memoryOnly') === true ? false : true;
                    row.todisable_name = row.todisable ? msg.dictionary.common_glyph_on : msg.dictionary.common_glyph_off;

                    let period = global.get('kernel.period["' + row.line + '"]', 'memoryOnly') || '';
                    for (const team in periods) {
                        row[team] = period.match((new RegExp('(' + team + ')'))) !== null ? 1 : 0;
                        row["t" + team] = row[team] === 1 ? msg.dictionary.common_glyph_on : msg.dictionary.common_glyph_off;
                    }

                    msg.payload[i++] = row; 

                    break;
                }
            }
        }
    }


    // sort

    if (i > 0) {
        msg.class = '';
        msg.enabled = true;
        msg.payload.sort(function ($l, $r) {
            return $l.line_full  > $r.line_full  ? 1 : -1;
        });
    }


    // lang

    if (msg.hmi.lang === 'fr') {

        return [msg, null];
    } else {

        return [null, msg];
    }
  outputs: 2
  timeout: 0
  noerr: 0
