- id: f4d3e88b80009b83
  type: function
  z: 51c4b2897d2c318c
  g: 744a665a3304c311
  name: holidays
  func: |-
    let holidays = global.get('kernel.holiday', 'memoryOnly') || {};
    let i = 0;

    msg.payload = [];

    if (typeof holidays === 'object') {
        for (const plant in holidays) {
            if (plant === global.get('form["' + msg.hmi.id + '"]["plant"]', 'memoryOnly')) {
                let hsplit = holidays[plant].split('|');

                for (const k in hsplit) {
                    let row  = {};
                    row.entity = plant;
                    row.date = hsplit[k];
                    row.month = hsplit[k].slice(0,2);
                    row.day = hsplit[k].slice(3);

                    msg.payload[i++] = row;
                }
            }
        }
    }

    if (i > 0) {
        msg.class = '';
        msg.enabled = true

        if (msg.hmi.lang === 'fr') {

            return [msg, null];
        } else {

            return [null, msg];
        }
    }

    return;
