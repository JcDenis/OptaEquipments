- id: 2bae655127ea8edc
  type: function
  z: 51c4b2897d2c318c
  g: 744a665a3304c311
  name: user plant
  func: |-
    if (msg.enabled !== true) {
        // page is disabled
        msg.class = 'remove';
        msg.enabled = false;
        msg.payload = '';
        msg.list = '';

        return [msg, null, msg];
    }


    if (msg.hmi.plant === '') {
        // admin can select a plant
        msg.payload = global.get('form["' + msg.hmi.id + '"]["plant"]', 'memoryOnly') || '';

        if (msg.payload === '') {
            // user must selected a plant

            return [null, null, msg];
        } else {
            // show selected plant

            return [null, msg, msg];
        }
    } else {
        // user is linked to a plant
        msg.payload = msg.hmi.plant;

        return [null, msg, null];
    }
