- id: 7d1cbc3cd4edd0f3
  type: function
  z: 51c4b2897d2c318c
  g: 6cb8cb87cdf72081
  name: tab &  level
  func: >-
    let check = 'period';


    msg.class = 'remove';

    msg.enabled = false;

    msg.topic = '';

    msg.payload = '';


    if (msg.hmi.tab === global.get('describe.pages["' + check +
    '"]["tab"]','memoryOnly') 
        && typeof global.get('describe.pages["' + check + '"]["level"]["' + msg.hmi.level + '"]','memoryOnly') === 'boolean'
        && global.get('describe.pages["' + check + '"]["level"]["' + msg.hmi.level + '"]','memoryOnly') === true
    ) {
        msg.class = '';
        msg.enabled = true;

        await new Promise(resolve => setTimeout(resolve, 50)); // wait 50ms

        return msg;
    } else if (msg.hmi.tab === 99) {

        return msg;
    } else {

        return;
    }
  outputs: 1
