- id: 88105ea3fcd56b54
  type: function
  z: 51c4b2897d2c318c
  g: 744a665a3304c311
  name: action
  func: |-
    let newMsg = {
        'topic': '',
        'payload': '',
        'hmi': msg.hmi,
        'dictionary': msg.dictionary,
        '_client': msg._client
    };

    if (msg.action === 'button_click') {
        if (global.get('describe.pages.period.level["' + msg.hmi.level + '"]', 'memoryOnly') === true) {
            if (msg.column === 'todisable_name') {
                // kernel.disabled
                newMsg['kernel'] = {
                    'type': 'disabled',
                    'entity': msg.payload.line,
                    'value': msg.payload.todisable,
                    'loop': false
                };

                return [newMsg, null, null];
            } else {
                // kernel.period
                newMsg['kernel'] = {
                    'type': 'period',
                    'entity': msg.payload.line,
                    'value': (msg.column === 'tm' ? (msg.payload.m === 1 ? '' : 'm') : msg.payload.m === 1 ? 'm' : '') + (msg.column === 'ta' ? (msg.payload.a === 1 ? '' : 'a') : msg.payload.a === 1 ? 'a' : '') + (msg.column === 'tn' ? (msg.payload.n === 1 ? '' : 'n') : msg.payload.n === 1 ? 'n' : '') + (msg.column === 'td' ? (msg.payload.d === 1 ? '' : 'd') : msg.payload.d === 1 ? 'd' : '') + (msg.column === 'ts' ? (msg.payload.s === 1 ? '' : 's') : msg.payload.s === 1 ? 's' : ''),
                    'loop': false
                };

                return [newMsg, null, null];
            }
        } else {
            msg.payload = msg.dictionary.common_notice_level_fail;

            return [null, newMsg, null];
        }

    } else if (msg.action === 'row_click') {
        global.set('form["' + msg.hmi.id + '"]["plant"]', msg.payload.plant, 'memoryOnly');
        global.set('form["' + msg.hmi.id + '"]["line"]', msg.payload.line, 'memoryOnly');
        global.set('form["' + msg.hmi.id + '"]["equipment"]', '', 'memoryOnly');

        newMsg.hmi.tab = global.get('describe.pages.detail.tab', 'memoryOnly') || 0;
        newMsg.hmi.page = global.get('describe.pages.detail.name', 'memoryOnly') || '';
        newMsg.payload = newMsg.hmi.tab;

        return [null, null, newMsg];
    }

    return;
  outputs: 3
  timeout: 0
  noerr: 0
