- id: f37593ae4f3648ae
  type: function
  z: 3782b10e2580f9d3
  g: c1761abac2b91695
  name: data
  func: |-

    // Get user from UI element
    msg = await node.linkcall('kernel - hmi', msg);

    // Check level
    if (!['admin', 'rt', 'tech'].includes(msg.hmi.level)) {

        return;
    }

    // Not the button
    if (msg.action === 'row_click') {
        let form = global.get('form');

        // Should not happened
        if (typeof form[msg.hmi.id] !== 'object') {
            form[msg.hmi.id] = { };
        }

        // Update form
        form[msg.hmi.id]['plant'] = msg.payload.plant;
        form[msg.hmi.id]['line'] = msg.payload.line;
        form[msg.hmi.id]['equipment'] = msg.payload.equipment;

        delete msg.action;

        // UI redirect
        msg.hmi.tab = global.get('describe.pages.detail.tab') || '';
        msg.hmi.name = global.get('describe.pages.detail.page') || '';
        msg.payload = msg.hmi.tab;

        return [msg, null, null];
    }
    else if (msg.action === 'button_click' && msg.column === 'reset') {
        global.set('form["' + msg.hmi.id + '"]["confirm"]', msg.payload.entity);

        // Show dialog
        msg.show = ['ui - dialog - counter - confirm'];
        msg = await node.linkcall('ui - group', msg);

        // Wait ui update
        msg = await node.linkcall('ui - latency', msg);

        // Set dialog title
        msg.payload = msg.dictionary.counter.confirm_query || 'Do you want to reset this counter?';
        msg.uit_update = {
            'label': ''
        };

        node.send([null, msg, null]);

        // Set form buttons
        msg.payload = '';
        msg.ui_update = {
            'options': [
                {
                    'value': true,
                    'label': msg.dictionary.counter.confirm_yes ||'Yes'
                },
                {
                    'value': false,
                    'label': msg.dictionary.counter.confirm_no ||'No'
                }
            ],
            'label': ''
        };

        return [null, null, msg];
    }

    return;
