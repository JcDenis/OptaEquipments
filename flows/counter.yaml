- id: f12ed9d12246ade2
  type: function
  z: 3782b10e2580f9d3
  g: c1761abac2b91695
  name: data
  func: |-
    // Compute user form

    // Get user from UI element
    msg = await node.linkcall('kernel - hmi', msg);

    // Reset button: reset counter and refresh list
    if (msg.action === 'button_click' && msg.column === 'reset') {
        msg.kernel = {
            'type': 'meter',
            'entity': msg.payload.entity,
            'value': '',
            'loop': false
        };
        msg = await node.linkcall('kernel - reset', msg);

        delete msg.action;
        delete msg.column;
        delete msg.success;

        msg.payload = '';
        msg.class = '';
        msg.enabled = true;

        return [null, msg];
    }

    // Get user form
    let form = global.get('form'); // autoupdate

    // Should not happened
    if (typeof form[msg.hmi.id] !== 'object') {
        form[msg.hmi.id] = { };
    }

    // Update form
    form[msg.hmi.id]['plant'] = msg.payload.plant;
    form[msg.hmi.id]['line'] = msg.payload.line;
    form[msg.hmi.id]['equipment'] = msg.payload.equipment;

    delete msg.action;

    // UI redirect
    msg.hmi.tab = global.get('describe.pages.detail.tab') || '';
    msg.hmi.name = global.get('describe.pages.detail.page') || '';
    msg.payload = msg.hmi.tab;

    return [msg, null];
