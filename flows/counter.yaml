- id: 6c52fad3f3db703c
  type: function
  z: 3782b10e2580f9d3
  g: c1761abac2b91695
  name: data
  func: |-
    // Get user plants

    // Check if required page is current flow
    msg.flow = env.get('NR_FLOW_NAME');
    msg = await node.linkcall('ui - tab', msg);

    // Reset UI
    if (msg.enabled !== true) {
        // page is disabled
        msg.class = 'remove';
        msg.enabled = false;
        msg.payload = '';

        return [ msg, msg ];
    }

    // Get memories
    let form = global.get('form'); // autoupdate

    // Plant was not defined for the user
    if (msg.hmi.plant === '') {
        // admin can select a plant
        msg.payload = form[msg.hmi.id]['plant'] || '';

        // Get plants for form
        msg = await node.linkcall('option - plant', msg);

        // user must selected a plant
        if (msg.payload === '') {

            return [ null, msg ];
        }
        // show selected plant

        return [ msg, msg ];
    }

    // Plant is defined for the user
    msg.payload = msg.hmi.plant;

    form[msg.hmi.id]['plant'] = msg.payload;

    return [ msg, null ];
