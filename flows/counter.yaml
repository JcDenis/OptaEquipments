- id: 8c1ea3cbf7a64475
  type: function
  z: 3782b10e2580f9d3
  g: c1761abac2b91695
  name: data
  func: |-
    // Get plant counters

    // Reset UI
    if (msg.enabled !== true) {

        return [ msg, msg ];
    }

    msg.payload = [];
    let i = 0;

    // Get memories
    const plant = global.get('form["' + msg.hmi.id + '"]["plant"]') || '';
    const meters = global.get('kernel.meter') || { };
    const counters = global.get('kernel.counters') || { };

    // Rows
    for (const meter in meters) {
        let msplit = meter.split('|');
        let row = {};
        row.entity = meter;
        row.equipment = msplit[0];
        row.counter = msplit[1];
        row.family = global.get('kernel.families["' + row.equipment + '"]') || '';
        row.line = global.get('kernel.equipments["' + row.equipment + '"]') || '';
        row.plant = global.get('kernel.lines["' + row.line + '"]') || '';

        const definition = global.get('kernel.counter["' + row.counter + '"]');

        if (plant === row.plant
            && row.family !== ''
            && counters[row.counter] === row.family
            && typeof definition === 'string'
        ) {
            let csplit = definition.split('|');
            let state = row.equipment + '|run';

            row.plant_name = global.get('kernel.plant["' + row.plant + '"]') || '';
            row.line_name = global.get('kernel.line["' + row.line + '"]') || '';
            row.equipment_name = global.get('kernel.equipment["' + row.equipment + '"]') || '';
            row.family_name = global.get('kernel.family["' + row.family + '"]') || '';
            row.counter_name = csplit.slice(1).join('|');
            row.limit = Number(csplit[0]) || 0;
            row.hours = Math.round((Number(String(meters[meter]).split('|')[0]) || 0) * 10) / 10;
            row.hours_full = row.hours + ' / ' + row.limit;
            row.percent = row.limit > 0 ? Math.round(row.hours * 100 / row.limit) : 0;
            row.percent_full = row.percent.toString() + '%';
            row.diff_color = row.percent < 75 ? msg.dictionary.option_color.on : (row.percent < 100 ? msg.dictionary.option_color.median : msg.dictionary.option_color.off);
            row.state = global.get('kernel.state["' + state + '"]') || 0;
            row.state_color = row.state > 0 ? msg.dictionary.option_color.on : msg.dictionary.option_color.off;
            row.reset = ['admin', 'rt', 'tech'].includes(msg.hmi.level) ? ((msg.dictionary.option_action.reset) || 'Reset') : '';

            // chek if device is offline
            let ssplit = (global.get('kernel.link["' + state + '"]') || '').split('|');
            if (global.get('kernel.device["' + ssplit[0] + '|' + ssplit[1] + '"]') !== 1) {
                row.state_color = msg.dictionary.option_color.none;
            }

            msg.payload[i++] = row;
        }
    }

    // sort
    if (i > 0) {
        msg.class = '';
        msg.enabled = true;
        msg.payload.sort((a, b) => a.percent < b.percent ? 1 : -1);
    }

    // lang
    if (msg.hmi.lang === 'fr') {

        return [ msg, null ];
    }

    return [ null, msg ];
  outputs: 2
  timeout: 0
