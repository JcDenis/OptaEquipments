    msg.hide = ['ui - dialog - counter - confirm'];
    msg = await node.linkcall('ui - group', msg);

    // Get form value
    const entity = global.get('form["' + msg.hmi.id + '"]["confirm"]') || '';

    // Check form
    if (msg.payload !== true || entity === '') {

        return;
    }

    //delete form[msg.hmi.id]['confirm'];
    delete msg.ui_update;

    // Reset button: reset counter and refresh list
    msg.kernel = {
        'type': 'meter',
        'entity': entity,
        'value': '',
        'loop': false
    };
    msg = await node.linkcall('kernel - reset', msg);

    delete msg.success;

    msg.payload = '';
    msg.class = '';
    msg.enabled = true;

    return msg;
