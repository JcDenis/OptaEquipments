- type: function
  outputs: 1
  timeout: 0
  noerr: 0
  initialize: ''
  finalize: ''
  libs: []
  id: 17b2636bba6aed1b
  z: 4b1cb31503d721d9
  name: tick
  x: 400
  'y': 480
  wires:
    - []
  func: >-
    // Once a day at the chosen hour: send the value of every linked counter.

    // Every hour: try again to send a waiting queue (GMAO unreachable).


    // Sending is allowed only when commands are enabled (System > Application,
    or OPTA_COMMANDS=false)

    const commands = env.get('OPTA_COMMANDS') !== 'false' &&
    global.get('kernel.app.commands') !== false;


    const s = global.get('gmao', 'file') || { };


    if (s.enabled !== true || !commands || !s.url || !s.key) {
        node.status({ 'fill': 'grey', 'shape': 'ring', 'text': !commands ? 'commands disabled' : 'disabled' });

        return;
    }


    const now = new Date();

    const today = now.toLocaleDateString('sv-SE', { 'timeZone': env.get('TZ') ||
    'Europe/Paris' });

    const hour = Number(now.toLocaleString('en-GB', { 'hour': '2-digit',
    'hour12': false, 'timeZone': env.get('TZ') || 'Europe/Paris' }));


    if (s.last_daily !== today && hour >= Number(s.hour ?? 6)) {
        msg = await node.linkcall('gmao - read', msg);
        msg = await node.linkcall('gmao - queue', msg);
        let s2 = global.get('gmao', 'file') || { };
        s2.last_daily = today;
        global.set('gmao', s2, 'file');
        msg = await node.linkcall('gmao - flush', msg);
    } else if ((s.queue || []).length > 0 && Date.now() - (s.last_try || 0) >=
    3600000) {
        msg = await node.linkcall('gmao - flush', msg);
    }


    const s3 = global.get('gmao', 'file') || { };

    node.status({ 'fill': (s3.queue || []).length > 0 ? 'yellow' : 'green',
    'shape': 'dot', 'text': (s3.last_result || 'waiting') + ' / ' + (s3.queue ||
    []).length + ' waiting' });


    return;
- id: 99b7816e72dbebb7
  type: link in
