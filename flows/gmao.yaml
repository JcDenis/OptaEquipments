  id: fe08fd4b8de05965
  z: 4b1cb31503d721d9
  name: flush
  x: 400
  'y': 300
  wires:
    - - 977f09bae20c4826
  func: >-
    // Send the queue to the GMAO, in date order.

    // An event leaves the queue only when the GMAO confirms it (recorded, or
    already received),

    // or refuses it for good (the refusal is kept in the errors list).
    Otherwise it stays for the next try.


    // Sending is allowed only when commands are enabled (System > Application,
    or OPTA_COMMANDS=false)

    const commands = env.get('OPTA_COMMANDS') !== 'false' &&
    global.get('kernel.app.commands') !== false;


    const lang = (msg.hmi || { }).lang === 'fr' ? 'fr' : 'en';

    const t = (fr, en) => lang === 'fr' ? fr : en;

    let s = global.get('gmao', 'file') || { };


    // One send at a time

    if (Date.now() - (global.get('gmao_lock') || 0) < 120000) {
        msg.gmao_ok = false;
        msg.gmao_result = t('Envoi déjà en cours', 'Already sending');

        return msg;
    }


    if (s.enabled !== true || !commands) {
        msg.gmao_ok = false;
        msg.gmao_result = !commands ? t('Commandes désactivées : rien n\'est envoyé', 'Commands are disabled: nothing is sent') : t('Envoi à la GMAO désactivé', 'Sending to the GMAO is disabled');

        return msg;
    }


    global.set('gmao_lock', Date.now());


    let queue = (Array.isArray(s.queue) ? s.queue : []).slice();

    queue.sort((a, b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));


    let sent = 0;

    let refused = 0;

    let failure = '';

    const errors = [];

    const save = () => {
        s = global.get('gmao', 'file') || { };
        s.queue = queue;
        global.set('gmao', s, 'file');
    };

    const refuse = (ev, message) => {
        refused++;
        errors.push({ 'time': Date.now(), 'entity': ev.entity, 'compteur': ev.compteur, 'date': ev.date, 'message': message });
    };

    // 4xx with an error code is a definitive refusal, except key and rights
    problems which need a fix and a retry

    const definitive = (r) => r.status >= 400 && r.status < 500 && ![401, 403,
    408, 429].includes(r.status) && r.body !== null && typeof r.body.erreur ===
    'string';


    while (queue.length > 0 && failure === '') {
        if (queue[0].type === 'reset') {
            const ev = queue[0];
            msg.gmao_request = {
                'method': 'POST',
                'path': '/compteurs/' + ev.compteur + '/remise-a-zero',
                'body': { 'date': ev.date, 'valeur_avant': ev.valeur_avant, 'valeur_apres': ev.valeur_apres }
            };
            msg = await node.linkcall('gmao - request', msg);
            const r = msg.gmao_response;
            delete msg.gmao_response;

            if (r.status === 200) {
                sent++;
                queue.shift();
            } else if (definitive(r)) {
                refuse(ev, r.body.message);
                queue.shift();
            } else {
                failure = r.error || ('HTTP ' + r.status);
            }
        } else {
            // consecutive readings in one request
            let batch = [];
            while (queue.length > 0 && queue[0].type !== 'reset' && batch.length < 500) {
                batch.push(queue.shift());
            }
            msg.gmao_request = {
                'method': 'POST',
                'path': '/releves',
                'body': { 'releves': batch.map((ev) => ({ 'compteur': ev.compteur, 'valeur': ev.valeur, 'date': ev.date })) }
            };
            msg = await node.linkcall('gmao - request', msg);
            const r = msg.gmao_response;
            delete msg.gmao_response;

            if (r.status === 200 && r.body !== null && Array.isArray(r.body.resultats)) {
                // match each answer with its reading (the GMAO answers in date order)
                let waiting = batch.slice();
                for (const res of r.body.resultats) {
                    const i = waiting.findIndex((ev) => ev.compteur === res.compteur);
                    const ev = i >= 0 ? waiting.splice(i, 1)[0] : { 'compteur': res.compteur };
                    if (res.statut === 'enregistre' || res.statut === 'deja_recu') {
                        sent++;
                    } else {
                        refuse(ev, res.message || res.erreur || 'refused');
                    }
                }
                // readings without answer stay in the queue
                queue = waiting.concat(queue);
            } else if (definitive(r)) {
                batch.forEach((ev) => refuse(ev, r.body.message));
            } else {
                queue = batch.concat(queue);
                failure = r.error || ('HTTP ' + r.status);
            }
        }
        save();
    }


    s = global.get('gmao', 'file') || { };

    s.queue = queue;

    s.last_try = Date.now();

    if (failure === '') {
        s.last_ok = Date.now();
    }

    s.errors = errors.concat(Array.isArray(s.errors) ? s.errors : []).slice(0,
    20);

    msg.gmao_ok = failure === '';

    msg.gmao_result = failure !== ''
        ? t('Échec : ', 'Failed: ') + failure + ' (' + t('envoyés', 'sent') + ' ' + sent + ', ' + t('en attente', 'waiting') + ' ' + queue.length + ')'
        : t('Envoyés : ', 'Sent: ') + sent + (refused > 0 ? ', ' + t('refusés : ', 'refused: ') + refused : '');
    s.last_result = msg.gmao_result;

    global.set('gmao', s, 'file');

    global.set('gmao_lock', 0);


    node.status({ 'fill': failure === '' ? (refused > 0 ? 'yellow' : 'green') :
    'red', 'shape': 'dot', 'text': msg.gmao_result });


    return msg;
