  id: 6693e829695bf3d1
  z: 4b1cb31503d721d9
  name: read
  x: 400
  'y': 220
  wires:
    - - 3242ef80b5cee240
  func: >-
    // Current value of every counter linked to the GMAO => msg.gmao_events
    (readings)

    // kernel.gmao["equipment|counter"] = "GMAO counter id"

    // kernel.meter["equipment|counter"] = "hours|last
    runmetertotal|timestamp[|off|hide timestamp]"

    // Calendar counters: "0|0|last reset timestamp", value = days since last
    reset


    const kernel = global.get('kernel') || { };

    const links = kernel.gmao || { };

    const now = Date.now();

    const date = new Date(now).toISOString();

    let events = [];


    for (const entity in links) {
        const id = Number(links[entity]);
        const meter = (kernel.meter || { })[entity];
        const [equipment, counter] = entity.split('|');
        const definition = String((kernel.counter || { })[counter] ?? '');

        if (!(id > 0) || typeof meter !== 'string' || meter === '' || definition === '') {

            continue;
        }
        // counter no longer in the equipment family
        if ((kernel.counters || { })[counter] !== (kernel.families || { })[equipment]) {

            continue;
        }
        const m = meter.split('|');
        // hidden counter on this equipment
        if (m[3] === 'off') {

            continue;
        }
        const calendar = /d$/.test(definition.split('|')[0]);
        const valeur = calendar
            ? Math.max(0, Math.floor((now - (Number(m[2]) || now)) / 86400000))
            : Math.round((Number(m[0]) || 0) * 100) / 100;

        events.push({ 'type': 'reading', 'entity': entity, 'compteur': id, 'valeur': valeur, 'date': date });
    }


    msg.gmao_events = events;


    return msg;
