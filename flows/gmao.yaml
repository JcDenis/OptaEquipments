  z: 4b1cb31503d721d9
  name: status
  x: 400
  'y': 380
  wires:
    - - 5d056cd98a0045c2
  func: >-
    // GMAO link status => msg.gmao_status (rows for the System > GMAO table)


    // Sending is allowed only when commands are enabled (System > Application,
    or OPTA_COMMANDS=false)

    const commands = env.get('OPTA_COMMANDS') !== 'false' &&
    global.get('kernel.app.commands') !== false;


    const lang = (msg.hmi || { }).lang === 'fr' ? 'fr' : 'en';

    const t = (fr, en) => lang === 'fr' ? fr : en;

    const s = global.get('gmao', 'file') || { };

    const links = Object.values(global.get('kernel.gmao') || { }).filter((v) =>
    String(v) !== '').length;

    const when = (ts) => ts ? new Date(ts).toLocaleString(lang === 'fr' ?
    'fr-FR' : 'en-GB', { 'timeZone': env.get('TZ') || 'Europe/Paris' }) : '-';

    const queue = Array.isArray(s.queue) ? s.queue : [];


    let state = t('Activé', 'Enabled');

    if (s.enabled !== true) {
        state = t('Désactivé', 'Disabled');
    } else if (!commands) {
        state = t('Commandes désactivées : rien n\'est envoyé', 'Commands are disabled: nothing is sent');
    } else if (!s.url || !s.key) {
        state = t('Adresse ou clé manquante', 'Address or key missing');
    }


    let rows = [
        { 'item': t('État', 'State'), 'value': state },
        { 'item': t('Compteurs liés', 'Linked counters'), 'value': String(links) },
        { 'item': t('Envoi quotidien', 'Daily send'), 'value': String(s.hour ?? 6).padStart(2, '0') + ':00' + (s.last_daily ? ' (' + t('dernier', 'last') + ' ' + s.last_daily + ')' : '') },
        { 'item': t('Dernier envoi réussi', 'Last successful send'), 'value': when(s.last_ok) },
        { 'item': t('Dernière tentative', 'Last try'), 'value': when(s.last_try) + (s.last_result ? ' : ' + s.last_result : '') },
        { 'item': t('En attente', 'Waiting'), 'value': String(queue.length) + (s.dropped ? ' (' + s.dropped + ' ' + t('perdus', 'lost') + ')' : '') }
    ];

    for (const e of (Array.isArray(s.errors) ? s.errors : []).slice(0, 5)) {
        rows.push({ 'item': t('Refus', 'Refusal') + ' ' + when(e.time), 'value': (e.entity || ('#' + e.compteur)) + ' : ' + e.message });
    }


    msg.gmao_status = rows;


    return msg;
