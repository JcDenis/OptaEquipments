- type: function
  outputs: 1
  timeout: 0
  noerr: 0
  initialize: ''
  finalize: ''
  libs:
    - var: http
      module: http
    - var: https
      module: https
    - var: url
      module: url
  id: 07b105d04dfc15e9
  z: 4b1cb31503d721d9
  name: request
  x: 400
  'y': 60
  wires:
    - - a37b3ba67f460231
  func: >-
    // HTTP request to the GMAO API (SPIGMAO)

    // msg.gmao_request = { method, path, body } => msg.gmao_response = {
    status, body, error }

    // status 0 = not sent (missing setting, network error, timeout)


    const s = global.get('gmao', 'file') || { };

    const req = msg.gmao_request || { };

    const base = String(s.url || '').trim().replace(/\/+$/, '');


    delete msg.gmao_request;


    if (base === '' || String(s.key || '') === '') {
        msg.gmao_response = { 'status': 0, 'error': 'GMAO address or API key missing' };

        return msg;
    }


    let target;

    try {
        target = new url.URL(base + '/api/v1' + (req.path || ''));
    } catch (e) {
        msg.gmao_response = { 'status': 0, 'error': 'Invalid GMAO address' };

        return msg;
    }


    const data = typeof req.body === 'undefined' ? null :
    JSON.stringify(req.body);

    const headers = {
        'X-Api-Key': String(s.key),
        'Accept': 'application/json'
    };

    if (data !== null) {
        headers['Content-Type'] = 'application/json';
        headers['Content-Length'] = Buffer.byteLength(data);
    }


    msg.gmao_response = await new Promise((resolve) => {
        const lib = target.protocol === 'https:' ? https : http;
        const r = lib.request(target, { 'method': req.method || 'GET', 'headers': headers, 'timeout': 20000 }, (res) => {
            let text = '';
            res.setEncoding('utf8');
            res.on('data', (chunk) => { text += chunk; });
            res.on('end', () => {
                let body = null;
                try {
                    body = JSON.parse(text);
                } catch (e) {
                    body = null;
                }
                resolve({ 'status': res.statusCode, 'body': body, 'error': body === null ? 'Invalid answer from the GMAO (HTTP ' + res.statusCode + ')' : (body.ok === false ? body.message : '') });
            });
        });
        r.on('timeout', () => r.destroy(new Error('timeout')));
        r.on('error', (e) => resolve({ 'status': 0, 'body': null, 'error': e.message }));
        if (data !== null) {
            r.write(data);
        }
        r.end();
    });


    node.status({ 'fill': msg.gmao_response.status === 200 ? 'green' : 'red',
    'shape': 'dot', 'text': (req.method || 'GET') + ' ' + (req.path || '/') + '
    => ' + (msg.gmao_response.status || msg.gmao_response.error) });


    return msg;
