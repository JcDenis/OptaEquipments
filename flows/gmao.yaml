  'y': 140
  wires:
    - - 09bc4780813664a3
  func: >-
    // Add msg.gmao_events to the send queue (file context, survives restarts)

    // reading: { type: 'reading', entity, compteur, valeur, date }

    // reset:   { type: 'reset', entity, compteur, date, valeur_avant,
    valeur_apres }


    // Sending is allowed only when commands are enabled (System > Application,
    or OPTA_COMMANDS=false)

    const commands = env.get('OPTA_COMMANDS') !== 'false' &&
    global.get('kernel.app.commands') !== false;


    const events = Array.isArray(msg.gmao_events) ? msg.gmao_events : [];

    let s = global.get('gmao', 'file') || { };


    delete msg.gmao_events;

    msg.gmao_queued = 0;


    if (s.enabled !== true || !commands || events.length === 0) {

        return msg;
    }


    let queue = (Array.isArray(s.queue) ? s.queue : []).concat(events);

    // Keep the queue bounded if the GMAO stays unreachable for a long time

    if (queue.length > 5000) {
        s.dropped = (s.dropped || 0) + queue.length - 5000;
        queue = queue.slice(queue.length - 5000);
    }

    s.queue = queue;

    global.set('gmao', s, 'file');


    msg.gmao_queued = events.length;

    node.status({ 'fill': 'blue', 'shape': 'dot', 'text': queue.length + '
    waiting' });


    return msg;
