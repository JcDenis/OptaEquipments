- type: function
  outputs: 1
  timeout: 0
  noerr: 0
  initialize: ''
  finalize: ''
  libs: []
  id: 3397cd83692a9f76
  z: 4b1cb31503d721d9
  name: reset
  x: 400
  'y': 580
  wires:
    - []
  func: >-
    // A counter linked to the GMAO was reset: send the dated reset at once (see
    kernel - loop)

    // kernel.meter["equipment|counter"] = "hours|last
    runmetertotal|timestamp[|off|hide timestamp]"

    // Calendar counters: "0|0|last reset timestamp"


    const g = msg.gmao || { };

    const kernel = global.get('kernel') || { };

    const id = Number((kernel.gmao || { })[g.entity] || 0);


    if (!(id > 0) || typeof g.before !== 'string' || g.before === '') {

        return;
    }


    const before = g.before.split('|');

    const after = String(g.after ?? '').split('|');


    // counter hidden, or shown again: not a reset

    if (before[3] === 'off' || after[3] === 'off') {

        return;
    }


    const definition = String((kernel.counter || { })[g.entity.split('|')[1]] ??
    '');

    let avant;

    let apres;

    let when;


    if (/d$/.test(definition.split('|')[0])) {
        // calendar counter: days since last reset
        const t0 = Number(before[2]) || 0;
        const t1 = g.after === '' ? g.time : (Number(after[2]) || 0);
        if (!(t0 > 0 && t1 > t0)) {

            return;
        }
        avant = Math.max(0, Math.floor((t1 - t0) / 86400000));
        apres = 0;
        when = t1;
    } else {
        // hours counter: hours only go up, except on reset
        const h0 = Number(before[0]) || 0;
        const h1 = g.after === '' ? 0 : (Number(after[0]) || 0);
        if (!(h1 < h0)) {

            return;
        }
        avant = Math.round(h0 * 100) / 100;
        apres = Math.round(h1 * 100) / 100;
        when = g.after === '' ? g.time : (Number(after[2]) || g.time);
    }


    msg.gmao_events = [{ 'type': 'reset', 'entity': g.entity, 'compteur': id,
    'date': new Date(when).toISOString(), 'valeur_avant': avant, 'valeur_apres':
    apres }];

    delete msg.gmao;


    msg = await node.linkcall('gmao - queue', msg);

    if (msg.gmao_queued > 0) {
        msg = await node.linkcall('gmao - flush', msg);
        node.status({ 'fill': msg.gmao_ok ? 'green' : 'yellow', 'shape': 'dot', 'text': g.entity + ' : ' + msg.gmao_result });
    }


    return;
