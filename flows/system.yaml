- id: 3524ea127575a179
  type: function
  z: 44465f18e06bb58d
  g: 9b721894958e4019
  name: clean
  func: >-
    // Delete all orphans


    // Get user from UI element

    msg = await node.linkcall('kernel - hmi', msg);


    // Check user right

    if (!['admin'].includes(msg.hmi.level)) {

        return;
    }


    msg = await node.linkcall('system - orphan - list', msg);


    for (const row of msg.orphans) {
        node.send([{
            'topic': '',
            'payload': '',
            'kernel': {
                'type': row.type,
                'entity': row.entity,
                'value': '',
                'loop': false,
                'delete': true
            }
        }, null]);
    }


    // Kernel loop handles 100 messages per second

    const count = msg.orphans.length;

    await new Promise(resolve => setTimeout(resolve, Math.min(4000, count * 12 +
    200)));


    msg.notice = ((msg.dictionary.system || { }).orphan_cleaned || '%n
    deleted').replace('%n', count);

    delete msg.orphans;

    msg = await node.linkcall('ui - notice', msg);


    // Wait kernel and ui update, then refresh list

    msg = await node.linkcall('ui - latency', msg);


    msg.payload = '';

    msg.selected = 'orphan';

    msg.enabled = true;


    return [null, msg];
