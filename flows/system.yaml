  func: |-
    // reset
    flow.set('kernel["' + msg.hmi.id + '"]', {}, 'memoryOnly');

    // ui
    msg.options = [];
    msg.class = '';
    msg.enabled = true;

    // get kernel types
    let types = global.get('kernel', 'default');
    let i = 0;
    for (const type in types) {
        msg.options[i++] = {
            'label':type,
            'value':type,
        };
    }

    return msg;
