- id: 570387b36904e75f
  type: function
  z: 44465f18e06bb58d
  g: c5aa438b6dcec795
  name: data
  func: |-
    // Build menu selector

    // Check if required page is current flow
    msg.flow = env.get('NR_FLOW_NAME');
    msg = await node.linkcall('ui - tab', msg);

    // key => ui group name and button label
    msg.menu = {
        'app': {
            'group': 'Application',
            'label': (msg.dictionary.system || { }).menu_app || 'Application'
        },
        'tree': {
            'group': 'Arborescence',
            'label': (msg.dictionary.system || { }).menu_tree || 'Tree structure'
        },
        'ota': {
            'group': 'Firmware OPTA',
            'label': (msg.dictionary.system || { }).menu_ota || 'Opta firmware'
        }
    };

    // Hide all groups
    msg.hide = [];
    for (const k in msg.menu) {
        msg.hide.push(msg.menu[k]['group']);
    }

    msg = await node.linkcall('ui - group', msg);

    if (!msg.enabled) {

        return [msg, msg];
    }

    msg.payload = '';
    msg.class = '';
    msg.enabled = true;
    msg.ui_update = {
        'options': []
    };

    // Keep user menu groups for menu click (msg.menu is lost on click)
    if (typeof global.get('menu') !== 'object') {
        global.set('menu', { });
    }
    let menu = global.get('menu'); // autoupdate
    menu[msg.hmi.id] = { ...(menu[msg.hmi.id] || { }), 'system': { } };

    for (const k in msg.menu) {
        msg.ui_update.options.push({
            'value': k,
            'label': msg.menu[k]['label']
        });
        menu[msg.hmi.id]['system'][k] = msg.menu[k]['group'];
    }

    delete msg.menu;

    return [null, msg];
  outputs: 2
  timeout: 0
  noerr: 0
