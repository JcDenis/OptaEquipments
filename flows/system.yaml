- id: b85fe87d7fc1a07a
  type: function
  z: 44465f18e06bb58d
  g: c5aa438b6dcec795
  name: data
  func: |-
    const selected = msg.payload;
    msg.payload = '';

    // Get user from UI element
    msg = await node.linkcall('kernel - hmi', msg);

    msg.hide = [];
    msg.show = [];

    // User menu groups saved on page build
    const menu = global.get('menu["' + msg.hmi.id + '"]["system"]') || { };

    for (const k in menu) {
        if (k === selected) {
            msg.show.push(menu[k]);
        }
        else {
            msg.hide.push(menu[k]);
        }
    }

    msg = await node.linkcall('ui - group', msg);
    msg = await node.linkcall('ui - latency', msg);

    // Go to sections
    msg.payload = '';
    msg.class = '';
    msg.enabled = true;
    msg.selected = selected;
    delete msg.ui_update;

    return msg;
  outputs: 1
  timeout: 0
  noerr: 0
  initialize: ''
  finalize: ''
  libs: []
  x: 630
  'y': 240
  wires:
    - - 0c83fe1f9690e061
