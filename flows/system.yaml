- id: 9fc7fa689859e74b
  type: function
  z: 44465f18e06bb58d
  g: 9b721894958e4019
  name: list
  func: >-
    // List orphan kernel entries (other than lines and equipments, see kernel -
    noline)


    const kernel = global.get('kernel') || { };

    const has = (type, entity) =>
    Object.prototype.hasOwnProperty.call(kernel[type] || { }, entity);

    const text = (key, def) => (msg.dictionary.system || { })[key] || def;


    let rows = [];

    const add = (type, entity, reason) => rows.push({ 'type': type, 'entity':
    entity, 'reason': reason });


    // Components of an unknown equipment (and so their values)

    let deadLinks = { };

    for (const link in (kernel.link || { })) {
        if (!has('equipment', link.split('|')[0])) {
            add('link', link, text('orphan_link', 'Component of an unknown equipment'));
            deadLinks[link] = true;
        }
    }

    for (const type of ['state', 'reverse', 'alert']) {
        for (const entity in (kernel[type] || { })) {
            if (!has('link', entity) || deadLinks[entity] === true) {
                add(type, entity, text('orphan_component', 'Value of an unknown component'));
            }
        }
    }


    // Settings of an unknown line

    for (const type of ['period', 'disabled', 'location']) {
        for (const entity in (kernel[type] || { })) {
            if (!has('line', entity)) {
                add(type, entity, text('orphan_line', 'Setting of an unknown line'));
            }
        }
    }


    // Settings of an unknown plant

    for (const type of ['map', 'tz', 'day', 'holiday']) {
        for (const entity in (kernel[type] || { })) {
            if (!has('plant', entity)) {
                add(type, entity, text('orphan_plant', 'Setting of an unknown plant'));
            }
        }
    }

    for (const entity in (kernel.team || { })) {
        if (!has('plant', entity.split('|')[0])) {
            add('team', entity, text('orphan_plant', 'Setting of an unknown plant'));
        }
    }


    // Watchdogs of an unknown device

    for (const entity in (kernel.watchdog || { })) {
        if (!has('device', entity)) {
            add('watchdog', entity, text('orphan_device', 'Watchdog of an unknown device'));
        }
    }


    // Counters of an unknown family, or incomplete counters

    let deadCounters = { };

    for (const counter in (kernel.counters || { })) {
        if (!has('family', kernel.counters[counter]) || !has('counter', counter)) {
            add('counters', counter, text('orphan_counter', 'Counter of an unknown family'));
            deadCounters[counter] = true;
        }
    }

    for (const counter in (kernel.counter || { })) {
        if (!has('counters', counter) || deadCounters[counter] === true) {
            add('counter', counter, text('orphan_counter', 'Counter of an unknown family'));
            deadCounters[counter] = true;
        }
    }


    // Meters of an unknown equipment or counter

    for (const entity in (kernel.meter || { })) {
        const msplit = entity.split('|');
        if (!has('equipment', msplit[0]) || !has('counter', msplit[1]) || deadCounters[msplit[1]] === true) {
            add('meter', entity, text('orphan_meter', 'Meter of an unknown equipment or counter'));
        }
    }


    // Family of an unknown equipment, or unknown family

    for (const entity in (kernel.families || { })) {
        if (!has('equipment', entity) || !has('family', kernel.families[entity])) {
            add('families', entity, text('orphan_families', 'Family of an unknown equipment, or unknown family'));
        }
    }


    rows.sort((a, b) => (a.type + '|' + a.entity).localeCompare(b.type + '|' +
    b.entity));

    msg.orphans = rows;


    return msg;
  outputs: 1
