  type: function
  z: 44465f18e06bb58d
  g: 6ed9fb5c0b268c66
  name: data
  func: |-

    // Get user from UI element
    msg = await node.linkcall('kernel - hmi', msg);

    if (msg.payload !== '') {
        // set type
        flow.set('kernel["' + msg.hmi.id + '"]["type"]', msg.payload, 'memoryOnly');
        flow.set('kernel["' + msg.hmi.id + '"]["entity"]', '', 'memoryOnly');

        // get kernel entitites
        let entities = global.get('kernel["' + msg.payload + '"]', 'memoryOnly');
        msg.options = [];
        let i = 0;
        for (const entity in entities) {
            msg.options[i++] = {
                'label':entity,
                'value':entity,
            };
        }

        // ui
        msg.class = '';
        msg.enabled = true;

        return msg;
    }

    return;
