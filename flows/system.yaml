- id: a94368f2bf7b4951
  type: function
  z: 44465f18e06bb58d
  g: c5aa438b6dcec795
  name: tab &  level
  func: >-
    let check = 'system';


    msg.class = 'remove';

    msg.enabled = false;

    msg.topic = '';

    msg.payload = '';


    if (msg.hmi.tab === global.get('describe.pages["' + check +
    '"]["tab"]','memoryOnly')) {
        if (typeof global.get('describe.pages["' + check + '"]["level"]["' + msg.hmi.level + '"]','memoryOnly') === 'boolean'
            && global.get('describe.pages["' + check + '"]["level"]["' + msg.hmi.level + '"]','memoryOnly') === true
        ) {
            msg.class = '';
            msg.enabled = true;

            return [null,msg,null];
        } else {
            return [null, null, msg];
        }
    }


    if (msg.hmi.tab === 99) {
        return [msg,null,null];
    }


    return [null,null,msg];
  outputs: 3
  timeout: 0
  noerr: 0
  initialize: ''
  finalize: ''
  libs: []
  x: 290
  'y': 140
  wires:
    - - 0d7c72be0d6bd539
