  type: function
  z: 44465f18e06bb58d
  g: 7c224f2f2afc76d3
  name: data
  func: |-

    // Get user from UI element
    msg = await node.linkcall('kernel - hmi', msg);

    // Check user right
    if (![ 'admin' ].includes(msg.hmi.level)) {

        return;
    }

    const opta_version = Number(msg.payload);

    msg.payload = '';
    msg.class = '';
    msg.enabled = true;

    if (opta_version < 1) {

        return [ null, msg ];
    }

    flow.set('form_version', opta_version);

    global.set('opta.version', {
        'verion': 0,
        'buffer': ''
    }, 'file');

    msg.payload = 0;

    delete msg.hmi;
    delete msg.dictionary;

    return [ msg, null ];
