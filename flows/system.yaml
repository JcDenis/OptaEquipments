- id: bb264675471fc481
  type: function
  z: 44465f18e06bb58d
  g: 6ed9fb5c0b268c66
  name: data
  func: |-
    await new Promise(resolve => setTimeout(resolve, 50));

    // Get user from UI element
    msg = await node.linkcall('kernel - hmi', msg);

    // reset
    flow.set('kernel["' + msg.hmi.id + '"]', {}, 'memoryOnly');

    // ui
    msg.options = [];
    msg.class = '';
    msg.enabled = true;

    // get kernel types
    let types = global.get('kernel', 'memoryOnly');
    let i = 0;
    for (const type in types) {
        msg.options[i++] = {
            'label':type,
            'value':type,
        };
    }

    return msg;
