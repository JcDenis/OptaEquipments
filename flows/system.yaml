- id: 4e2673a49fda749b
  type: function
  z: 44465f18e06bb58d
  g: 9b721894958e4019
  name: delete
  func: >-
    // Delete one orphan


    // Get user from UI element

    msg = await node.linkcall('kernel - hmi', msg);


    // Check user right

    if (!['admin'].includes(msg.hmi.level) || msg.action !== 'button_click' ||
    msg.column !== 'delete') {

        return;
    }


    node.send([{
        'topic': '',
        'payload': '',
        'kernel': {
            'type': msg.payload.type,
            'entity': msg.payload.entity,
            'value': '',
            'loop': false,
            'delete': true
        }
    }, null]);


    // Wait kernel and ui update, then refresh list

    msg = await node.linkcall('ui - latency', msg);


    delete msg.action;

    delete msg.column;

    msg.payload = '';

    msg.selected = 'orphan';

    msg.enabled = true;


    return [null, msg];
  outputs: 2
