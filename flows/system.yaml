- id: 31bfab192e2ed76c
  type: function
  z: 44465f18e06bb58d
  g: 9b721894958e4019
  name: data
  func: >-
    // Orphans section


    const hide = (payload) => ({ ...msg, 'payload': payload, 'class': 'remove',
    'enabled': false });


    if (msg.enabled !== true || msg.selected !== 'orphan') {

        return [hide([]), hide([]), hide('')];
    }


    msg = await node.linkcall('system - orphan - list', msg);


    const rows = msg.orphans.map(row => ({ ...row, 'delete':
    msg.dictionary.option_action.delete || 'Delete' }));

    delete msg.orphans;


    if (rows.length === 0) {
        msg.notice = (msg.dictionary.system || { }).orphan_none || 'No orphan';
        msg = await node.linkcall('ui - notice', msg);

        return [hide([]), hide([]), hide('')];
    }


    let table = { ...msg, 'payload': rows, 'class': '', 'enabled': true };

    let button = { ...msg, 'payload': '', 'class': '', 'enabled': true };

    button.ui_update = {
        'label': ((msg.dictionary.system || { }).orphan_clean || 'Clean all') + ' (' + rows.length + ')'
    };


    if (msg.hmi.lang === 'fr') {

        return [table, hide([]), button];
    }


    return [hide([]), table, button];
