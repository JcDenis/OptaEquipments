- id: bd4743d319d07a5a
  type: function
  z: f6f2187d.f17ca8
  g: 216f821485a9eb19
  name: data
  func: |-
    // Compute device watchdog value

    // build reverse links
    msg = await node.linkcall('kernel - rlink', msg);

    // backup and restore
    msg = await node.linkcall('kernel - memory', msg);

    const kernel = global.get('kernel');
    const limit = Math.round(Date.now() / 1000) - (kernel.app.watchdog || 120);

    let newMsg = {
        'kernel': { },
        'topic': '',
        'payload': ''
    };

    for (const device in kernel.device) {
        let watchdog = (kernel.watchdog[device] || 0) < limit ? 0 : 1;

        newMsg.kernel = {
            'type': 'device',
            'entity': device,
            'value': watchdog,
            'loop': false
        };

        newMsg.telegram = {'change': false};
        if (newMsg.kernel.value !== kernel.device[device]) {
            newMsg.telegram = {
                'type': 'watchdog',
                'change': true,
                'entity': device,
                'value': watchdog === 1 ? true : false
            }
        }

        node.status({
            'fill': watchdog ? 'green' : 'red',
            'text': device + ' = ' + watchdog
        });
        node.send(newMsg);
    }

    return;
  outputs: 1
  timeout: 0
  noerr: 0
