  name: ui - style
  order: 0
  width: 0
  height: 0
  head: ''
  format: |-
    body {
        background: rgb(var(--v-theme-background));
    }
    .v-application__wrap {
        min-height: 60dvh;
    }
    .v-card-item {
        display: none;
    }
    .v-card-text {
        margin-top: 1em;
    }
    .v-tab-item--selected {
        color: rgb(var(--v-theme-primary)) !important;
    }
    .v-card .remove,
    .v-card-text .remove {
        display: none !important;
        visibility: hidden;
        color: transparent !important;
    }
    .nrdb-ui-file-input .v-btn__content {
        text-indent: -9999px;
        line-height: 0;
    }
    .nrdb-ui-file-input .v-btn__content::after {
        content: "►";
        text-indent: 0;
        display: block;
        line-height: initial;
    }

    .nrdb-ui-group {
        border-radius: 4px;
        box-shadow: 3px 2px 2px rgba(var(--v-border-color), var(--v-border-opacity));
    }
    .v-toolbar {
        background: rgb(var(--v-theme-background));
        padding: 0 0.5em;
    }
    .v-toolbar .v-btn-group {
        z-index: 2;
        background: rgb(var(--v-theme-navigation-background));
    }

    .oe-vendor {
        position: absolute;
        right: 1em;
        bottom: 1em;
        opacity: 0.15;
    }
    .oe-vendor:hover {
        opacity: 1;
    }
    .oe-title span {
        font-size: 1.4rem !important;
        padding: 0;
        color: rgb(var(--v-theme-primary));
    }
    .oe-center {
        margin: auto;
    }

    #oe-map-group {
        width: 100%;
        padding-bottom: 6em;
    }
    .oe-map-heat {
        cursor: pointer;
        transition: fill 0.6s ease;
    }
    .oe-map-click:hover {
        opacity: 0.75;
        stroke: rgb(var(--v-theme-navigation-background));
        stroke-width: 2px;
    }
    .oe-map-short {
        filter: drop-shadow(0 0 3px white) drop-shadow(0 0 2px white);
        font-size: 0.6em;
        font-weight: bold;
    }
    .oe-map-play {
        animation: blink 1s 5;
    }
    .oe-map-help {
        position: absolute;
        bottom: 1em;
        left: 1em;
        padding: 1em;
        list-style-type: none;
        line-height: 1.2em;
    border-radius: 4px;
        border: 1px solid rgba(var(--v-border-color), var(--v-border-opacity));
        box-shadow: 3px 2px 2px rgba(var(--v-border-color), var(--v-border-opacity));
        background: rgb(var(--v-theme-group-background));
    }

    @keyframes blink {
        0% { opacity: 1; }
        100% { opacity: 0; }
    }
