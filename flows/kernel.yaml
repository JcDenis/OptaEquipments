- id: d45e4f001b17cb32
  type: function
  z: f6f2187d.f17ca8
  g: 216f821485a9eb19
  name: data
  func: |-
    // Compute loop message

    delete msg.qos;
    delete msg.retain;

    /* check kernel message */
    if (typeof msg.kernel === 'object'
        && typeof msg.kernel.type === 'string'
        && typeof msg.kernel.entity === 'string'
        && typeof msg.kernel.value !== 'undefined'
        && typeof msg.kernel.loop === 'boolean'
    ) {
        let kernel = global.get('kernel'); // autoupdate

        /* deletion requested */
        if (typeof msg.kernel.delete === 'boolean' && msg.kernel.delete === true) {
            delete kernel[msg.kernel.type ][msg.kernel.entity];
        } else if (typeof kernel[msg.kernel.type] === 'object') {
            kernel[msg.kernel.type][msg.kernel.entity] = msg.kernel.value;

            delete msg.kernel.model;
            if (msg.kernel.type === 'state') {
                // For kernel state, retrieve component definition
                if (typeof kernel['link'][msg.kernel.entity] === 'string') {
                    let csplit = msg.kernel.entity.split("|");
                    msg.kernel.equipment = csplit[0];
                    msg.kernel.component = csplit[1];

                    let tsplit = kernel['link'][msg.kernel.entity].split("|");
                    msg.kernel.model = tsplit[0];
                    msg.kernel.device = tsplit[1];
                    msg.kernel.terminal = tsplit[2];
                    msg.kernel.convert = global.get('describe.convert["' + msg.kernel.model + '"]["' + msg.kernel.component + '"]')||'';

                    // Mirror components repeat input state to output
                    let mirror = msg.kernel.equipment + '|' + msg.kernel.component + 'mirror';
                    if (kernel['link'][mirror] === 'string') {
                        let mirrorMsg = {
                            'topic': '',
                            'payload': '',
                            'kernel': {
                                'type': msg.kernel.type,
                                'entity': mirror,
                                'value': msg.kernel.value,
                                'loop': false
                            }
                        };

                        node.status({ 
                            'fill': 'blue',
                            'text': msg.kernel.type + ' - ' + msg.kernel.equipment + ' - ' + msg.kernel.component + ' = ' + msg.kernel.value
                        });

                        node.send([null, null, null, mirrorMsg]);
                    }
                }
            }

            let newMsg = {
                'topic': '',
                'payload': '',
                'kernel': msg.kernel
            };

            node.status({
                'fill': msg.kernel.loop === false ? 'green' : 'yellow',
                'text': msg.kernel.type + ' - ' + msg.kernel.equipment + ' - ' + (msg.kernel.component || 'watchdog') + ' = ' + msg.kernel.value
            });

            return [
                // to kernel MQTT loop
                msg.kernel.loop === false ? newMsg : null,
                // to device loop
                typeof msg.kernel.model === 'string' && msg.kernel.loop === false ? newMsg : null,
                // to db
                typeof msg.kernel.model === 'string' ? newMsg : null,
                // mirror
                null
            ];
        }
    }

    return;
