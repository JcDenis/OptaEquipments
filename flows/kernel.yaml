- id: 35a18d3caa5ebb38
  type: function
  z: f6f2187d.f17ca8
  g: 11d028449aaa105b
  name: delete - device
  func: >-
    msg.payload = (msg.dictionary?.common_notice_device_noempty)||'Failed to
    delete device';

    msg.success = false;


    if (msg.hmi.level !== 'admin') {
        msg.payload = (msg.dictionary?.common_notice_level_fail)||'Insufficient right';
    } else if (typeof msg.kernel.entity === 'string' && msg.kernel.type ===
    'device') {
        let is_empty = true;
        // rlink (component)
        let rlinks = global.get('rlink','memoryOnly')||{};
        for (const rlink in rlinks) {
            let rsplit = rlink.split('|');
            if ((rsplit[0] + '|' + rsplit[1]) === msg.kernel.entity) {
                is_empty = false;
            }
        }

        if (is_empty === true) {
            // kernel.watchdog
            node.send({
                'topic':'',
                'payload':'',
                'kernel':{
                    'type':'watchdog',
                    'entity':msg.kernel.entity,
                    'value':'',
                    'loop':false,
                    'delete':true
                }
            });

            // kernel.device
            node.send({
                'topic': '',
                'payload': '',
                'kernel': {
                    'type': 'device',
                    'entity': msg.kernel.entity,
                    'value': '',
                    'loop': false,
                    'delete': true
                }
            });

            // kernel.link and kernel.rlink must be deleted from component

            msg.payload = (msg.dictionary?.common_notice_tree_update_success)||'Device successfully deleted';
            msg.success = true;
        }
    }


    delete msg.kernel;


    return [null,msg];
  outputs: 2
  timeout: 0
  noerr: 0
  initialize: ''
  finalize: ''
