- id: bd4743d319d07a5a
  type: function
  z: f6f2187d.f17ca8
  g: 216f821485a9eb19
  name: data
  func: >-
    // Compute device watchdog value


    // build reverse links

    msg = await node.linkcall('kernel - rlink', msg);


    // backup and restore

    msg = await node.linkcall('kernel - memory', msg);


    let newMsg = {
        'kernel': { },
        'topic': '',
        'payload': ''
    };


    const limit = Math.round(Date.now() / 1000) -
    (global.get('kernel.app.watchdog', 'memoryOnly') || 120);


    const devices = { ...(global.get('kernel.device', 'memoryOnly') || { }) };

    for (const device in devices) {
        let watchdog = (global.get('kernel.watchdog["' + device + '"]', 'memoryOnly') || 0) < limit ? 0 : 1;

        newMsg.kernel = {
            'type': 'device',
            'entity': device,
            'value': watchdog,
            'loop': false
        };

        newMsg.telegram = {'change': false};
        if (newMsg.kernel.value !== global.get('kernel.device["' + device + '"]', 'memoryOnly')) {
            newMsg.telegram = {
                'type': 'watchdog',
                'change': true,
                'entity': device,
                'value': watchdog === 1 ? true : false
            }
        }

        node.status({
            'fill': watchdog ? 'green' : 'red',
            'text': device + ' = ' + watchdog
        });
        node.send(newMsg);
    }


    return;
