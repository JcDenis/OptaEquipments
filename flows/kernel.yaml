  name: row
  func: >-
    /* tree */

    let tsplit = msg.team.split('|');

    msg.row.plant = tsplit[0];

    msg.row.team = tsplit[1];


    /* dec */

    let dec = global.get('kernel.day["' + msg.row.plant + '"]', 'default')||0;

    msg.row.dectime = Number(dec * 100);

    msg.row.dec = msg.row.ts - (Math.round(Number(dec) * 60 * 60 * 1000));


    /* time */

    let psplit = msg.payload.split('|');

    let pstart = psplit[0].split(':');

    let pstop = psplit[1].split(':');

    msg.row.starttime = Number(pstart[0] + pstart[1]);

    msg.row.stoptime = Number(pstop[0] + pstop[1]);


    /* for datetime formatter */

    msg.row.tz = global.get('kernel.tz["' + msg.row.plant + '"]',
    'default')||'Europe/Paris';

    msg.outTz = msg.row.tz


    return msg;
