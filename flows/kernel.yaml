  group: ''
  page: ''
  ui: 68fb8d742e5053db
  name: ui - menu
  order: 0
  width: 0
  height: 0
  head: ''
  format: |-
    <template>
        <Teleport v-if="mounted" to="#oe-header">
            <v-toolbar class="oe-nav"> 
            <v-btn-toggle v-model="oe_page.id" color="primary" variant="outlined" divided mandatory>
                <v-btn v-for="btn in oe_buttons" :value="btn.id" :icon="btn.icon" :title="btn.title" @click="oe_nav(btn)"></v-btn>
            </v-btn-toggle>
            <v-toolbar-title :text="oe_page.title"></v-toolbar-title>
            </v-toolbar>
        </Teleport>
        
        <Teleport v-if="mounted" to="main">
            <v-btn class="oe-vendor" href="https://github.com/JcDenis/OptaEquipments"><img height="32px" src="/icon.png" :title="oe_page.vendor"></img></v-btn>
        </Teleport>
    </template>

    <script>
        export default {
            data() {
                return {
                    mounted: false,
                    oe_buttons: [],
                    oe_page: {
                        id: 'none',
                        title: '',
                        lang: 'en',
                        vendor: 'none',
                        header: 'none'
                    }
                }
            },
            mounted() {
                // Default lang
                const blang = navigator.language || navigator.userLanguage;
                this.send(blang);

                // Navigation bar
                if (!document.querySelector("#oe-header")) {
                    let div = document.createElement("div");
                    div.id="oe-header";
                    const el = document.body.querySelector("#app").prepend(div);
                }
        
                // Prevent refresh
                document.addEventListener('keydown', (e) => {
                    e = e || window.event;
                    if(e.keyCode == 116) { //} || (e.ctrlKey && e.keyCode == 82)){
                        e.preventDefault();
                    }
                });

                this.mounted = true;
            },
            methods: {
                oe_nav: function (btn) {
                    this.send(btn.id)
                }
            },
            watch: {
                msg: function (msg) {
                    if (typeof msg.page_data !== 'object' || msg.page_data.title === '') {

                        return;
                    }

                    this.oe_page = { ...msg.page_data };

                    document.documentElement.setAttribute("lang", this.oe_page.lang);
                    document.documentElement.setAttribute("translate", "no");
                    document.title = this.oe_page.header + ' - ' + this.oe_page.title;

                    // Populate menu
                    if (Array.isArray(msg.buttons)) {
                        this.oe_buttons = msg.buttons
                    }
                }
            }
        }

    </script>
