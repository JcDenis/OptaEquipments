- id: 3450fffd4f368319
  type: ui-template
  z: f6f2187d.f17ca8
  g: 32da9b1ae024e8bb
  group: ''
  page: ''
  ui: 68fb8d742e5053db
  name: ui - head
  order: 0
  width: 0
  height: 0
  head: ''
  format: |-
    <template>
        <Teleport v-if="mounted" to="#oe_header">
            <v-toolbar class="oe_nav"> 
            <v-btn-group variant="outlined" divided>
                <v-btn v-if="oe_menus.alert" @click="oe_nav('alert')" :title="oe_titles.alert" icon="mdi-wrench"></v-btn> 
                <v-btn v-if="oe_menus.period" @click="oe_nav('period')" :title="oe_titles.period" icon="mdi-clock"></v-btn> 
                <v-btn v-if="oe_menus.detail" @click="oe_nav('detail')" :title="oe_titles.detail" icon="mdi-magnify"></v-btn> 
                <v-btn v-if="oe_menus.list" @click="oe_nav('list')" :title="oe_titles.list" icon="mdi-format-list-bulleted-square"></v-btn> 
                <v-btn v-if="oe_menus.tree" @click="oe_nav('tree')" :title="oe_titles.tree" icon="mdi-file-tree"></i></v-btn> 
                <v-btn v-if="oe_menus.users" @click="oe_nav('users')" :title="oe_titles.users" icon="mdi-account"></v-btn> 
                <v-btn v-if="oe_menus.system" @click="oe_nav('system')" :title="oe_titles.system" icon="mdi-cog"></v-btn> 
                <v-btn v-if="oe_menus.auth" @click="oe_nav('auth')" :title="oe_titles.auth" icon="mdi-login"></v-btn> 
            </v-btn-group>
            <v-toolbar-title :text="msg.title"></v-toolbar-title>
            <v-btn href="https://github.com/JcDenis/OptaEquipments"><img height="32px" src="/icon.png" :title="msg.full"></img></v-btn>
            </v-toolbar>
        </Teleport>
    </template>

    <script>
        export default {
            data() {
                return {
                    oe_menus: { auth: false, alert: false, period: false, detail: false, list: false, tree: false, users: false, system: false },
                    oe_titles: { auth: '', alert: '', period: '', detail: '', list: '', tree: '', users: '', system: '' },
                    mounted: false
                }
            },
            mounted() {
                const blang = navigator.language || navigator.userLanguage;
                this.send(blang);
                let div = document.createElement("div");
                div.id="oe_header";
                const el = document.body.querySelector("#app").prepend(div);
                this.mounted = true;
            },
            methods: {
                oe_nav: function (page) {
                    this.send(page)
                }
            },
            watch: {
                msg: function (msg) {
                    document.documentElement.setAttribute("lang", msg.page_lang);
                    document.title = msg.page_title;
                    this.oe_menus = msg.menus;
                    this.oe_titles = msg.titles;
                }
            }
        }

    </script>
  storeOutMessages: true
  passthru: false
