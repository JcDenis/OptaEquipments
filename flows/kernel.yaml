  format: |-
    <template>
        
    </template>

    <script>
    export default {
        methods: {
            getThemeColors() {
                // FlowFuse Dashboard 2.0 theme colors are exposed as CSS variables on the root elements
                const rootStyle = getComputedStyle(document.documentElement);
                
                // Vuetify variables store RGB strings (e.g., "33, 150, 243")
                const primaryRGB = rootStyle.getPropertyValue('--v-theme-primary').trim();
                const surfaceRGB = rootStyle.getPropertyValue('--v-theme-surface').trim();
                const backgroundRGB = rootStyle.getPropertyValue('--v-theme-background').trim();
                const groupRGB = rootStyle.getPropertyValue('--v-theme-group-background').trim();

                const themePresetColors = {
                    primary: `rgb(${primaryRGB})`,
                    surface: `rgb(${surfaceRGB})`,
                    background: `rgb(${backgroundRGB})`,
                    group: `rgb(${groupRGB})`
                };

                this.send({ payload: themePresetColors });
            }
        },
        mounted() {
            setTimeout(() => { this.getThemeColors(); }, 500);
        }
    }
    </script>
