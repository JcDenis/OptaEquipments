- id: c406704f6968a018
  type: function
  z: f6f2187d.f17ca8
  g: c964e18221782e03
  name: data
  func: >-
    // Reset an equipment counter

    // kernel.meter["equipment|counter"] = "0|current runmetertotal"


    msg.payload = msg.dictionary.option_notice.update_fail;

    msg.success = false;


    if (!['admin', 'rt', 'tech'].includes(msg.hmi.level)) {
        msg.payload = msg.dictionary.option_notice.level_fail;
    } else if (msg.kernel?.type === 'meter' && typeof msg.kernel.entity ===
    'string') {
        const meter = global.get('kernel.meter["' + msg.kernel.entity + '"]');

        if (typeof meter === 'string') {
            const equipment = msg.kernel.entity.split('|')[0];
            let total = Number(global.get('kernel.state["' + equipment + '|runmetertotal"]'));
            if (!Number.isFinite(total)) {
                total = Number(meter.split('|')[1]) || 0;
            }

            node.send([{
                'topic': '',
                'payload': '',
                'kernel': {
                    'type': 'meter',
                    'entity': msg.kernel.entity,
                    'value': '0|' + total,
                    'loop': false
                }
            }, null]);

            msg.payload = msg.dictionary.option_notice.update_success;
            msg.success = true;
        }
    }


    delete msg.kernel;


    // Wait ui update

    msg = await node.linkcall('ui - latency', msg);


    // UI notice

    msg.notice = msg.payload;

    msg = await node.linkcall('ui - notice', msg);


    return [null, msg];
