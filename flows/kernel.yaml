- id: dc41a85b166525a3
  type: function
  z: f6f2187d.f17ca8
  g: 216f821485a9eb19
  name: data
  func: |-
    // Prepare period loop

    const kernel = global.get('kernel');

    let final_teams = { };
    let final_periods = { };
    let final_pilots = { };

    for (const team in kernel.team) {
        msg.team = team;
        msg.payload = kernel.team[team];
        msg.row = {
            'ts': Date.now()
        }

        // Get team data
        msg = await node.linkcall('kernel - team', msg);

        if (typeof msg.row === 'object') {
            if (typeof final_teams[msg.row.plant] !== 'object') {
                final_teams[msg.row.plant] = {};
            }
            final_teams[msg.row.plant][msg.row.team] = msg.row.value;
        }
    }

    // Clean up
    msg.payload = '';
    delete msg.team;
    delete msg.row;
    delete msg.settings;
    delete msg.outTz;

    for (const line in kernel.period) {
        final_periods[line] = false;

        // line program is enabled
        if ((kernel.disabled[line] || false) !== true) {
            // no periods set for this line
            if (kernel.period[line] === '') {
                // set to off
                final_pilots[line] = false;
            } else {
                let exists = false;
                const plant = kernel.lines[line] || '-';
                const teams = kernel.period[line].split("");
                for (const i in teams) {
                    if (typeof final_teams[plant][teams[i]] === 'boolean') {
                        exists = true;
                        if (final_teams[plant][teams[i]] === true) {
                            final_periods[line] = true;
                        }
                    }
                }
                if (exists) {
                    final_pilots[line] = final_periods[line];
                }
            }
        }
    }

    for (const entity in kernel.state) {
        let esplit = entity.split('|');
        let equipment = esplit[0];
        let component = esplit[1];
        let line = kernel.equipments[equipment] || '-';

        let pilot = final_pilots[line];
        if (typeof pilot === 'boolean'
            && typeof kernel.link[entity] === 'string'
            && [ 'heatswitch', 'heatlink', 'heattoggle', 'heatpulse' ].includes(component)
        ) {
            let state = kernel.state[equipment + '|run'] || '';
            if (typeof state === 'number' && state === 1 && pilot === false) {
                // do not pilot heat to off if equipment is running
            } else {
                msg.kernel = {
                    'type': 'state',
                    'entity': entity,
                    'value': pilot === true ? 1 : 0,
                    'loop': false
                };

                msg.telegram = {
                    'type': 'period',
                    'value': pilot,
                    'entity': equipment,
                    'change': msg.kernel.value !== kernel.state[entity]
                };

                if (component === 'heatpulse') {
                    // Use another node not to block this one
                    msg.state = kernel.state[equipment + '|heat'];
                    node.send([null, msg]);
                } else {
                    node.send([msg, null]);
                }

                node.status({
                    'fill': pilot ? 'green' : 'red',
                    'text': entity + ' = ' + pilot
                });
            }
        }
    }

    return;
