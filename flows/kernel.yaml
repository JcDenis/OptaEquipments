  type: function
  z: f6f2187d.f17ca8
  g: 216f821485a9eb19
  name: data
  func: |-

    // pulse only if current state is not the one we want
    if (msg.kernel.value !== msg.state) {
        // pulse
        msg.kernel.value = 1;
        node.send(msg);

        // Wait pulse duration
        await new Promise(resolve => setTimeout(resolve, 500));

        delete msg.telegram;
        msg.kernel.value = 0;
        node.send(msg);
    }

    return;
