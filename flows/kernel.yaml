- id: abca3aaf7cde8edb
  type: function
  z: f6f2187d.f17ca8
  g: a49a01470fb908e8
  name: day
  func: >-
    msg.row.curday = Number(msg.row.curday);

    msg.row.curtime = Number(msg.row.curtime);


    /* If current time is before dec time and team starts before dec time, this
    is the day before */

    if (msg.row.curtime < msg.row.dectime && msg.row.starttime <
    msg.row.dectime) {
        if (msg.row.curday === 6) {
            msg.row.curday = 0;
        } else {
            msg.row.curday = msg.row.curday + 1;
        }
    }


    /* sunday, sartuday and not s, week and not mand */

    if (msg.row.curday === 0 || (msg.row.curday === 6 && msg.row.team !== 's')
    || (msg.row.curday > 0 && msg.row.curday < 6 && msg.row.team.match((new
    RegExp('^(m|a|n|d)$'))) === null)) {
        msg.row.value = false;
    } else {
        if (msg.row.starttime < msg.row.stoptime) {
            msg.row.value = ((msg.row.curtime > msg.row.starttime) && (msg.row.curtime < msg.row.stoptime)) ? true : false;
        } else {
            /* past midnight */
            msg.row.value = ((msg.row.curtime > msg.row.stoptime) && (msg.row.curtime < msg.row.starttime)) ? false : true;
        }
    }


    flow.set('teams["' + msg.row.plant + '"]["' + msg.row.team + '"]',
    msg.row.value, 'memoryOnly');


    return msg;
