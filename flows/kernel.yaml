- id: 89bd63c1cca31299
  type: function
  z: f6f2187d.f17ca8
  g: 8cc9a474d6cd27ec
  name: hmi
  func: |-
    if (typeof msg.hmi === 'undefined') {
        msg.hmi = {
            'tab':99,
            'page':'',
            'id':'',
            'login':'',
            'level':'',
            'plant':''
        };
    }

    if (typeof msg.hmi.lang !== 'string') {
        msg.hmi.lang = 'en';
    }

    if (typeof msg.tab === 'number') {
        msg.hmi.tab = msg.tab;
        msg.hmi.page = msg.name;
        delete msg.tab;
        delete msg.name;
    }

    if (typeof msg._client?.socketId === 'string') {
        var browser_lang = global.get('browser.' + msg._client.socketId + '.lang', 'memoryOnly');
        if (typeof browser_lang === 'string') {
            msg.hmi.lang = browser_lang;
        }
        msg.hmi.id = msg._client.socketId;

        var user = global.get('user.' + msg.hmi.id, 'memoryOnly');
        if (typeof user === 'object') {
            msg.hmi = Object.assign({}, msg.hmi, user);
        }
    }

    msg.hmi.time = Date.now();

    return msg;
  outputs: 1
  timeout: 0
  noerr: 0
  initialize: ''
  finalize: ''
  libs: []
