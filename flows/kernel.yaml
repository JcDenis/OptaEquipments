- id: 8e9269dd3c4b5b8f
  type: function
  z: f6f2187d.f17ca8
  g: 00f63ad10b00133d
  name: data
  func: >-
    // Update equipment counters from equipment total run meter

    // kernel.meter["equipment|counter"] = "hours|last runmetertotal"


    if (msg.kernel?.type !== 'state' || msg.kernel?.component !==
    'runmetertotal') {

        return;
    }


    const total = Number(msg.kernel.value);

    const equipment = msg.kernel.equipment;

    const kernel = global.get('kernel');

    const family = kernel.families?.[equipment] || '';


    if (!Number.isFinite(total) || family === '') {

        return;
    }


    for (const counter in kernel.counters) {
        if (kernel.counters[counter] !== family) {

            continue;
        }

        const entity = equipment + '|' + counter;
        const msplit = String(kernel.meter?.[entity] ?? '').split('|');
        let hours = Number(msplit[0]) || 0;
        const last = msplit.length > 1 ? Number(msplit[1]) : NaN;

        if (Number.isFinite(last)) {
            // Nothing new
            if (total === last) {

                continue;
            }

            // Device total meter went back (device reset or replaced): count from 0
            let delta = total >= last ? total - last : total;
            hours += delta;
        }
        // else first seen: start counting from current total

        node.status({
            'fill': 'green',
            'text': entity + ' = ' + (Math.round(hours * 100) / 100)
        });

        node.send({
            'topic': '',
            'payload': '',
            'kernel': {
                'type': 'meter',
                'entity': entity,
                'value': (Math.round(hours * 100) / 100) + '|' + total,
                'loop': false
            }
        });
    }


    return;
