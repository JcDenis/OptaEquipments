  type: function
  z: f6f2187d.f17ca8
  g: b0a29d62b8e00f94
  name: reverse
  func: >-
    function inverse(obj){
      let retobj = {};
      for(var key in obj){
        retobj[obj[key]] = key;
      }
      return retobj;
    }


    flow.set('reverse_endpoint',{},'memoryOnly');

    flow.set('reverse_endpoint',inverse(global.get('kernel.endpoint','default')),'memoryOnly');


    msg.payload = '';

    return msg;
