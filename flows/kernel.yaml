- id: 78e60df6e7d55f08
  type: function
  z: f6f2187d.f17ca8
  g: 216f821485a9eb19
  name: periods states
  func: |-
    msg.payload = '';

    let final_teams = flow.get('teams', 'memoryOnly');
    let final_periods = {};
    let final_pilots = {};

    delete msg.row;
    delete msg.settings;
    delete msg.outTz;
    delete msg.team;
    flow.set('teams', undefined, 'memoryOnly');

    let periods = global.get('kernel.period','memoryOnly')||{};
    for (const line in periods) {
        final_periods[line] = false;

        /* line program is enabled */
        if ((global.get('kernel.disabled["' + line + '"]', 'memoryOnly')||false) !== true) {
            /* no periods set for this line */
            if (periods[line] === '') {
                /* set to off */
                final_pilots[line] = false;
            } else {
                let plant = global.get('kernel.lines["' + line + '"]', 'memoryOnly');
                let exists = false;
                let teams = periods[line].split("");
                for (const i in teams) {
                    if (typeof final_teams[plant][teams[i]] === 'boolean') {
                        exists = true;
                        if (final_teams[plant][teams[i]] === true) {
                            final_periods[line] = true;
                        }
                    }
                }
                if (exists) {
                    final_pilots[line] = final_periods[line];
                }
            }
        }
    }

    let states = global.get('kernel.state','memoryOnly')||{};
    for (const entity in states) {
        let esplit = entity.split('|');
        let equipment = esplit[0];
        let component = esplit[1];
        let line = global.get('kernel.equipments["' + equipment + '"]', 'memoryOnly');

        let pilot = final_periods[line];
        if (typeof pilot === 'boolean'
            && typeof global.get('kernel.link["' + entity + '"]', 'memoryOnly') === 'string'
            && component.match((new RegExp('^(heatswitch|heatlink|heattoggle|heatpulse)$'))) !== null
        ) {
            let state = global.get('kernel.state["' + equipment + '|run"]', 'memoryOnly');
            if (typeof state === 'number' && state === 1) {
                /* do not pilot heat if euipement is running */
            } else {
                let reverse = global.get('kernel.reverse["' + entity + '"]', 'memoryOnly');
                let value = reverse === true ? (pilot === true ? 0 : 1) : (pilot === true ? 1 : 0);

                msg.kernel = {
                    'type':'state',
                    'entity':entity,
                    'value':value,
                    'loop':false
                };

                msg.telegram = {
                    'type':'period',
                    'value':pilot,
                    'entity':equipment,
                    'change':msg.kernel.value !== states[entity]
                };

                if (component === 'heatpulse') {
                    /* pulse only if current state is not the one we want */
                    if (msg.kernel.value !== global.get('kernel.state["' + equipment + '|heat"]', 'memoryOnly')) {
                        /* pulse */
                        msg.kernel.value = 1;
                        node.send(msg);
                        await new Promise(resolve => setTimeout(resolve, 500));
                        msg.kernel.value = 0;
                        node.send(msg);
                    }
                } else {
                    node.send(msg);
                }
            }
        }
    }

    return;
  outputs: 1
