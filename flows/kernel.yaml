  type: function
  z: f6f2187d.f17ca8
  g: bcd29c14e67166df
  name: data
  func: >-
    // Compute period current day


    const one_day = 86400000; // 24h in ms


    msg.row.curday = Number(msg.row.curday);

    msg.row.curtime = Number(msg.row.curtime);

    msg.row.curts = Number(msg.row.curts);


    /* team start before midnight and end after midnight and current time is
    before team start time*/

    if (msg.row.stoptime < msg.row.starttime && msg.row.curtime <
    msg.row.starttime) {
        msg.row.curday = msg.row.curday - 1;
        msg.row.curts = msg.row.curts - one_day;
    }


    /* then regain week day */

    if (msg.row.curday === 7) {
        msg.row.curday = 0;
    } else if (msg.row.curday === -1) {
        msg.row.curday = 6;
    }


    msg.row.value = false;


    /* If week day and week team or saturday day and saturday team */

    if ((msg.row.curday > 0 && msg.row.curday < 6 && msg.row.team.match((new
    RegExp('^(m|a|n|d)$'))) !== null) 
        || (msg.row.curday === 6 && msg.row.team === 's')
    ) {
        if (msg.row.starttime < msg.row.stoptime) {
            msg.row.value = ((msg.row.curtime > msg.row.starttime) && (msg.row.curtime < msg.row.stoptime)) ? true : false;
            //...
        } else {
            /* past midnight */
            msg.row.value = ((msg.row.curtime > msg.row.stoptime) && (msg.row.curtime < msg.row.starttime)) ? false : true;
            //...
        }
    }


    /* Check if its an holiday */

    const curdate = new Date(msg.row.curts); 

    msg.row.curdate = ("0" + (curdate.getMonth() +1)).slice(-2) + "-" + ("0" +
    curdate.getDate()).slice(-2);

    const holidays = (global.get('kernel.holiday["' + msg.row.plant + '"]') ||
    '').split('|');

    for (const k in holidays) {
        if (holidays[k] === msg.row.curdate) {
            msg.row.value = false;
        }
    }


    return msg;
