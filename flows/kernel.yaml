  func: |-
    if (msg.telegram.change === true) {
        //node.status({'fill':(msg.telegram.value?'green':'red'),'text':msg.telegram.entity});

        if (msg.telegram.type === 'period') {
            let line = global.get('kernel.equipments["' + msg.telegram.entity + '"]', 'memoryOnly')||'-';
            let plant = global.get('kernel.lines["' + line + '"]','memoryOnly')||'-';
            let name = global.get('kernel.plant["' + plant + '"]', 'memoryOnly')||'???';

            return {
                'topic':'',
                'payload':{
                    'type':'message',
                    'content': (global.get('kernel.equipment["' + msg.telegram.entity + '"]', 'memoryOnly') || '???') + (msg.telegram.value ? ' mis en chauffe' : ' mis en veille') + ' (' + name + ')'
                }
            }
        } else if (msg.telegram.type === 'watchdog') {
            let dsplit = msg.telegram.entity.split('|');

            return {
                'topic':'',
                'payload':{
                    'type':'message',
                    'content': 'Matériel ' + (global.get('describe.model["' + dsplit[0] + '"]','memoryOnly')||'???') + ' ' + dsplit[1] + (msg.telegram.value ? ' est connecté' : ' est déconnecté')
                }
            }
        }
    }

    return;
