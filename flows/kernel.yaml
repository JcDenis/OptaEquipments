- id: 936bf4cb754685d1
  type: function
  z: f6f2187d.f17ca8
  g: 7d481df1a0362e5a
  name: row
  func: >-
    let esplit = msg.row.entity.split('|');

    msg.row.equipment = esplit[0];

    msg.row.component = esplit[1];

    msg.row.line = global.get('kernel.equipments["' + msg.row.equipment + '"]',
    'default');


    let pilot = flow.get('pilots["' + msg.row.line + '"]', 'memoryOnly');

    if (typeof pilot === 'boolean'
        && typeof flow.get('reverse_endpoint["' + msg.row.entity + '"]', 'memoryOnly') === 'string'
        && msg.row.component.match((new RegExp('^(heatswitch|heatlink|heattoggle|heatpulse)$'))) !== null
    ) {
        let entity = msg.row.equipment + '|run';
        let state = global.get('kernel.state["' + entity + '"]', 'default');
        if (typeof state === 'number' && state === 1) {
            /* do not pilot heat if euipement is running */
        } else {
            let reverse = global.get('kernel.reverse["' + msg.row.entity + '"]', 'default');
            msg.row.value =  reverse === true ? (pilot === true ? 0 : 1) : (pilot === true ? 1 : 0);

            msg.kernel = {
                'type':'state',
                'entity':msg.row.entity,
                'value':msg.row.value,
                'loop':false
            };

            if (msg.row.component === 'heatpulse') {
                /* pulse only if current state is not the one we want */
                if (msg.row.value !== global.get('kernel.state["' + msg.row.equipment + '|heat"]', 'default')) {
                    /* pulse */
                    msg.kernel.value = 1;
                    node.send(msg);
                    await new Promise(resolve => setTimeout(resolve, 500));
                    msg.kernel.value = 0;
                    node.send(msg);
                }
            } else {
                node.send(msg);
            }
        }
    }


    /* end split node */

    msg.kernel = {};


    return [null,msg];
