- id: f205eb414c91131b
  type: function
  z: f6f2187d.f17ca8
  g: 63238b6d584649d5
  name: data
  func: >-

    // Check required data

    if (typeof msg.payload !== 'object' || typeof msg.flow !== 'string' ||
    msg.flow === '') {

        return msg;
    }


    // Get memories

    let describe = global.get('describe'); // autoupdate


    // Get default page template

    const page = {
        'tab': 0,
        'id': '-',
        'name': 'Unkown',
        'icon': 'mdi-border-none-variant',
        'level': {
            'admin': false,
            'rt': false,
            'tech': false,
            'rp': false,
            'prod': false
        }
    };


    // Parse data

    for (const k in page) {
        if (!msg.payload.hasOwnProperty(k)) {
            
            continue;
        }
        if (typeof page[k] === 'object') {
            for (const l in page[k]) {
                if (typeof msg.payload[k] === 'object' && msg.payload[k].hasOwnProperty(l)) {
                    page[k][l] = msg.payload[k][l];
                }
            }
        }
        else {
            page[k] = msg.payload[k];
        }
    }


    // Save data

    describe.pages[msg.flow] = page;


    // Clean msg

    msg.payload = '';


    return msg;
  outputs: 1
