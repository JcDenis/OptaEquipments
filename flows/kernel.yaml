- id: 78e60df6e7d55f08
  type: function
  z: f6f2187d.f17ca8
  g: ac235be34fa874cd
  name: row
  func: >-
    msg.row.plant = global.get('kernel.lines["' + msg.row.line + '"]',
    'default');

    msg.row.disabled = global.get('kernel.disabled["' + msg.row.line + '"]',
    'default');


    flow.set('periods["' + msg.row.line + '"]', false, 'memoryOnly');


    /* line program is disabled */

    if (msg.row.disabled == true) {
        /* nothing to do */
        return msg;
    }


    /* no periods set for this line */

    if (msg.payload === '') {
        /* set to off */
        msg.row.value = false;
        flow.set('pilots["' + msg.row.line + '"]', false, 'memoryOnly');

        return msg;
    } else {
        let exists = false;
        let teams = msg.payload.split("");
        for (const i in teams) {
            if (typeof flow.get('teams["' + msg.row.plant + '"]["' + teams[i] + '"]', 'memoryOnly') === 'boolean') {
                exists = true;
                if (flow.get('teams["' + msg.row.plant + '"]["' + teams[i] + '"]', 'memoryOnly') === true) {
                    flow.set('periods["' + msg.row.line + '"]', true, 'memoryOnly');
                }
            }
        }
        if (exists && typeof flow.get('periods["' + msg.row.line + '"]', 'memoryOnly') === 'boolean') {
            msg.row.value = flow.get('periods["' + msg.row.line + '"]', 'memoryOnly');
            flow.set('pilots["' + msg.row.line + '"]', msg.row.value, 'memoryOnly');
        }
    }


    return msg;
