- id: 2d6c7781e95f7c7c
  type: function
  z: f6f2187d.f17ca8
  g: 4454c8408a7c43de
  name: Clean old historics
  func: |-
    let i = 0;
    let limit = Math.round((Date.now() / 1000) - (24 * 60 * 60)); // 24h
    let historics = global.get('historic','memoryOnly')||{};
    for (const entity in historics) {
        let tsplit = historics[entity];
        for (const ts in tsplit) {
            if (Number(ts) < limit) {
                // Delete old timestamp
                global.set('historic["' + entity + '"]["ts"]',undefined,'memoryOnly');
                i++
            }
        }
        if (global.get('historic["' + entity + '"]','memoryOnly').length === 0) {
            // Delete entity
            global.set('historic["' + entity + '"]',undefined,'memoryOnly');
        }
    }

    node.status({'text':i});

    return;
  outputs: 1
  timeout: 0
  noerr: 0
