- id: 54590d02b28b5c35
  type: function
  z: f6f2187d.f17ca8
  g: dcb47b97829a1b78
  name: data
  func: |-
    // Prepare app context

    // backup and restore
    msg = await node.linkcall('kernel - memory', msg);

    // Set describe
    global.set('describe', {
        'app': {
            'automate': 'optaequipments',
            'version': '0.6.0',
            'title': 'Live Equipments',
            'vendor': 'Opta Equipments by JcDenis'
        },
        'pages': {
            // @see kernel - page
        },
        'groups': {
            'run': [ 'run','runmeter', 'runmetertotal', 'runreset', 'runmirror' ],
            'cycle': [ 'cycle', 'cyclemeter', 'cyclemetertotal', 'cyclereset', 'cyclemirror' ],
            'heat': [ 'heat', 'heatswitch' ],
            'uptime': [ 'uptime', 'load1meter', 'load5meter', 'load15meter', 'memorymeter', 'diskmeter' ],
            'voltage': [ 'voltage', 'power' ]
        },
    });

    // Set and clean required memories
    global.set('dictionary', { });
    global.set('auth', { });
    global.set('user', { });
    global.set('form', { });
    global.set('menu', { });

    // Various
    msg = {
        'topic': '',
        'payload': '',
        'options': [ { 'label':'', 'value':'' } ]
    };

    // Get user from UI element
    msg = await node.linkcall('kernel - hmi', msg);

    // build reverse links
    msg = await node.linkcall('kernel - rlink', msg);

    // Go to pages registration
    node.send([msg, null]);

    // Wait registration end
    await new Promise(resolve => setTimeout(resolve, 100));

    // Regain pages order
    let describe = global.get('describe'); // autoupdate
    let tabs = [];
    for (const k in describe.pages) {
        tabs.push({
            'tab': describe.pages[k]['tab'],
            'page': k,
            'data' : describe.pages[k]
        });
    }
    tabs.sort((a, b) => a.tab - b.tab);
    describe.pages = {};
    for (let i = 0; i< tabs.length; i++) {
        describe.pages[tabs[i]['page']] = tabs[i]['data'];
    }

    // Go on
    return [null, msg];
