- id: bd4743d319d07a5a
  type: function
  z: f6f2187d.f17ca8
  g: 216f821485a9eb19
  name: devices watchdog
  func: >-
    let newMsg = {
        'kernel':{},
        'topic':'',
        'payload':''
    };


    let limit = Math.round(Date.now() / 1000) -
    (global.get('kernel.app.watchdog', 'memoryOnly')||120);


    let devices = global.get('kernel.device', 'memoryOnly');

    if (typeof devices === 'object') {
        for (const device in devices) {

            newMsg.kernel = {
                'type':'device',
                'entity':device,
                'value':(global.get('kernel.watchdog["' + device + '"]', 'memoryOnly')||0) < limit ? 0:1,
                'loop':false
            };

            newMsg.telegram = {'change':false};
            if (newMsg.kernel.value !== global.get('kernel.device["' + device + '"]','memoryOnly')) {
                newMsg.telegram = {
                    'type':'watchdog',
                    'change':true,
                    'entity':device,
                    'value':newMsg.kernel.value==1?true:false
                }
            }

            node.send(newMsg);
        }
    }


    return;
