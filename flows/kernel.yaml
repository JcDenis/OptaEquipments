- id: fd39d13ae9c195f3
  type: function
  z: f6f2187d.f17ca8
  g: 32da9b1ae024e8bb
  name: data
  func: >-
    // Check ui page action


    // Get user from UI element

    msg = await node.linkcall('kernel - hmi', msg);


    // Get memories

    let user = global.get('user'); // autoupdate

    let form = global.get('form'); // autoupdate

    let pages = global.get('describe.pages');


    // Initialize some variables

    if (typeof form[msg.hmi.id] !== 'object') {
        form[msg.hmi.id] = { };
    }


    // On unwanted state, stop here

    if (!['connect', 'change', 'lost'].includes(msg.payload)) {
        if (typeof msg.hmi.id === 'string' && msg.hmi.id !== '') {
            delete user[msg.hmi.id];
            delete form[msg.hmi.id];
        }

        return;
    }


    // On connect or lost connection, go to auth page

    if (['connect', 'lost'].includes(msg.payload)) {
        msg.payload = pages.auth.name || '';
        msg.hmi.page = msg.payload;

        node.send([null, null, msg]);
        //return;
    }


    // Prepare

    msg.buttons = [];

    msg.payload = {
        'pages': {
            'show': [],
            'hide': []
        }
    };

    msg.page_data = {
        'id': 'auth',
        'title': '',
        'vendor': 'OptaEquipments v' + (global.get('describe.app.version') || '0.0.0') + ' for ' + (global.get('kernel.app.vendor') || global.get('describe.app.vendor')),
        'header': global.get('kernel.app.title') || global.get('describe.app.title'),
        'lang': 'en'
    };


    // Check user page right

    let allowed = false;

    for (const page in pages) {
        if (page === 'auth' || pages[page]['level'][msg.hmi.level] === true) {
            msg.buttons.push({
                'id': page,
                'icon': pages[page]['icon'],
                'title': msg.dictionary.option_page[page] || pages[page]['name']
            });
            msg.payload.pages.show.push(pages[page]['name']);
        }
        else {
            msg.payload.pages.hide.push(pages[page]['name']);
        }

        if (pages[page]['tab'] === msg.hmi.tab) {
            msg.page_data.lang = msg.dictionary.lang;
        }

        if (pages[page]['tab'] === msg.hmi.tab && pages[page]['level'][msg.hmi.level] === true) {
            msg.page_data.id = page;
            msg.hmi.page = msg.dictionary.option_page[page];
            allowed = true;
        }
    }


    if (allowed === false) {
        msg.hmi.tab = pages.auth.tab || 99;
        msg.hmi.page = msg.dictionary.option_page.auth;
    }


    // user plant

    if (msg.hmi.plant !== '' && msg.hmi.plant !== (form[msg.hmi.id]["plant"] ||
    '-')) {
        form[msg.hmi.id]["plant"] = msg.hmi.plant;
        form[msg.hmi.id]["line"] = '';
        form[msg.hmi.id]["equipment"] = '';
    }

    form[msg.hmi.id]["ts"] = Date.now();


    // page process

    let newMsg = {
        'topic': '',
        'payload': msg.hmi.page,
        'options': [{ 'label': '', 'value': '' }],
        'hmi': msg.hmi,
        'dictionary': msg.dictionary,
        '_client': msg._client
    };


    // UI menu

    msg.page_data.title = msg.hmi.page;


    delete msg.dictionary;


    node.send([msg, null, null]);


    delete msg.page_data;


    return [null, newMsg, null];
