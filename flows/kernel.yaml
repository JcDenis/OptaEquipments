- id: 89bd63c1cca31299
  type: function
  z: f6f2187d.f17ca8
  g: 8cc9a474d6cd27ec
  name: data
  func: |-
    // Prepare HMI

    if (typeof msg.hmi === 'undefined') {
        msg.hmi = {
            'tab': 99,
            'page': '',
            'id': '',
            'login': '',
            'level': '',
            'plant': '',
            'lang': 'en',
            'time': Date.now()
        };
    }

    if (typeof msg.tab === 'number' && typeof msg.name === 'string') {
        msg.hmi.tab = msg.tab;
        msg.hmi.page = msg.name;
        delete msg.tab;
        delete msg.name;
    }

    if (typeof msg._client?.socketId === 'string') {
        let browser_lang = global.get('browser["' + msg._client.socketId + '"]["lang"]', 'memoryOnly');
        if (typeof browser_lang === 'string') {
            msg.hmi.lang = browser_lang;
        }
        msg.hmi.id = msg._client.socketId;

        let user = global.get('user["' + msg.hmi.id + '"]', 'memoryOnly');
        if (typeof user === 'object') {
            global.set('user["' + msg.hmi.id + '"]["time"]', Date.now(), 'memoryOnly');
            msg.hmi = Object.assign({}, msg.hmi, user);
        }
    }

    if (msg.tab === 99) {
        global.set('form', {}, 'memoryOnly');
    }

    delete msg.reset; //???

    // Initialize additional dictionary data
    const pages = { ...(global.get('describe.pages', 'memoryOnly') || { }) };
    for (const p in pages) {
        msg.dictionary[p] = {};
    }

    return msg;
