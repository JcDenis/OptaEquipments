- id: 274b5abfd4525a98
  type: function
  z: f6f2187d.f17ca8
  g: bcd29c14e67166df
  name: data
  func: >-
    // Build period loop row


    const kernel = global.get('kernel');


    /* tree */

    let tsplit = msg.team.split('|');

    msg.row.plant = tsplit[0];

    msg.row.team = tsplit[1];


    /* plant offset (dec) */

    let dec = Number(kernel.day[msg.row.plant] || 0);

    msg.row.dectime = dec * 100; // ex: 600, in order to compare to
    starttime/stoptime 630, 2330...


    /* team time */

    let psplit = msg.payload.split('|');

    msg.row.starttime = Number(psplit[0].split(':').join('')); //convert
    calendar time to comparable number

    msg.row.stoptime = Number(psplit[1].split(':').join(''));


    /* datetime formatter tz */

    msg.outTz = msg.row.tz = kernel.tz[msg.row.plant] || 'Europe/Paris';


    return msg;
