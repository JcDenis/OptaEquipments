      - 2328d5396e61d3e1
    - - 186467962929c0f8
      - 2328d5396e61d3e1
- id: fca30e25f5087f5a
  type: function
  z: 476eb6fc04c55cec
  g: a2c5edf7acc56d7a
  name: user plant
  func: |-
    if (msg.enabled !== true) {
        // page is disabled
        msg.class = 'remove';
        msg.enabled = false;
        msg.payload = '';

        return [msg, null, msg];
    }


    if (msg.hmi.plant === '') {
        // admin can select a plant
        msg.payload = global.get('form["' + msg.hmi.id + '"]["plant"]', 'memoryOnly') || '';

        if (msg.payload === '') {
            // user must selected a plant

            return [null, null, msg];
        } else {
            // show selected plant

            return [null, msg, msg];
        }
    } else {
        // user is linked to a plant
        msg.payload = msg.hmi.plant;

        return [null, msg, null];
    }
  outputs: 3
