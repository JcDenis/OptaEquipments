- id: 6cf8cb9e6b8ecf5c
  type: function
  z: 476eb6fc04c55cec
  g: d509ef3b5101effa
  name: tab &  level
  func: >-
    let check = 'alert';


    msg.class = 'remove';

    msg.enabled = false;

    msg.topic = '';

    msg.payload = '';


    if (msg.hmi.tab === global.get('describe.pages["' + check +
    '"]["tab"]','memoryOnly')) {
        if (typeof global.get('describe.pages["' + check + '"]["level"]["' + msg.hmi.level + '"]','memoryOnly') === 'boolean'
            && global.get('describe.pages["' + check + '"]["level"]["' + msg.hmi.level + '"]','memoryOnly') === true
        ) {
            msg.class = '';
            msg.enabled = true;

            return [null,msg,null];
        } else {
            return [null, null, msg];
        }
    }


    if (msg.hmi.tab === 99) {
        return [msg,null,null];
    }


    return [null,null,msg];
  outputs: 3
  timeout: 0
  noerr: 0
  initialize: ''
  finalize: ''
  libs: []
  x: 290
