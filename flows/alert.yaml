- id: 953414d1b751a30d
  type: function
  z: 476eb6fc04c55cec
  g: a2c5edf7acc56d7a
  name: data
  func: |-
    // Get plant alerts

    // Reset UI
    if (msg.enabled !== true) {

        return [ msg, msg ];
    }

    msg.payload = [];
    let i = 0;

    // Rows
    const alerts = { ...(global.get('kernel.alert', 'memoryOnly') || { }) };
    for (const alert in alerts) {
        let asplit = alert.split('|');
        let row = {};
        row.entity = alert;
        row.equipment = asplit[0];
        row.component = asplit[1];
        row.limit = alerts[alert];
        row.line = global.get('kernel.equipments["' + row.equipment + '"]', 'memoryOnly') || '';
        row.plant = global.get('kernel.lines["' + row.line + '"]', 'memoryOnly') || '';

        let state = row.equipment + '|' + 'run';
        if (row.component === 'cyclemeter') {
            state = row.equipment + '|' + 'cycle';
        }

        if ((global.get('form["' + msg.hmi.id + '"]["plant"]', 'memoryOnly') || '') === row.plant 
            && typeof global.get('kernel.link["' + state + '"]', 'memoryOnly') === 'string' 
            && typeof global.get('kernel.link["' + row.entity + '"]', 'memoryOnly') === 'string' 
        ) {
            row.plant_name = global.get('kernel.plant["' + row.plant + '"]', 'memoryOnly') || '';
            row.line_name = global.get('kernel.line["' + row.line + '"]', 'memoryOnly') || '';
            row.equipment_name = global.get('kernel.equipment["' + row.equipment + '"]', 'memoryOnly') || '';
            row.state = global.get('kernel.state["' + state + '"]', 'memoryOnly') || 0;
            row.state_color = row.state > 0 ? msg.dictionary.option_color.on : msg.dictionary.option_color.off;
            row.alert = global.get('kernel.state["' + row.entity + '"]', 'memoryOnly') || 0;
            row.alert_full = row.alert + ' / ' + row.limit
            row.percent = Math.round(Number(row.alert) * 100 / Number(row.limit));
            row.percent_full = row.percent.toString() + '%';
            row.diff = Math.round((Number(row.alert) - Number(row.limit))*10) / 10;
            row.diff_color = row.percent < 75 ? msg.dictionary.option_color.on : (row.percent < 100 ? msg.dictionary.option_color.median : msg.dictionary.option_color.off)

            // chek if device is offline
            let ssplit = (global.get('kernel.link["' + state + '"]', 'memoryOnly') || '').split('|');
            if (global.get('kernel.device["' + ssplit[0] + '|' + ssplit[1] + '"]', 'memoryOnly') !== 1) {
                row.state_color = msg.dictionary.option_color.none;
            }

            msg.payload[i++] = row;
        }
    }

    // sort
    if (i > 0) {
        msg.class = '';
        msg.enabled = true;
        msg.payload.sort((a, b) => a.percent < b.percent ? 1 : -1);
    }

    // lang
    if (msg.hmi.lang === 'fr') {

        return [ msg, null ];
    }

    return [ null, msg ];
  outputs: 2
