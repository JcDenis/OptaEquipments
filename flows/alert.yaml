- id: fca30e25f5087f5a
  type: function
  z: 476eb6fc04c55cec
  g: a2c5edf7acc56d7a
  name: data
  func: |-
    // Get user plants

    // Reset UI
    if (msg.enabled !== true) {
        // page is disabled
        msg.class = 'remove';
        msg.enabled = false;
        msg.payload = '';

        return [msg, msg];
    }


    // Plant was not defined for the user
    if (msg.hmi.plant === '') {
        // admin can select a plant
        msg.payload = global.get('form["' + msg.hmi.id + '"]["plant"]', 'memoryOnly') || '';

        if (msg.payload === '') {
            // user must selected a plant

            return [null, msg];
        } else {
            // show selected plant

            return [msg, msg];
        }
    // Plant is defined for the user
    } else {
        // user is linked to a plant
        msg.payload = msg.hmi.plant;

        return [msg, null];
    }
