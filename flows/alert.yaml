- id: fca30e25f5087f5a
  type: function
  z: 476eb6fc04c55cec
  g: a2c5edf7acc56d7a
  name: user plant
  func: |-
    if (msg.enabled === true) {
        if (msg.hmi.plant !== '') {
            flow.set('form["' + msg.hmi.id + '"]["plant"]',msg.hmi.plant,'memoryOnly');

            return [msg,null];
        } else {
            return [null, msg];
        }
    }

    return;
