- id: fca30e25f5087f5a
  type: function
  z: 476eb6fc04c55cec
  g: a2c5edf7acc56d7a
  name: data
  func: |-
    // Get user plants

    // Check if required page is current flow
    msg.check = env.get('NR_FLOW_NAME');
    msg = await node.linkcall('ui - tab', msg);

    // Reset UI
    if (msg.enabled !== true) {
        // page is disabled
        msg.class = 'remove';
        msg.enabled = false;
        msg.payload = '';

        return [ msg, msg ];
    }

    // Plant was not defined for the user
    if (msg.hmi.plant === '') {
        // admin can select a plant
        msg.payload = global.get('form["' + msg.hmi.id + '"]["plant"]', 'memoryOnly') || '';

    // Get plants for form
    msg = await node.linkcall('option - plant', msg);

        // user must selected a plant
        if (msg.payload === '') {

            return [ null, msg ];
        }
        // show selected plant

        return [ msg, msg ];
    }

    // Plant is defined for the user
    msg.payload = msg.hmi.plant;

    return [ msg, null ];
