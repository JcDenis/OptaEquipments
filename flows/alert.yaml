- id: 28484d7e89befc41
  type: function
  z: 476eb6fc04c55cec
  g: a2c5edf7acc56d7a
  name: data
  func: |-
    // Compute user form

    const form = { ...(global.get('form', 'memoryOnly') || { }) };

    // Should not happened
    if (typeof form[msg.hmi.id] !== 'object') {
        form[msg.hmi.id] = {};
    }

    // Update form
    form[msg.hmi.id]['plant'] = msg.payload.plant;
    form[msg.hmi.id]['line'] = msg.payload.line;
    form[msg.hmi.id]['equipment'] = msg.payload.equipment;

    // Save form
    global.set('form', form, 'memoryOnly');

    delete msg.action;

    // UI redirect
    msg.hmi.tab = global.get('describe.pages.detail.tab', 'memoryOnly') || '';
    msg.hmi.name = global.get('describe.pages.detail.page', 'memoryOnly') || '';
    msg.payload = msg.hmi.tab;

    return msg;
