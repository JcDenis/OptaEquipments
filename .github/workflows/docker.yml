name: Docker images

# Builds and publishes the application and MQTT images to GitHub Container Registry,
# tagged with the version of package.json and "latest".
on:
  push:
    branches: [master]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: meta
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nodered/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/optaequipments:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/optaequipments:latest

      - name: MQTT image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/mosquitto/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/optaequipments-mqtt:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/optaequipments-mqtt:latest
